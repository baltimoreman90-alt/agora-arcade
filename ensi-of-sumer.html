<style>
/* Layout: a ruler's council table. Lapis and shell inlay (Standard of Ur), carnelian for danger and action, gold for honor. Main column of tabs, side column with the map of Sumer. */
:root{
  --bg:#E7EAF0;          /* pale limestone */
  --panel:#F6F7FA;       /* shell */
  --sunk:#DCE1EA;
  --ink:#14214A;         /* lapis ink */
  --muted:#4F5B7C;
  --line:#BFC7D8;
  --lapis:#1F3A8A;
  --lapis-ink:#FFFFFF;
  --carnelian:#B5432C;
  --gold:#9A6A12;
  --good:#2E7A4A;
  --bad:#B5432C;
  --river:#7FA3D6;
  --land:#D9CBA8;
  --gulf:#9DB8DE;
  --display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --cun:"Noto Sans Cuneiform","Segoe UI Historic",serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1634;--panel:#132250;--sunk:#0A1230;--ink:#EFE7D4;--muted:#A9B3CF;--line:#2A3B70;
  --lapis:#5B7FE0;--lapis-ink:#0C1634;--carnelian:#E0745A;--gold:#E2B04F;--good:#6CC48C;--bad:#F08A70;
  --river:#3D63B8;--land:#2A3358;--gulf:#1E3A7A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1634;--panel:#132250;--sunk:#0A1230;--ink:#EFE7D4;--muted:#A9B3CF;--line:#2A3B70;
  --lapis:#5B7FE0;--lapis-ink:#0C1634;--carnelian:#E0745A;--gold:#E2B04F;--good:#6CC48C;--bad:#F08A70;
  --river:#3D63B8;--land:#2A3358;--gulf:#1E3A7A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}

.report li{margin-bottom:6px}

.report .good::marker{color:var(--good)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}

.goods{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.goods label{flex-direction:column;align-items:flex-start;gap:2px;font-size:.8rem;font-weight:700;color:var(--muted)}
.msg{font-size:.9rem;padding:8px 10px;border-radius:var(--r);background:var(--sunk)}
.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}

/* side */
.side{display:flex;flex-direction:column;gap:16px}
.map svg{width:100%;height:auto;display:block}
.map text{font-family:var(--body);font-size:13px;fill:var(--ink)}
.standings li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.standings{list-style:none;padding:0;margin:0}
.standings .rk{color:var(--muted);margin-right:4px}
.chron{max-height:420px;overflow:auto;padding-right:4px}
.chron .y{font-family:var(--display);color:var(--gold);margin-top:10px}

.endbar{position:sticky;bottom:0;margin-top:20px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* full screens */
.screen{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding-block:40px}
.screen .big{font-size:clamp(2.4rem,7vw,4.4rem);font-family:var(--display);line-height:1}
.glyphs{font-family:var(--cun);font-size:2rem;color:var(--gold);letter-spacing:.3em}
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.setup{grid-template-columns:minmax(0,1fr)}}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.mode{grid-template-columns:1fr}}
.mode button{text-align:left;font-weight:400;display:flex;flex-direction:column;gap:4px;padding:12px}
.mode button[aria-pressed="true"]{border:2px solid var(--lapis);background:var(--sunk)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.teamrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.modal{position:fixed;inset:0;background:rgba(5,10,30,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal .panel{max-width:860px;width:100%;display:flex;flex-direction:column;gap:16px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;text-align:left;width:100%;max-width:900px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<script id="engine">
/* ================= ENGINE ================= */
var G=null;
const RES=['barley','textiles','bricks','silver','timber','copper'];
const RI={
  barley:{n:'Barley',u:'gur',v:1,g:'𒊺'},
  textiles:{n:'Textiles',u:'bolts',v:3,g:'𒌆'},
  bricks:{n:'Bricks',u:'loads',v:1,g:'𒋞'},
  silver:{n:'Silver',u:'shekels',v:5,g:'𒆬'},
  timber:{n:'Timber',u:'logs',v:4,g:'𒄑'},
  copper:{n:'Copper',u:'ingots',v:6,g:'𒍐'}
};
const JOBS={
  farm:{n:'Farmers',out:'barley',rate:3,blurb:'Work the irrigated barley fields. Each farmer grows about 3 gur.'},
  weave:{n:'Weavers',out:'textiles',rate:2,blurb:'Spin wool into cloth, Sumer\'s main export. 2 bolts each.'},
  brick:{n:'Brickmakers',out:'bricks',rate:3,blurb:'Mold river clay into sun-dried bricks. 3 loads each.'},
  soldier:{n:'Soldiers',out:null,blurb:'Guard the walls and march on campaign. Each eats extra and costs silver.'}
};
const CITY_DEFS=[
  {id:'kish',name:'Kish',god:'Zababa',x:80,y:52,perk:'Holds the honored title "King of Kish": +15 Prestige.',apply:c=>{c.prestige+=15}},
  {id:'shuruppak',name:'Shuruppak',god:'Sud',x:258,y:200,perk:'A city of storehouses: starts with a Granary.',apply:c=>{c.bld.granary=1}},
  {id:'umma',name:'Umma',god:'Shara',x:340,y:226,perk:'Hardened border fighters: +5 Soldiers.',apply:c=>{c.pop+=5;c.jobs.soldier+=5}},
  {id:'lagash',name:'Lagash',god:'Ningirsu',x:446,y:274,perk:'Famous canal builders: starts with a Canal.',apply:c=>{c.bld.canal=1}},
  {id:'uruk',name:'Uruk',god:'Inanna',x:286,y:296,perk:'The walls of Gilgamesh: starts with City Walls.',apply:c=>{c.bld.walls=1}},
  {id:'ur',name:'Ur',god:'Nanna',x:384,y:362,perk:'A port on the Gulf: starts with a Market.',apply:c=>{c.bld.market=1}},
  {id:'eridu',name:'Eridu',god:'Enki',x:346,y:398,perk:'The oldest city, home of Enki: starts with a Temple.',apply:c=>{c.bld.temple=1}}
];
const NIPPUR={x:206,y:132};
const BLD={
  canal:{n:'Irrigation Canal',max:5,cost:l=>({bricks:25+15*l}),eff:'+15% barley per level. Canals slowly raise salt in the soil.'},
  granary:{n:'Granary',max:3,cost:l=>({bricks:25+15*l,timber:4+4*l}),eff:'+150 barley storage per level. Extra grain spoils without it.'},
  houses:{n:'Mudbrick Houses',max:6,cost:l=>({bricks:20+10*l,timber:3+3*l}),eff:'+20 housing per level so your population can grow.'},
  temple:{n:'Temple & Ziggurat',max:5,cost:l=>({bricks:40+25*l,timber:8+6*l,silver:8+6*l}),eff:'+7 Order and +2 Prestige every year per level.'},
  walls:{n:'City Walls',max:4,cost:l=>({bricks:35+20*l,timber:4+3*l}),eff:'+25% defense per level.'},
  forge:{n:'Bronze Workshop',max:3,cost:l=>({bricks:15+10*l,copper:8+6*l,timber:6+4*l}),eff:'+20% soldier strength per level. Needs imported copper.'},
  school:{n:'Edubba (Scribal School)',max:3,cost:l=>({bricks:25+15*l,silver:12+8*l}),eff:'+1 mission per year, better spies and envoys, sharper reports on rivals.'},
  market:{n:'Market',max:3,cost:l=>({bricks:20+12*l,silver:8+6*l}),eff:'+4 silver per year and +10% trade returns per level.'}
};
const TEMPLE_NAMES=['Shrine','Temple','Great Temple','Temple Terrace','Ziggurat'];
const DEST={
  mari:{n:'Mari',where:'up the Euphrates',risk:.06,mult:1.25,ret:{timber:1},note:'River trade city in Syria. Timber floats downriver on rafts.'},
  dilmun:{n:'Dilmun',where:'Bahrain',risk:.08,mult:1.3,ret:{copper:.7,silver:.3},note:'Island trading hub of the Gulf.'},
  elam:{n:'Elam',where:'Iranian highlands',risk:.16,mult:1.45,ret:{timber:.6,copper:.4},note:'Rich in wood and metal, but often hostile.'},
  magan:{n:'Magan',where:'Oman',risk:.15,mult:1.6,ret:{copper:1},note:'Main source of Sumer\'s copper.'},
  meluhha:{n:'Meluhha',where:'Indus Valley',risk:.25,mult:2,ret:{silver:.5,timber:.5},prestige:5,note:'Distant land of carnelian beads and fine wood. +5 Prestige if they return.'}
};
const FLOOD={
  low:{n:'Low river',mult:.75,d:'The Euphrates ran low and the fields went thirsty.'},
  normal:{n:'Steady flood',mult:1,d:'The river rose as it should.'},
  high:{n:'Rich flood',mult:1.15,d:'A generous flood soaked the fields.'},
  ruin:{n:'Destructive flood',mult:.9,d:'The river burst its banks and melted mudbrick walls.'}
};
const DIFF={
  gentle:{n:'Gentle',ai:.8,aggr:.5,grace:6,sargon:.8},
  standard:{n:'Standard',ai:1,aggr:1,grace:4,sargon:1},
  harsh:{n:'Harsh',ai:1.25,aggr:1.5,grace:3,sargon:1.25}
};
const RULERS=['Eannatum','Enmetena','Lugalanda','Ur-Nanshe','Mesannepada','Enshakushanna','Lugalkinishedudu','Akurgal','Enanatum','Il','Lugalzagesi','Urukagina','Mesalim','Gishakidu'];
const ROLES={
  general:{n:'Chief General',d:'Their soldiers lose a quarter of their number and fight weaker this year.'},
  priest:{n:'High Priest',d:'Their city falls into fear: Order drops sharply.'},
  steward:{n:'Royal Steward',d:'Their storehouses fall into chaos: this year\'s production drops by 40%.'}
};

function hash(){let s=Array.prototype.join.call(arguments,'|');let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,0x5bd1e995);h^=h>>>15;return (h>>>0)/4294967296}
function rng(){G.rngState=(G.rngState+0x6D2B79F5)>>>0;let t=G.rngState;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}
const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
const pick=a=>a[Math.floor(rng()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cityById=id=>G.cities.find(c=>c.id===id);
const jobsSum=c=>c.jobs.farm+c.jobs.weave+c.jobs.brick+c.jobs.soldier;
const idle=c=>Math.max(0,c.pop-jobsSum(c)-c.away);
const slots=c=>2+c.bld.school;
const housing=c=>40+20*c.bld.houses;
const storage=c=>150+150*c.bld.granary;
const valueOf=b=>RES.reduce((s,k)=>s+(+b[k]||0)*RI[k].v,0);
const canPay=(c,b)=>RES.every(k=>(c.res[k]||0)>=(+b[k]||0));
function pay(c,b){RES.forEach(k=>{if(+b[k])c.res[k]=Math.max(0,c.res[k]-(+b[k]))})}
function gain(c,b){RES.forEach(k=>{if(+b[k])c.res[k]+=(+b[k])})}
function rep(c,t,tone){c.report.push({t:t,tone:tone||''})}
function chron(t){G.chronicle.push({y:G.year,t:t})}
function relAdd(a,b,d){if(!a||!b||a===b)return;const v=clamp((a.rel[b.id]||0)+d,-100,100);a.rel[b.id]=v;b.rel[a.id]=v}
function bundleText(b){const p=RES.filter(k=>+b[k]>0).map(k=>`${+b[k]} ${RI[k].n.toLowerCase()}`);return p.length?p.join(', '):'nothing'}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(c){return G.cities.filter(o=>o!==c).sort((a,b)=>dist(a,c)-dist(b,c))[0]}

function makeCity(def,team){
  const c={id:def.id,name:def.name,god:def.god,x:def.x,y:def.y,perk:def.perk,human:!!team,team:team?team.name:null,
    persona:team?null:['warlike','builder','merchant'][Math.floor(hash(G.seed,'persona',def.id)*3)],
    ruler:team?null:RULERS[Math.floor(hash(G.seed,'ruler',def.id)*RULERS.length)],
    pop:40,jobs:{farm:18,weave:6,brick:6,soldier:6},away:0,soldiersOut:0,
    res:{barley:90,textiles:12,bricks:50,silver:25,timber:12,copper:6},
    bld:{canal:0,granary:0,houses:1,temple:0,walls:0,forge:0,school:0,market:0},
    order:55,prestige:10,salinity:0,laws:[],treaties:{},rel:{},overlord:null,
    missions:[],report:[],event:null,eventDone:false,eventResult:null,lastEvent:null,chaos:0,weakened:0,sargonChoice:null,
    stats:{wins:0,losses:0,built:0,trades:0,plots:0}};
  def.apply(c);
  return c;
}

function newGame(s){
  G={v:1,seed:s.seed,mode:s.mode,year:1,maxYears:s.years,diff:s.diff,
     rules:{trade:s.rules.trade,war:s.rules.war,assassination:s.rules.assassination,diplomacy:s.rules.diplomacy,sargon:s.rules.sargon},
     rngState:Math.floor(hash(s.seed,'rng')*4294967296),cities:[],offers:[],chronicle:[],yearNames:{},nextOffer:1,over:false,turnIdx:0,flood:'normal',lastYearFlood:null};
  G.sargonYear=s.rules.sargon?Math.max(4,Math.round(s.years*0.65)):0;

function eventById(id){return id==='sargon'?SARGON:EVENTS.find(e=>e.id===id)}
function pickEvent(c){
  if(G.sargonYear&&G.year===G.sargonYear)return 'sargon';
  const list=EVENTS.filter(e=>(!e.when||e.when(c))&&e.id!==c.lastEvent);
  return list[Math.floor(hash(G.seed,'ev',G.year,c.id)*list.length)].id;
}
function sargonArmy(){return Math.round((10+2.2*G.sargonYear)*DIFF[G.diff].sargon)}
function effAffordable(c,e){return RES.every(k=>!(e[k]<0)||c.res[k]>=-e[k])}
function applyEff(c,e){
  const notes=[];
  RES.forEach(k=>{if(e[k])c.res[k]=Math.max(0,c.res[k]+e[k])});
  if(e.order)c.order=clamp(c.order+e.order,0,100);
  if(e.prestige)c.prestige+=e.prestige;
  if(e.pop>0)c.pop+=e.pop;
  if(e.pop<0)removePeople(c,-e.pop);
  if(e.soldiers>0){c.pop+=e.soldiers;c.jobs.soldier+=e.soldiers}
  if(e.soldiers<0)killSoldiers(c,-e.soldiers);
  if(e.salinity)c.salinity=clamp(c.salinity+e.salinity,0,10);
  if(e.law&&!c.laws.includes(e.law))c.laws.push(e.law);
  if(e.rel){const n=nearest(c);relAdd(c,n,e.rel);notes.push(`Relations with ${n.name} ${e.rel>0?'improved':'worsened'}.`)}
  if(e.sargon)c.sargonChoice=e.sargon;
  if(e.risk){
    if(hash(G.seed,'risk',G.year,c.id)<e.risk.p){applyEff(c,e.risk.e);notes.push(e.risk.t)}else notes.push(e.risk.ok);
  }
  return notes.join(' ');
}
function chooseEvent(c,i){
  const ev=eventById(c.event);const ch=ev.ch[i];
  if(!ch||c.eventDone||!effAffordable(c,ch.e))return false;
  const n=applyEff(c,ch.e);c.eventDone=true;c.eventChoice=i;c.eventResult=n;c.lastEvent=ev.id;
  return true;
}

/* ---------- people ---------- */
function removePeople(c,n){
  n=Math.min(n,Math.max(0,c.pop-6));
  let r=n;
  const fromIdle=Math.min(r,idle(c));r-=fromIdle;
  ['weave','brick','farm','soldier'].forEach(k=>{const t=Math.min(r,c.jobs[k]);c.jobs[k]-=t;r-=t});
  c.pop-=(n-r);
  if(c.soldiersOut>c.jobs.soldier)c.soldiersOut=c.jobs.soldier;
}
function killSoldiers(c,n){n=Math.min(n,c.jobs.soldier);c.jobs.soldier-=n;c.pop-=n;return n}
function fixJobs(c){
  let over=jobsSum(c)+c.away-c.pop;
  ['weave','brick','farm','soldier'].forEach(k=>{if(over>0){const t=Math.min(over,c.jobs[k]);c.jobs[k]-=t;over-=t}});
}

/* ---------- military ---------- */
const soldiersHome=c=>Math.max(0,c.jobs.soldier-c.soldiersOut);
const milMult=c=>(1+0.2*c.bld.forge)*(c.weakened?0.75:1)*(0.85+c.order/400);
const attackOf=(c,n)=>n*milMult(c);
function defenseOf(c,exclude){
  let d=soldiersHome(c)*milMult(c)*(1+0.25*c.bld.walls)+c.pop*0.08;
  G.cities.forEach(o=>{if(o!==c&&o!==exclude&&c.treaties[o.id]==='alliance')d+=soldiersHome(o)*milMult(o)*0.3});
  return d;
}
function makeTreaty(a,b,k){a.treaties[b.id]=k;b.treaties[a.id]=k}
function breakTreaty(a,b){
  const k=a.treaties[b.id];delete a.treaties[b.id];delete b.treaties[a.id];
  a.prestige-=15;G.cities.forEach(o=>{if(o!==a)relAdd(a,o,-10)});
  chron(`${a.name} broke its sworn ${k==='alliance'?'alliance':'peace'} with ${b.name}. The gods remember oath-breakers.`);
  rep(a,`You broke your ${k} with ${b.name}: -15 Prestige, and every city trusts you less.`,'bad');
}
function vassalsOf(c){return G.cities.filter(o=>o.overlord===c.id).length}

/* ---------- missions ---------- */
function missionError(c,m){
  if(c.missions.length>=slots(c))return 'All your mission slots are in use this year. An Edubba adds more.';
  if(!G.rules[m.type==='trade'?'trade':m.type])return 'Your teacher has turned this mission type off.';
  if(m.type==='war'){
    const t=cityById(m.target);if(!t||t===c)return 'Choose a city to attack.';
    if(!(m.soldiers>0))return 'Send at least one soldier.';
    if(m.soldiers>soldiersHome(c))return `You only have ${soldiersHome(c)} soldiers at home.`;
    if(c.missions.some(x=>x.type==='war'&&x.target===t.id))return `You already have an army marching on ${t.name}.`;
  } else {
    if(!(m.people>0))return 'Send at least one person.';
    if(m.people>idle(c))return `You only have ${idle(c)} unassigned people. Free some from their jobs first.`;
  }
  if(m.type==='trade'){
    const v=valueOf(m.cargo);if(v<10)return 'Load at least 10 value of goods. Barley is worth 1, textiles 3, silver 5.';
    if(!canPay(c,m.cargo))return 'You do not have that much to load.';
    if(m.people<merchantsNeeded(m.cargo))return `This cargo needs at least ${merchantsNeeded(m.cargo)} merchants.`;
  }
  if(m.type==='assassination'){const t=cityById(m.target);if(!t||t===c)return 'Choose a target city.';if(m.people>3)return 'Send at most 3 agents.'}
  if(m.type==='diplomacy'){
    if(m.target!=='nippur'){const t=cityById(m.target);if(!t||t===c)return 'Choose a city for your envoy.';
      if(m.prop==='alliance'&&c.treaties[t.id]!=='peace')return 'You need a peace treaty before you can propose an alliance.';
      if(m.prop==='peace'&&c.treaties[t.id])return `You already have a ${c.treaties[t.id]} with ${t.name}.`;
      if(m.prop==='tribute'&&valueOf(m.want||{})<=0)return 'Name the tribute you demand.';}
    if(!canPay(c,m.gift))return 'You do not have enough for that gift.';
    if(m.target==='nippur'&&valueOf(m.gift)<10)return 'The priests of Enlil expect a gift worth at least 10.';
    if(m.people>2)return 'An embassy needs only 1 or 2 envoys.';
  }
  return null;
}
const merchantsNeeded=cargo=>Math.max(2,Math.ceil(valueOf(cargo)/25));
function queueMission(c,m){
  const err=missionError(c,m);if(err)return err;
  if(m.type==='war'){c.soldiersOut+=m.soldiers}else{c.away+=m.people}
  if(m.type==='trade')pay(c,m.cargo);
  if(m.type==='diplomacy'){pay(c,m.gift);
    const t=cityById(m.target);
    if(t&&t.human){m.offerId=makeOffer(c,t,m.prop,m.gift,m.want||{},true)}
  }
  m.id=G.nextOffer++;
  c.missions.push(m);return null;
}
function cancelMission(c,id){
  const i=c.missions.findIndex(m=>m.id===id);if(i<0)return;const m=c.missions[i];
  if(m.type==='war')c.soldiersOut-=m.soldiers;else c.away-=m.people;
  if(m.type==='trade')gain(c,m.cargo);
  if(m.type==='diplomacy'){gain(c,m.gift);if(m.offerId){const o=G.offers.find(o=>o.id===m.offerId);if(o&&o.status==='open'){o.status='withdrawn'}}}
  c.missions.splice(i,1);
}

const RESOLVE={
 trade(c,m){
  const d=DEST[m.dest];

    rep(c,`Disaster: your caravan to ${d.n} was lost to ${pick(['storms in the Gulf','mountain bandits','pirates','a sandstorm'])}. ${lost} merchants never returned and the cargo is gone.`,'bad');return}

 },
 assassination(c,m){

  let p=0.35+0.1*c.bld.school+0.07*(m.people-1)-0.08*t.bld.school-0.03*t.bld.walls;p=clamp(p,.1,.8);

    if(rng()<0.5){rep(c,`Your agents struck down the ${role.n} of ${t.name} and slipped away unseen.`,'good');chron(`The ${role.n} of ${t.name} was found dead. No one knows who sent the killers.`)}
    else{rep(c,`Your agents killed the ${role.n} of ${t.name}, but they were recognized. ${t.name} knows you did it.`,'good');relAdd(c,t,-35);rep(t,`The killers were agents of ${c.name}.`,'bad');chron(`Agents of ${c.name} murdered the ${role.n} of ${t.name}.`)}
  } else {
    c.pop-=m.people;c.away-=m.people;c.prestige-=8;relAdd(c,t,-40);
    rep(c,`Your agents were caught in ${t.name} and executed. The plot is exposed: -8 Prestige.`,'bad');
    rep(t,`Your guards caught agents of ${c.name} plotting against your ${role.n}.`,'good');
    chron(`Agents of ${c.name} were caught plotting murder in ${t.name}.`);
  }
 },
 diplomacy(c,m){
  const gv=valueOf(m.gift);
  if(m.target==='nippur'){const o=Math.min(15,4+Math.round(gv/8)),p=Math.min(15,Math.round(gv/6));c.order=clamp(c.order+o,0,100);c.prestige+=p;
    rep(c,`The priests of Enlil at Nippur accepted your gifts and blessed your rule: +${o} Order, +${p} Prestige.`,'good');return}
  const t=cityById(m.target);

  if(m.prop==='peace'){if(r+rng()*40>25){makeTreaty(c,t,'peace');rep(c,`${t.name} swore a peace treaty with you before the gods.`,'good');chron(`${c.name} and ${t.name} swore an oath of peace.`)}
    else{rep(c,`${t.ruler} of ${t.name} refused your offer of peace. Try a better gift or improve relations first.`,'bad')}return}
  if(m.prop==='alliance'){if(r+rng()*30>55){makeTreaty(c,t,'alliance');rep(c,`${t.name} agreed to an alliance. Your armies will help defend each other.`,'good');chron(`${c.name} and ${t.name} formed an alliance.`)}
    else{rep(c,`${t.name} is not ready for an alliance. Relations need to be warmer.`,'bad')}return}
  if(m.prop==='tribute'){
    const strong=attackOf(c,c.jobs.soldier)>1.3*defenseOf(t);
    if(strong&&rng()<.75){const want={};RES.forEach(k=>{if(+m.want[k])want[k]=Math.min(t.res[k],+m.want[k])});pay(t,want);gain(c,want);relAdd(c,t,-25);
      rep(c,`${t.name} feared your army and paid tribute: ${bundleText(want)}.`,'good');chron(`${t.name} paid tribute to ${c.name}.`)}
    else{relAdd(c,t,-15);rep(c,`${t.name} laughed at your demand for tribute.`,'bad')}
  }
 },
 war(c,m){
  const t=cityById(m.target);
  const n=Math.min(m.soldiers,c.jobs.soldier);if(n<=0)return;
  c.soldiersOut=Math.max(0,c.soldiersOut-m.soldiers);
  if(c.treaties[t.id])breakTreaty(c,t);
  const A=attackOf(c,n)*(0.8+rng()*0.4),D=Math.max(1,defenseOf(t,c)*(0.8+rng()*0.4)),ratio=A/D;
  relAdd(c,t,-30);

    const aL=killSoldiers(c,Math.round(n*(0.08+rng()*0.12)));

};

function resolveSargon(){
  const army=sargonArmy();
  chron(`Sargon of Akkad marched on Sumer with an army of about ${army*5} men.`);
  G.cities.forEach(c=>{
    let ch=c.sargonChoice;if(!c.human&&!ch)ch=defenseOf(c)>army*0.9?'resist':'submit';if(!ch)ch='submit';
    if(ch==='submit'){c.overlord='akkad';c.prestige-=5;rep(c,'You bowed to Sargon. Akkad will take tribute every year, but your city was spared.','bad');chron(`${c.name} bowed to Sargon.`);return}
    const D=defenseOf(c)*(0.8+rng()*0.4),A=army*(0.8+rng()*0.4);
    if(D>=A){killSoldiers(c,Math.round(c.jobs.soldier*.2));c.prestige+=30;rep(c,'Your walls held against Sargon! His army turned away. +30 Prestige.','good');chron(`${c.name} held its walls against Sargon!`)}
    else{killSoldiers(c,Math.round(c.jobs.soldier*.4));c.overlord='akkad';c.order=clamp(c.order-15,0,100);const s=Math.round(c.res.silver*.3);c.res.silver-=s;
      rep(c,`Sargon\'s army broke through. Your city now pays tribute to Akkad, and the conquerors took ${s} silver.`,'bad');chron(`Sargon conquered ${c.name}.`)}
  });
}

/* ---------- economy ---------- */
function forecast(c){
  const fl=FLOOD[G.flood];
  const m=(c.order<30?0.85:1)*(c.chaos?0.6:1);
  const salt=Math.max(0.5,1-0.05*c.salinity);
  const barley=Math.round(c.jobs.farm*3*(1+0.15*c.bld.canal)*fl.mult*salt*m);
  const textiles=Math.round(c.jobs.weave*2*m);
  const bricks=Math.round(c.jobs.brick*3*m);
  const silver=Math.round(c.pop*0.15+4*c.bld.market-c.jobs.soldier*0.3);
  const eat=Math.round(c.pop+c.jobs.soldier*0.5);
  let tb=0,ts=0;if(c.overlord){tb=Math.round(barley*.2);ts=Math.round(Math.max(0,silver)*.25)}
  return {barley,textiles,bricks,silver,eat,tb,ts,net:barley-eat-tb};
}
function economy(c){
  const f=forecast(c);
  c.res.textiles+=f.textiles;c.res.bricks+=f.bricks;
  if(c.overlord){const o=cityById(c.overlord);if(o){o.res.barley+=f.tb;o.res.silver+=f.ts;rep(o,`${c.name} paid you tribute: ${f.tb} barley, ${f.ts} silver.`,'good')}
    rep(c,`You paid tribute to ${o?o.name:'Akkad'}: ${f.tb} barley, ${f.ts} silver.`,'bad')}
  c.res.silver+=f.silver-f.ts;
  let famine=false;
  if(c.res.silver<0){c.res.silver=0;c.order=clamp(c.order-5,0,100);rep(c,'The treasury ran dry and soldiers went unpaid: -5 Order.','bad')}
  c.res.barley+=f.barley-f.tb-f.eat;
  if(c.res.barley<0){famine=true;const starve=Math.ceil(-c.res.barley/3);c.res.barley=0;removePeople(c,starve);
    rep(c,`Famine! The storehouses ran empty and ${starve} people died or fled.`,'bad')}
  if(c.res.barley>storage(c)){const lost=c.res.barley-storage(c);c.res.barley=storage(c);rep(c,`${lost} gur of barley spoiled for lack of storage. A Granary would hold it.`,'bad')}
  if(G.flood==='ruin'){const b=Math.round(c.res.bricks*.15);c.res.bricks-=b;if(b)rep(c,`The destructive flood dissolved ${b} loads of mudbrick.`,'bad')}
  if(!famine&&c.order>=35&&c.pop<housing(c)&&f.net>0){const g=Math.min(housing(c)-c.pop,Math.max(1,Math.round(c.pop*0.06)));c.pop+=g;rep(c,`Your city grew by ${g} people.`,'good')}
  else if(!famine&&c.pop>=housing(c))rep(c,'Your city is full. Build more houses to let it grow.');
  const target=50+7*c.bld.temple+4*c.laws.length-(famine?15:0)-(c.overlord?8:0);
  c.order=clamp(Math.round(c.order+(target-c.order)*0.25)+(famine?-10:0),0,100);
  c.prestige+=2*c.bld.temple;
  c.salinity=clamp(c.salinity+0.12*c.bld.canal,0,10);
  if(c.order<15&&c.order>3){removePeople(c,Math.round(c.pop*.08));rep(c,'Riots broke out in the streets. People fled the city.','bad')}
  if(c.order<=3){
    c.prestige-=20;c.order=40;const nm=RULERS[Math.floor(hash(G.seed,'coup',G.year,c.id)*RULERS.length)];
    if(!c.human)c.ruler=nm;
    rep(c,`Revolution! The people overthrew the palace. ${c.human?'Your council clings to power, but':'A new ruler takes power and'} the city loses 20 Prestige.`,'bad');
    chron(`Revolt in ${c.name}! The old ruler was overthrown.`);
  }
  c.chaos=0;
}

/* ---------- offers between cities ---------- */
function makeOffer(from,to,kind,give,want,reserved){
  const o={id:G.nextOffer++,from:from.id,to:to.id,kind:kind,give:Object.assign({},give),want:Object.assign({},want),year:G.year,status:'open'};
  if(!reserved)pay(from,give);
  G.offers.push(o);return o.id;
}
function aiConsider(t,c,give,want){
  if(!canPay(t,want))return {ok:false,msg:`${t.name} does not have that much to spare.`};
  const vg=valueOf(give),vw=valueOf(want);
  let need=1.15-(t.rel[c.id]||0)/250;if(c.treaties[t.id]==='alliance')need-=.1;
  if(want.barley&&t.res.barley-want.barley<forecast(t).eat*0.5)return {ok:false,msg:`${t.name} will not trade away barley it needs to eat.`};
  if(vg>=vw*need){pay(c,give);gain(t,give);pay(t,want);gain(c,want);relAdd(c,t,3);c.stats.trades++;
    rep(c,`Traded with ${t.name}: gave ${bundleText(give)}, got ${bundleText(want)}.`,'good');return {ok:true,msg:`${t.ruler} of ${t.name} accepts the exchange.`}}
  return {ok:false,msg:`${t.ruler} of ${t.name} wants a better deal. Offer more or ask for less.`};
}
function answerOffer(c,id,accept){
  const o=G.offers.find(o=>o.id===id);if(!o||o.status!=='open'||o.to!==c.id)return 'That offer is no longer open.';
  const f=cityById(o.from);
  if(accept){
    if(o.kind==='trade'||o.kind==='tribute'){if(!canPay(c,o.want))return 'You do not have what they ask for.'}
    gain(c,o.give);
    if(o.kind==='trade'||o.kind==='tribute'){pay(c,o.want);gain(f,o.want)}
    if(o.kind==='peace'||o.kind==='alliance'){makeTreaty(c,f,o.kind);chron(`${c.name} and ${f.name} ${o.kind==='peace'?'swore an oath of peace':'formed an alliance'}.`)}
    if(o.kind==='tribute')chron(`${c.name} paid tribute to ${f.name}.`);
    relAdd(c,f,5);if(o.kind==='trade'){c.stats.trades++;f.stats.trades++}
    rep(f,`${c.name} accepted your ${o.kind==='gift'?'gift':o.kind+' offer'}.`,'good');
    o.status='accepted';
  } else {
    if(o.kind==='trade')gain(f,o.give);else gain(c,o.give);
    relAdd(c,f,o.kind==='tribute'?-15:-3);
    rep(f,`${c.name} turned down your ${o.kind} offer.`,'bad');
    o.status='declined';
  }
  return null;
}
function expireOffers(){
  G.offers.forEach(o=>{if(o.status==='open'&&o.year<G.year-1){const f=cityById(o.from);if(o.kind==='trade')gain(f,o.give);else gain(cityById(o.to),o.give);o.status='expired';rep(f,`Your ${o.kind} offer to ${cityById(o.to).name} went unanswered.`)}});
  G.offers=G.offers.filter(o=>o.status==='open');
}

/* ---------- computer rivals ---------- */
function aiPlan(c){
  const D=DIFF[G.diff];
  if(c.event==='sargon'&&!c.eventDone){c.eventDone=true;c.lastEvent='sargon';c.sargonChoice=defenseOf(c)>sargonArmy()*0.9?'resist':'submit'}
  if(c.event&&!c.eventDone){const ev=eventById(c.event);const ok=ev.ch.map((x,i)=>i).filter(i=>effAffordable(c,ev.ch[i].e));chooseEvent(c,ok.length?ok[Math.floor(rng()*ok.length)]:ev.ch.length-1)}
  const share={warlike:.24,builder:.12,merchant:.15}[c.persona];
  const workers=c.pop;let sol=Math.max(c.jobs.soldier>0?2:0,Math.round(workers*share));
  const per=3*(1+0.15*c.bld.canal)*FLOOD[G.flood].mult*Math.max(.5,1-.05*c.salinity);
  let farm=Math.min(workers-sol,Math.ceil((c.pop+sol*.5)*1.08/per)+1);
  const rest=Math.max(0,workers-sol-farm),brick=Math.round(rest*.55);
  c.jobs={farm:farm,weave:rest-brick,brick:brick,soldier:Math.min(sol,c.jobs.soldier+4)};
  fixJobs(c);
  c.res.timber+=Math.round(ri(2,5)*D.ai);c.res.copper+=Math.round(ri(1,3)*D.ai);
  if(c.persona==='merchant')c.res.silver+=Math.round(ri(3,7)*D.ai);
  if(c.salinity>4&&c.res.barley>60){c.salinity-=2;c.res.barley-=25}
  const pri={warlike:['walls','forge','houses','granary','temple','canal','school'],builder:['canal','temple','houses','granary','school','walls','market'],merchant:['market','houses','canal','school','temple','granary','walls']}[c.persona];
  let built=0;
  for(const k of pri){if(built>=2)break;if(c.bld[k]<BLD[k].max){const cost=BLD[k].cost(c.bld[k]);if(canPay(c,cost)){pay(c,cost);c.bld[k]++;built++;c.stats.built++;
    if(k==='temple'&&c.bld.temple>=3)chron(`${c.name} raised a ${TEMPLE_NAMES[c.bld.temple-1].toLowerCase()} to ${c.god}.`)}}}
  if(G.rules.war&&G.year>=3&&c.jobs.soldier>=4){
    if(c.overlord&&c.overlord!=='akkad'){const o=cityById(c.overlord);const n=Math.round(c.jobs.soldier*.8);if(attackOf(c,n)>1.1*defenseOf(o)){c.missions.push({type:'war',target:o.id,soldiers:n,goal:'raid',id:G.nextOffer++});c.soldiersOut+=n}}
    else if(rng()<{warlike:.35,builder:.1,merchant:.12}[c.persona]*D.aggr){
      const n=Math.round(c.jobs.soldier*.7),myA=attackOf(c,n);
      const ts=G.cities.filter(o=>o!==c&&!c.treaties[o.id]&&o.overlord!==c.id&&(!o.human||G.year>=D.grace)).map(o=>({o:o,d:defenseOf(o)})).filter(x=>myA>1.25*x.d).sort((a,b)=>a.d-b.d);
      if(ts.length){c.missions.push({type:'war',target:ts[0].o.id,soldiers:n,goal:myA>2*ts[0].d?'conquer':'raid',id:G.nextOffer++});c.soldiersOut+=n}
    }
  }
  if(G.rules.diplomacy){
    G.cities.filter(h=>h.human&&!c.treaties[h.id]&&(c.rel[h.id]||0)>15).forEach(h=>{if(rng()<.15)makeOffer(c,h,'peace',{},{},false)});
    if(G.rules.trade&&rng()<.3){const hs=G.cities.filter(h=>h.human);if(hs.length){const h=pick(hs);
      const opts=[[{timber:8},{textiles:10}],[{copper:5},{barley:30}],[{silver:6},{bricks:30}],[{timber:6},{barley:25}]];
      const [g,w]=pick(opts);if(canPay(c,g))makeOffer(c,h,'trade',g,w,false)}}
  }
}

/* ---------- turn flow ---------- */
function startYear(){
  G.cities.forEach(c=>{c.event=pickEvent(c);c.eventDone=false;c.eventChoice=null;c.eventResult=null;c.sargonChoice=null});
  G.turnIdx=0;
}
function nameYear(){
  const y=G.year,ev=G.chronicle.filter(e=>e.y===y).map(e=>e.t);
  if(G.sargonYear===y)return 'Year Sargon of Akkad marched on Sumer';
  const conq=ev.find(t=>/conquered|threw off/.test(t));if(conq)return 'Year '+conq.replace(/\.$/,'').replace(/ and made it a vassal/,'');
  const raid=ev.find(t=>/raided/.test(t));if(raid)return 'Year '+raid.replace(/\.$/,'');
  const zig=ev.find(t=>/raised a/.test(t));if(zig)return 'Year '+zig.replace(/\.$/,'');
  const pact=ev.find(t=>/alliance|peace/.test(t));if(pact)return 'Year '+pact.replace(/\.$/,'');
  return {low:'Year the river ran low',normal:'Year of the steady flood',high:'Year of the rich flood',ruin:'Year the great flood broke the levees'}[G.flood];
}
function endYear(){
  G.cities.forEach(c=>c.report=[]);
  G.cities.filter(c=>c.human&&!c.eventDone).forEach(c=>{const ev=eventById(c.event);const i=ev.ch.length-1;if(effAffordable(c,ev.ch[i].e))chooseEvent(c,i)});
  G.cities.filter(c=>!c.human).forEach(aiPlan);
  const all=[];G.cities.forEach(c=>c.missions.forEach(m=>all.push([c,m,rng()])));
  const ord={diplomacy:0,trade:1,assassination:2,war:3};
  all.sort((a,b)=>ord[a[1].type]-ord[b[1].type]||a[2]-b[2]);
  all.forEach(([c,m])=>RESOLVE[m.type](c,m));
  if(G.sargonYear===G.year)resolveSargon();
  G.cities.forEach(c=>{c.missions=[];c.soldiersOut=0;c.away=0;fixJobs(c)});
  G.cities.forEach(economy);
  G.cities.forEach(c=>{c.weakened=0;if(c.pop<12){c.pop+=4;rep(c,'Families from the countryside resettled your nearly empty city.')}});
  G.yearNames[G.year]=nameYear();
  G.lastYearFlood=G.flood;
  G.year++;
  expireOffers();
  if(G.year>G.maxYears){G.over=true;G.year=G.maxYears;return}
  G.flood=floodFor(G.year);
  startYear();
}
function score(c){
  const b=Object.values(c.bld).reduce((a,v)=>a+v,0);
  return Math.round(c.prestige+c.pop*0.5+b*4+vassalsOf(c)*20-(c.overlord?15:0)+c.laws.length*3);
}
function standings(){return G.cities.slice().sort((a,b)=>score(b)-score(a))}
</script>

<script>
/* ================= INTERFACE ================= */
const SAVE_KEY='ensi-of-sumer-save-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const sgn=v=>(v>0?'+':v<0?'−':'')+Math.abs(v);
function randomCode(){const w=['LAPIS','REED','CEDAR','ONAGER','CLAY','STYLUS','EBLA','ZIGGURAT','BARLEY','CARNELIAN'];return w[Math.floor(Math.random()*w.length)]+'-'+(10+Math.floor(Math.random()*90))}
let U={screen:'setup',tab:'council',modal:null,f:{},msg:{},reveal:false,confirmNew:false,
  setup:{mode:'council',teams:[{name:'Team 1',city:'uruk'},{name:'Team 2',city:'lagash'},{name:'Team 3',city:'umma'}],years:15,diff:'standard',seed:randomCode(),
    rules:{trade:true,war:true,assassination:true,diplomacy:true,sargon:true}}};

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({G:G,screen:U.screen}))}catch(e){}}
function loadSaved(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function saveCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(G))))}catch(e){return ''}}
function readCode(s){try{const g=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));if(g&&g.cities&&g.v===1)return g}catch(e){}return null}

const cur=()=>G&&G.order?cityById(G.order[G.turnIdx]):null;
function effText(e){
  const o=[];
  RES.forEach(k=>{if(e[k])o.push(`${sgn(e[k])} ${RI[k].n}`)});
  if(e.order)o.push(`${sgn(e.order)} Order`);if(e.prestige)o.push(`${sgn(e.prestige)} Prestige`);
  if(e.pop)o.push(`${sgn(e.pop)} People`);if(e.soldiers)o.push(`${sgn(e.soldiers)} Soldiers`);
  if(e.salinity)o.push(e.salinity<0?'Less salt in the soil':'More salt in the soil');
  if(e.law)o.push(`New law: ${e.law}`);
  if(e.rel)o.push(e.rel>0?'Better relations with your nearest neighbor':'Worse relations with your nearest neighbor');
  if(e.risk)o.push(`${Math.round(e.risk.p*100)}% chance of disaster`);
  if(e.sargon==='submit')o.push('Become a vassal of Akkad, pay tribute, city spared');
  if(e.sargon==='resist')o.push('Battle at your walls; win great Prestige or be conquered');
  return o.length?o.join(' · '):'No effect';
}
function relLabel(v){return v>=50?'Close friends':v>=20?'Friendly':v>-20?'Neutral':v>-50?'Wary':'Hostile'}
function rulerOf(c){return c.human?esc(c.team):`${esc(c.ruler)} (computer)`}
function costHtml(c,cost){return RES.filter(k=>cost[k]).map(k=>`<span class="${c.res[k]<cost[k]?'short':''}">${cost[k]} ${RI[k].n.toLowerCase()}</span>`).join(' · ')}
function estimate(viewer,o){
  const s=o.jobs.soldier;const fuzz=Math.max(.05,.4-.12*viewer.bld.school);const h=hash(G.seed,'est',G.year,viewer.id,o.id);
  const lo=Math.max(0,Math.round(s*(1-fuzz*(.5+h)))),hi=Math.round(s*(1+fuzz*(1.5-h)));return lo===hi?`${lo}`:`${lo}–${hi}`;
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');let h='';
  if(U.screen==='setup')h=setupView();
  else if(U.screen==='handoff')h=handoffView();
  else if(U.screen==='play')h=playView();
  else if(U.screen==='yearEnd')h=yearEndView();
  else if(U.screen==='over')h=overView();
  if(U.modal==='teacher')h+=teacherView();
  if(U.modal==='rules')h+=rulesView();
  app.innerHTML=h;
}

function setupView(){
  const s=U.setup,saved=loadSaved();const taken=s.teams.map(t=>t.city);
  const teamRows=s.teams.map((t,i)=>`<div class="teamrow">
    <input type="text" id="tn${i}" data-team="${i}" data-k="name" value="${esc(t.name)}" aria-label="Team name">
    <select id="tc${i}" data-team="${i}" data-k="city" aria-label="City">${CITY_DEFS.map(d=>`<option value="${d.id}" ${d.id===t.city?'selected':''} ${d.id!==t.city&&taken.includes(d.id)?'disabled':''}>${d.name}</option>`).join('')}</select>
    <button class="mini ghost" data-act="rmTeam" data-i="${i}" ${s.teams.length<=1?'disabled':''} aria-label="Remove team">Remove</button></div>`).join('');
  const maxT=s.mode==='parallel'?1:6;
  return `<div class="fade">
  <div class="topbar"><div class="brand"><span class="cun">𒉺𒋼𒋛</span>Ensi of Sumer</div><button class="ghost" data-act="rules">How to play</button></div>
  <div class="stack" style="margin-bottom:22px;max-width:62ch">
    <p class="eyebrow">Southern Mesopotamia · about 2500 BCE</p>
    <h1>Rule a city between the two rivers</h1>
    <p>Each team is the <b>ensi</b>, the ruler, of a Sumerian city-state. Feed your people, raise your ziggurat, and send merchants, envoys, soldiers, and spies into a crowded land of rivals. Then survive what comes from the north.</p>
  </div>
  <div class="setup">
    <div class="stack">
      <div class="panel stack"><h3>How will the class play?</h3>
        <div class="mode">
          <button data-act="mode" data-v="council" aria-pressed="${s.mode==='council'}"><b>Rival Councils</b><span class="small muted">2–6 teams share one game on one screen and take turns in secret. Teams trade, ally, and go to war with each other.</span></button>
          <button data-act="mode" data-v="parallel" aria-pressed="${s.mode==='parallel'}"><b>Parallel Worlds</b><span class="small muted">Each team plays on its own device against computer rivals. Give every team the same World Code so they face the same floods and crises, then compare scores.</span></button>
        </div></div>
      <div class="panel stack"><div class="row" style="justify-content:space-between"><h3>${s.mode==='parallel'?'This device\'s team':'Teams'}</h3>${s.teams.length<maxT?'<button class="mini" data-act="addTeam">Add team</button>':''}</div>
        ${teamRows}
        <p class="small muted">Cities without a team are run by the computer. ${CITY_DEFS.filter(d=>taken.includes(d.id)).map(d=>`<br><b>${d.name}:</b> ${esc(d.perk)}`).join('')}</p></div>
    </div>
    <div class="stack">
      <div class="panel stack"><h3>Length</h3>
        <div class="seg">${[[8,'Short · 8 years','one class period'],[15,'Standard · 15 years','2–3 periods'],[25,'Long · 25 years','a full unit']].map(([y,l])=>`<button data-act="years" data-v="${y}" aria-pressed="${s.years===y}">${l}</button>`).join('')}
        <label class="small">Custom <input type="number" id="yrs" min="4" max="60" value="${s.years}" data-set="years"></label></div>
        <p class="small muted">Short ≈ one class period, Standard ≈ 2–3 periods, Long ≈ a full unit. The game saves on this device after every turn, and you can add or cut years from the Teacher panel at any time.</p></div>
      <div class="panel stack"><h3>Rival cities</h3>
        <div class="seg">${Object.keys(DIFF).map(k=>`<button data-act="diff" data-v="${k}" aria-pressed="${s.diff===k}">${DIFF[k].n}</button>`).join('')}</div>
        <p class="small muted">Gentle rivals will not attack a team before year ${DIFF.gentle.grace}. Harsh rivals are richer and more warlike.</p></div>
      <div class="panel stack"><h3>Rules</h3>
        <div class="row">${[['trade','Trade expeditions'],['war','War'],['assassination','Assassination'],['diplomacy','Diplomacy'],['sargon','Sargon\'s invasion']].map(([k,l])=>`<label><input type="checkbox" id="rule-${k}" data-rule="${k}" ${s.rules[k]?'checked':''}> ${l}</label>`).join('')}</div>
        <label class="field"><span>World Code (same code = same floods and crises)</span><div class="row"><input type="text" id="seed" value="${esc(s.seed)}" data-set="seed" style="flex:1"><button class="mini" data-act="reseed">New code</button></div></label></div>
      <button class="primary" data-act="start" style="padding:14px;font-size:1.1rem">Begin the first year</button>
      ${saved&&saved.G?`<button data-act="continue">Continue saved game: Year ${saved.G.year} of ${saved.G.maxYears}${saved.G.over?' (finished)':''}</button>`:''}
      <details class="panel"><summary><b>Load a save code</b></summary><div class="stack" style="margin-top:10px"><textarea id="loadcode" rows="3" placeholder="Paste a save code from the Teacher panel"></textarea><button data-act="loadCode">Load game</button>${U.msg.load?`<p class="msg bad">${esc(U.msg.load)}</p>`:''}</div></details>
    </div>
  </div></div>`;
}

function handoffView(){
  const c=cur();
  return `<div class="screen fade">
    <p class="glyphs" aria-hidden="true">𒉺𒋼𒋛</p>
    <p class="eyebrow">Year ${G.year} of ${G.maxYears} · ${FLOOD[G.flood].n}</p>
    <p class="big">${esc(c.team)}</p>
    <p style="font-size:1.2rem">Take your seats. You rule <b>${esc(c.name)}</b>, city of ${esc(c.god)}.</p>
    ${G.mode==='council'?'<p class="muted">Every other team, look away from the screen.</p>':''}
    <button class="primary" data-act="ready" style="padding:14px 30px;font-size:1.1rem">Our council is ready</button>
    <button class="ghost small" data-act="teacher">Teacher panel</button>
  </div>`;
}

function topbar(){
  return `<div class="topbar"><div class="brand"><span class="cun">𒉺𒋼𒋛</span>Ensi of Sumer</div>
    <div class="yearline">Year <b class="num">${G.year}</b> of ${G.maxYears} · ${FLOOD[G.flood].n}</div>
    <div class="row"><button class="ghost mini" data-act="rules">How to play</button><button class="mini" data-act="teacher">Teacher</button></div></div>`;
}

function resBar(c){
  const f=forecast(c);
  const d={barley:f.net,textiles:f.textiles,bricks:f.bricks,silver:f.silver-f.ts};
  const cells=RES.map(k=>`<div class="res"><span class="lab"><span class="cun" title="Cuneiform sign for ${RI[k].n.toLowerCase()}">${RI[k].g}</span>${RI[k].n}</span>
    <span class="val">${c.res[k]}</span><span class="d ${d[k]<0?'bad':d[k]>0?'good':'muted'}">${d[k]!=null?sgn(d[k])+' / yr':RI[k].u}</span></div>`).join('');
  return `<div class="resbar">
    <div class="res"><span class="lab"><span class="cun" title="Cuneiform sign for people">𒌦</span>People</span><span class="val">${c.pop}</span><span class="d muted">${idle(c)} unassigned · room for ${housing(c)}</span></div>
    ${cells}
    <div class="res"><span class="lab"><span class="cun" title="Cuneiform sign for god">𒀭</span>Order</span><span class="val">${c.order}</span><div class="meter"><i style="width:${c.order}%;background:${c.order<30?'var(--bad)':c.order<50?'var(--gold)':'var(--good)'}"></i></div></div>
    <div class="res"><span class="lab"><span class="cun" title="Cuneiform sign for king">𒈗</span>Prestige</span><span class="val goldc">${c.prestige}</span><span class="d muted">score ${score(c)}</span></div>
  </div>`;
}

function playView(){
  const c=cur();
  const inbox=G.offers.filter(o=>o.to===c.id&&o.status==='open').length;
  const tabs=[['council','Council',!c.eventDone||inbox],['people','People'],['build','Build'],['missions','Missions'],['exchange','Exchange'],['rivals','Rivals'],['chronicle','Chronicle']];
  const treaties=Object.keys(c.treaties).map(id=>`<span class="chip ${c.treaties[id]}">${c.treaties[id]==='alliance'?'Allied':'Peace'}: ${esc(cityById(id).name)}</span>`).join('');
  const over=c.overlord?`<span class="chip vassal">Pays tribute to ${c.overlord==='akkad'?'Akkad':esc(cityById(c.overlord).name)}</span>`:'';
  const vas=G.cities.filter(o=>o.overlord===c.id).map(o=>`<span class="chip gold">Vassal: ${esc(o.name)}</span>`).join('');
  return `${topbar()}
  <div class="cityhead"><div class="stack" style="gap:4px"><span class="eyebrow">${esc(c.team)} rules</span><h2>${esc(c.name)}</h2><span class="muted small">City of ${esc(c.god)} · ${esc(c.perk)}</span></div>
    <div class="row">${over}${vas}${treaties}</div></div>
  ${resBar(c)}
  <div class="layout"><main style="min-width:0">
    <div class="tabs" role="tablist">${tabs.map(([k,l,dot])=>`<button role="tab" data-act="tab" data-v="${k}" aria-selected="${U.tab===k}">${l}${dot?'<span class="dot" aria-label="needs attention"></span>':''}</button>`).join('')}</div>
    <div class="fade">${({council:councilTab,people:peopleTab,build:buildTab,missions:missionsTab,exchange:exchangeTab,rivals:rivalsTab,chronicle:chronicleTab})[U.tab](c)}</div>
  </main>
  <aside class="side">${mapPanel(c)}${standingsPanel(c)}</aside></div>
  <div class="endbar"><span class="small muted">${c.eventDone?`${c.missions.length} of ${slots(c)} missions planned.`:'Answer the matter before the throne first.'}</span>
    <button class="primary" data-act="endTurn" ${c.eventDone?'':'disabled'}>${G.turnIdx<G.order.length-1?'End our turn':'End the year'}</button></div>`;
}

function councilTab(c){
  const ev=eventById(c.event);
  const choices=ev.ch.map((ch,i)=>{const ok=effAffordable(c,ch.e);const chosen=c.eventDone&&c.eventChoice===i;
    return `<button class="choice" data-act="choose" data-i="${i}" ${c.eventDone||!ok?'disabled':''} ${chosen?'style="border:2px solid var(--gold);opacity:1"':''}><b>${esc(ch.l)}</b><span class="small muted">${esc(effText(ch.e))}${ok?'':' · you cannot afford this'}</span></button>`}).join('');
  let extra='';
  if(ev.id==='sargon')extra=`<p class="msg">Scouts say Sargon\'s army fights like about <b class="num">${sargonArmy()}</b> soldiers. Your defense right now is about <b class="num">${Math.round(defenseOf(c))}</b>, counting walls, bronze, militia, and allies.</p>`;
  const inbox=G.offers.filter(o=>o.to===c.id&&o.status==='open');
  const offers=inbox.map(o=>{const f=cityById(o.from);const can=(o.kind!=='trade'&&o.kind!=='tribute')||canPay(c,o.want);
    const what={trade:`offers <b>${bundleText(o.give)}</b> in exchange for <b>${bundleText(o.want)}</b>.`,peace:`proposes a sworn peace treaty${valueOf(o.give)?`, with gifts of ${bundleText(o.give)}`:''}.`,alliance:`proposes an alliance: each city helps defend the other${valueOf(o.give)?`. Gifts: ${bundleText(o.give)}`:''}.`,gift:`sends gifts of ${bundleText(o.give)}.`,tribute:`demands tribute of <b>${bundleText(o.want)}</b>. Refusing angers them.`}[o.kind];
    return `<div class="panel stack"><p><b>${esc(f.name)}</b> (${rulerOf(f)}) ${what}</p><div class="row">
      <button class="primary mini" data-act="offer" data-id="${o.id}" data-v="1" ${can?'':'disabled'}>${o.kind==='gift'?'Accept gifts':o.kind==='tribute'?'Pay':'Accept'}</button>
      ${o.kind==='gift'?'':`<button class="mini" data-act="offer" data-id="${o.id}" data-v="0">${o.kind==='tribute'?'Refuse':'Decline'}</button>`}
      ${can?'':'<span class="small bad">You do not have what they ask for.</span>'}</div></div>`}).join('');
  const rep=c.report.length?`<ul class="report">${c.report.map(r=>`<li class="${r.tone}">${esc(r.t)}</li>`).join('')}</ul>`:`<p class="muted">${G.year===1?'Your reign begins. The scribes have nothing to report yet.':'A quiet year.'}</p>`;
  const f=forecast(c);
  return `<div class="stack">
    <div class="tablet ${c.eventDone?'done':''}"><span class="eyebrow">${c.eventDone?'Decided':'Before the throne'}</span><h3>${esc(ev.title)}</h3><p>${esc(ev.text)}</p>${extra}
      <div class="choices">${choices}</div>
      ${c.eventDone&&c.eventResult?`<p class="msg">${esc(c.eventResult)}</p>`:''}
      <p class="history"><b>History.</b> ${esc(ev.note)}</p></div>
    ${offers?`<h3>Messengers at the gate</h3>${offers}`:''}
    ${U.msg.offer?`<p class="msg">${esc(U.msg.offer)}</p>`:''}
    <div class="panel stack"><h3>Scribe's report${G.year>1?` · ${esc(G.yearNames[G.year-1]||'last year')}`:''}</h3>${rep}</div>
    <div class="panel stack"><h3>This year's forecast</h3>
      <p>Fields will yield about <b class="num">${f.barley}</b> gur of barley. Your people will eat <b class="num">${f.eat}</b>${f.tb?` and tribute takes <b class="num">${f.tb}</b>`:''}. ${f.net<0?`<span class="bad">That is a shortfall of ${-f.net}. Without more farmers or stored grain, people will starve.</span>`:`<span class="good">A surplus of ${f.net}.</span>`}</p>
      ${c.salinity>=2?`<p class="small muted">Salt in the soil is cutting harvests by ${Math.round(Math.min(50,c.salinity*5))}%.</p>`:''}
      ${c.laws.length?`<p class="small">Laws of ${esc(c.name)}: ${c.laws.map(esc).join(' · ')}</p>`:''}</div>
  </div>`;
}

function peopleTab(c){
  const f=forecast(c);
  const rows=Object.keys(JOBS).map(k=>{const j=JOBS[k];const min=k==='soldier'?c.soldiersOut:0;
    return `<div class="panel job"><div class="stack" style="gap:2px;min-width:0"><b>${j.n}</b><span class="small muted">${esc(j.blurb)}</span>
      <span class="small">${k==='farm'?`Yields ${f.barley} barley`:k==='weave'?`Yields ${f.textiles} textiles`:k==='brick'?`Yields ${f.bricks} bricks`:`Strength ${Math.round(attackOf(c,c.jobs.soldier))} · ${c.soldiersOut} away on campaign`}</span></div>
      <div class="stepper"><button class="mini" data-act="job" data-k="${k}" data-d="-5" ${c.jobs[k]-5<min?'disabled':''} aria-label="Remove 5 ${j.n}">−5</button><button class="mini" data-act="job" data-k="${k}" data-d="-1" ${c.jobs[k]-1<min?'disabled':''} aria-label="Remove 1">−</button>
      <span class="num">${c.jobs[k]}</span>
      <button class="mini" data-act="job" data-k="${k}" data-d="1" ${idle(c)<1?'disabled':''} aria-label="Add 1">+</button><button class="mini" data-act="job" data-k="${k}" data-d="5" ${idle(c)<5?'disabled':''} aria-label="Add 5">+5</button></div></div>`}).join('');
  return `<div class="stack">
    <p><b class="num">${idle(c)}</b> people are unassigned${c.away?` and <b class="num">${c.away}</b> are away on missions`:''}. Unassigned people produce nothing, but merchants, envoys, and agents come from them.</p>
    ${rows}
    <p class="msg ${f.net<0?'bad':''}">Barley: grow ${f.barley}, eat ${f.eat}${f.tb?`, tribute ${f.tb}`:''} → ${sgn(f.net)} this year. Silver: ${sgn(f.silver-f.ts)} (taxes and markets, minus soldiers' pay${f.ts?' and tribute':''}).</p>
  </div>`;
}

function buildTab(c){
  return `<div class="grid2">${Object.keys(BLD).map(k=>{const b=BLD[k],l=c.bld[k],max=l>=b.max,cost=max?{}:b.cost(l);
    const nm=k==='temple'&&l>0?TEMPLE_NAMES[l-1]:b.n;
    return `<div class="panel bld"><div class="row" style="justify-content:space-between"><b>${esc(nm)}</b><span class="lvl" aria-label="Level ${l} of ${b.max}">${Array.from({length:b.max},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</span></div>
    <span class="small muted">${esc(b.eff)}</span>
    ${max?'<span class="small goldc">Fully built</span>':`<span class="cost">${costHtml(c,cost)}</span><button data-act="build" data-k="${k}" ${canPay(c,cost)?'':'disabled'}>${l?'Expand':'Build'}</button>`}</div>`}).join('')}</div>
    ${U.msg.build?`<p class="msg good" style="margin-top:12px">${esc(U.msg.build)}</p>`:''}`;
}

function cityOptions(c,sel,includeNippur){
  return (includeNippur?`<option value="nippur" ${sel==='nippur'?'selected':''}>Nippur (temple of Enlil)</option>`:'')+G.cities.filter(o=>o!==c).map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}${o.human?' · '+esc(o.team):''}</option>`).join('');
}
function goodsInputs(prefix,keys){return `<div class="goods">${keys.map(k=>`<label>${RI[k].n}<input type="number" min="0" id="${prefix}-${k}" data-f="${prefix}-${k}" value="${esc(U.f[prefix+'-'+k]||0)}"></label>`).join('')}</div>`}
function readGoods(prefix,keys){const b={};keys.forEach(k=>{const v=Math.max(0,Math.floor(+U.f[prefix+'-'+k]||0));if(v)b[k]=v});return b}
function missionsTab(c){
  const R=G.rules,f=U.f,used=c.missions.length,full=used>=slots(c);
  const list=c.missions.length?c.missions.map(m=>{let t='';
    if(m.type==='trade')t=`Trade expedition to ${DEST[m.dest].n}: ${m.people} merchants carrying ${bundleText(m.cargo)}`;
    if(m.type==='war')t=`War: ${m.soldiers} soldiers march on ${cityById(m.target).name} to ${m.goal==='conquer'?'conquer it':'raid it'}`;
    if(m.type==='assassination')t=`Secret: ${m.people} agent${m.people>1?'s':''} sent to kill the ${ROLES[m.role].n} of ${cityById(m.target).name}`;
    if(m.type==='diplomacy')t=m.target==='nippur'?`Pilgrimage to Nippur with ${bundleText(m.gift)}`:`Envoy to ${cityById(m.target).name}: ${{gift:'carry gifts',peace:'propose peace',alliance:'propose an alliance',tribute:'demand tribute'}[m.prop]}${valueOf(m.gift)?` (gifts: ${bundleText(m.gift)})`:''}`;
    return `<li class="row" style="justify-content:space-between"><span style="min-width:0">${esc(t)}</span><button class="mini ghost" data-act="cancel" data-id="${m.id}">Cancel</button></li>`}).join(''):'<li class="muted">No missions planned yet.</li>';
  const sec=(k,title,body)=>R[k]?`<details class="panel" ${U.f.open===k?'open':''} data-open="${k}"><summary><b>${title}</b></summary><div class="stack" style="margin-top:12px">${body}${U.msg[k]?`<p class="msg ${U.msg[k].ok?'good':'bad'}">${esc(U.msg[k].t)}</p>`:''}</div></details>`:'';
  const dest=f.dest||'dilmun';
  const trade=`<p class="small muted">Sumer has no forests or mines. Send merchants abroad with barley, textiles, or silver. They return at the end of the year with timber, copper, or silver, if they survive the journey.</p>
    <div class="mform"><label class="field"><span>Destination</span><select id="m-dest" data-f="dest">${Object.keys(DEST).map(k=>`<option value="${k}" ${k===dest?'selected':''}>${DEST[k].n} (${DEST[k].where})</option>`).join('')}</select></label>
    <label class="field"><span>Merchants</span><input type="number" min="2" id="m-merch" data-f="merch" value="${esc(f.merch||2)}"></label></div>
    <p class="small">${esc(DEST[dest].note)} Returns ${Object.keys(DEST[dest].ret).map(k=>RI[k].n.toLowerCase()).join(' and ')} worth about ${DEST[dest].mult}× the cargo. Danger: ${Math.round(DEST[dest].risk*100)}% chance the caravan is lost.</p>
    ${goodsInputs('cargo',['barley','textiles','silver'])}
    <p class="small muted">Cargo value ${valueOf(readGoods('cargo',['barley','textiles','silver']))} · needs at least ${merchantsNeeded(readGoods('cargo',['barley','textiles','silver']))} merchants.</p>
    <button class="primary" data-act="mission" data-v="trade" ${full?'disabled':''}>Send the caravan</button>`;
  const tgt=f.wtarget||G.cities.find(o=>o!==c).id,tc=cityById(tgt);
  const war=`<p class="small muted">March soldiers against a rival. Raiding carries off grain and silver. Conquering needs a crushing victory and turns the city into a vassal that pays you tribute every year. Attacking a city you swore peace with breaks your oath.</p>
    <div class="mform"><label class="field"><span>Target</span><select id="m-wt" data-f="wtarget" data-rerender="1">${cityOptions(c,tgt)}</select></label>
    <label class="field"><span>Soldiers (${soldiersHome(c)} at home)</span><input type="number" min="1" id="m-ws" data-f="wsol" value="${esc(f.wsol||soldiersHome(c))}"></label>
    <label class="field"><span>Goal</span><select id="m-wg" data-f="wgoal"><option value="raid" ${f.wgoal!=='conquer'?'selected':''}>Raid and plunder</option><option value="conquer" ${f.wgoal==='conquer'?'selected':''}>Conquer</option></select></label></div>
    <p class="small">Your scouts count about <b>${estimate(c,tc)}</b> soldiers in ${esc(tc.name)}${tc.bld.walls?`, behind walls (level ${tc.bld.walls})`:''}${Object.values(tc.treaties).includes('alliance')?', and they have allies':''}.${c.treaties[tgt]?` <span class="bad">You have a ${c.treaties[tgt]} with ${esc(tc.name)}. Attacking breaks it.</span>`:''}</p>
    <button class="danger" data-act="mission" data-v="war" ${full?'disabled':''}>March to war</button>`;
  const at=f.atarget||G.cities.find(o=>o!==c).id,ar=f.arole||'general';
  const ass=`<p class="small muted">Send 1–3 agents to kill an official in a rival city. Scribal schools improve your odds; theirs make it harder. If your agents are caught, everyone will know.</p>
    <div class="mform"><label class="field"><span>Target city</span><select id="m-at" data-f="atarget">${cityOptions(c,at)}</select></label>
    <label class="field"><span>Target</span><select id="m-ar" data-f="arole" data-rerender="1">${Object.keys(ROLES).map(k=>`<option value="${k}" ${k===ar?'selected':''}>${ROLES[k].n}</option>`).join('')}</select></label>
    <label class="field"><span>Agents</span><input type="number" min="1" max="3" id="m-aa" data-f="agents" value="${esc(f.agents||1)}"></label></div>
    <p class="small">${esc(ROLES[ar].d)}</p>
    <button class="danger" data-act="mission" data-v="assassination" ${full?'disabled':''}>Send the agents</button>`;
  const dt=f.dtarget||'nippur',dp=f.dprop||'peace';
  const dip=`<p class="small muted">Envoys carry gifts and proposals. Computer rulers answer by the end of the year. Other teams see your proposal on their turn. A pilgrimage to Nippur, the holy city of Enlil, wins the gods' favor for your rule.</p>
    <div class="mform"><label class="field"><span>Send envoy to</span><select id="m-dt" data-f="dtarget" data-rerender="1">${cityOptions(c,dt,true)}</select></label>
    ${dt==='nippur'?'':`<label class="field"><span>Proposal</span><select id="m-dp" data-f="dprop" data-rerender="1">${[['gift','Gifts only'],['peace','Peace treaty'],['alliance','Alliance'],['tribute','Demand tribute']].map(([k,l])=>`<option value="${k}" ${k===dp?'selected':''}>${l}</option>`).join('')}</select></label>`}</div>
    ${dt!=='nippur'?`<p class="small">${esc(cityById(dt).name)}: ${relLabel(c.rel[dt]||0)}${c.treaties[dt]?`, ${c.treaties[dt]}`:''}.</p>`:''}
    <p class="small"><b>Gifts</b> (improve relations and the chance of a yes)</p>${goodsInputs('gift',['barley','textiles','silver','timber','copper'])}
    ${dt!=='nippur'&&dp==='tribute'?`<p class="small"><b>Tribute you demand</b></p>${goodsInputs('want',['barley','silver','timber','copper'])}`:''}
    <button class="primary" data-act="mission" data-v="diplomacy" ${full?'disabled':''}>Send the envoy</button>`;
  return `<div class="stack">
    <div class="panel stack"><div class="row" style="justify-content:space-between"><h3>This year's missions</h3><span class="chip">${used} of ${slots(c)} slots</span></div><ul class="stack" style="list-style:none;padding:0;margin:0;gap:6px">${list}</ul>
    <p class="small muted">Missions leave now and resolve when the year ends. Results appear in next year's Scribe's report.</p></div>
    ${sec('trade','Trade expedition',trade)}${sec('war','War',war)}${sec('assassination','Assassination',ass)}${sec('diplomacy','Diplomacy',dip)}
  </div>`;
}

function exchangeTab(c){
  const pt=U.f.xtarget||G.cities.find(o=>o!==c).id,p=cityById(pt);
  const mine=G.offers.filter(o=>o.from===c.id&&o.status==='open'&&o.kind==='trade');
  return `<div class="stack">
    <p class="muted">Trade goods directly with another city-state. Computer rulers answer at once. Another team sees your offer on its turn, and the goods you offer are held until they answer.</p>
    <div class="panel stack">
      <label class="field" style="max-width:320px"><span>Trade with</span><select id="x-t" data-f="xtarget" data-rerender="1">${cityOptions(c,pt)}</select></label>
      <p class="small">${p.human?`Run by ${esc(p.team)}.`:`${esc(p.ruler)} feels ${relLabel(c.rel[pt]||0).toLowerCase()} toward you. Friendly rulers accept closer deals.`}</p>
      <p class="small"><b>You give</b></p>${goodsInputs('xg',RES)}
      <p class="small"><b>You ask for</b></p>${goodsInputs('xw',RES)}
      <p class="small muted">Values: barley 1, bricks 1, textiles 3, timber 4, silver 5, copper 6.</p>
      <button class="primary" data-act="exchange">Propose the exchange</button>
      ${U.msg.exchange?`<p class="msg ${U.msg.exchange.ok?'good':'bad'}">${esc(U.msg.exchange.t)}</p>`:''}
    </div>
    ${mine.length?`<div class="panel stack"><h3>Waiting for an answer</h3>${mine.map(o=>`<div class="row" style="justify-content:space-between"><span>To ${esc(cityById(o.to).name)}: ${bundleText(o.give)} for ${bundleText(o.want)}</span><button class="mini ghost" data-act="withdraw" data-id="${o.id}">Withdraw</button></div>`).join('')}</div>`:''}
  </div>`;
}

function rivalsTab(c){
  return `<div class="stack"><div class="tablebox"><table><thead><tr><th>City</th><th>Ruled by</th><th>Toward you</th><th>Soldiers</th><th>Walls</th><th>Score</th></tr></thead><tbody>
    ${G.cities.filter(o=>o!==c).map(o=>`<tr><td><b>${esc(o.name)}</b><br><span class="small muted">${esc(o.god)}</span></td><td>${rulerOf(o)}${o.overlord?`<br><span class="chip vassal">Vassal of ${o.overlord==='akkad'?'Akkad':esc(cityById(o.overlord).name)}</span>`:''}</td>
    <td>${o.human?'—':relLabel(c.rel[o.id]||0)}${c.treaties[o.id]?`<br><span class="chip ${c.treaties[o.id]}">${c.treaties[o.id]}</span>`:''}</td><td class="num">≈ ${estimate(c,o)}</td><td class="num">${o.bld.walls}</td><td class="num">${score(o)}</td></tr>`).join('')}
    </tbody></table></div><p class="small muted">Soldier counts are scout estimates. A bigger Edubba gives sharper reports.</p></div>`;
}

function chronicleTab(){
  const ys=[...new Set(G.chronicle.map(e=>e.y))].reverse();
  return `<div class="chron">${ys.map(y=>`<p class="y">Year ${y}${G.yearNames[y]?` · ${esc(G.yearNames[y])}`:''}</p><ul class="report">${G.chronicle.filter(e=>e.y===y).map(e=>`<li>${esc(e.t)}</li>`).join('')}</ul>`).join('')}</div>
  <p class="small muted" style="margin-top:12px">Sumerians did not number their years. They named each one after its most important event, such as "Year the wall of Uruk was built."</p>`;
}

function mapPanel(c){
  const dots=G.cities.map(o=>{const me=c&&o.id===c.id;const fill=me?'var(--carnelian)':o.human?'var(--lapis)':'var(--muted)';
    const lx=o.x>420?-10:12,anchor=o.x>420?'end':'start';
    return `<g><circle cx="${o.x}" cy="${o.y}" r="${me?10:7}" fill="${fill}" stroke="var(--panel)" stroke-width="2"></circle>
    ${o.overlord?`<circle cx="${o.x}" cy="${o.y}" r="14" fill="none" stroke="var(--carnelian)" stroke-dasharray="3 3"></circle>`:''}
    <text x="${o.x+lx}" y="${o.y+5}" text-anchor="${anchor}" font-weight="${me?700:400}">${esc(o.name)}</text></g>`}).join('');
  return `<div class="panel map"><svg viewBox="0 0 560 450" role="img" aria-label="Map of the Sumerian city-states between the Tigris and Euphrates rivers">
    <rect x="0" y="0" width="560" height="450" fill="var(--land)"></rect>
    <path d="M400 450 L430 400 Q470 360 520 330 L560 300 L560 450 Z" fill="var(--gulf)"></path>
    <path d="M0 18 C40 30 70 44 92 64 C140 100 180 120 206 140 C232 160 250 185 262 214 C276 250 282 280 300 314 C330 350 372 372 410 402 C420 412 425 425 432 440" fill="none" stroke="var(--river)" stroke-width="5" stroke-linecap="round"></path>
    <path d="M230 0 C260 40 300 70 340 100 C390 140 440 170 470 210 C500 250 515 290 530 330" fill="none" stroke="var(--river)" stroke-width="5" stroke-linecap="round"></path>
    <text x="110" y="100" font-style="italic" fill="var(--muted)" style="fill:var(--muted)" transform="rotate(35 110 100)">Euphrates</text>
    <text x="385" y="128" font-style="italic" style="fill:var(--muted)" transform="rotate(36 385 128)">Tigris</text>
    <text x="470" y="420" font-style="italic" style="fill:var(--muted)">The Gulf</text>
    <g><rect x="${NIPPUR.x-6}" y="${NIPPUR.y-6}" width="12" height="12" fill="var(--gold)" transform="rotate(45 ${NIPPUR.x} ${NIPPUR.y})"></rect><text x="${NIPPUR.x+12}" y="${NIPPUR.y+5}">Nippur</text></g>
    ${dots}
    <text x="12" y="438" style="fill:var(--muted);font-size:11px">Akkad lies to the north ↑</text>
  </svg><p class="small muted">${c?'Your city is in red. Team cities are blue. Dashed rings mark vassals.':'Team cities are blue. Dashed rings mark vassals.'}</p></div>`;
}
function standingsPanel(c){
  return `<div class="panel stack"><h3>Standings</h3><ol class="standings">${standings().map((o,i)=>`<li><span><span class="rk">${i+1}.</span>${c&&o.id===c.id?'<b>':''}${esc(o.name)}${o.human?` <span class="small muted">${esc(o.team)}</span>`:''}${c&&o.id===c.id?'</b>':''}</span><span class="num">${score(o)}</span></li>`).join('')}</ol>
  <p class="small muted">Score = Prestige + half your people + 4 per building level + 3 per law + 20 per vassal − 15 if you pay tribute.</p></div>`;
}

function yearEndView(){
  const y=G.year-1,ev=G.chronicle.filter(e=>e.y===y);
  return `${topbar()}<div class="stack fade" style="max-width:820px;margin:0 auto">
    <p class="eyebrow">The year has ended</p><h1>${esc(G.yearNames[y]||'Year '+y)}</h1>
    <div class="panel stack"><h3>The chronicle of Sumer</h3>${ev.length?`<ul class="report">${ev.map(e=>`<li>${esc(e.t)}</li>`).join('')}</ul>`:'<p class="muted">The cities kept to themselves this year.</p>'}
    <p class="small muted">Each team will find its private Scribe's report on its Council tab.</p></div>
    <div class="grid2">${standingsPanel(null)}<div class="panel stack"><h3>Year ${G.year}</h3><p>The river priests expect a <b>${FLOOD[G.flood].n.toLowerCase()}</b>.</p>${G.sargonYear===G.year?'<p class="bad"><b>Rumors from the north:</b> an army is gathering in Akkad.</p>':G.sargonYear&&G.sargonYear-G.year===1?'<p class="small">Travelers speak of a new king rising in the north.</p>':''}<p class="small muted">${G.maxYears-G.year+1} year${G.maxYears-G.year+1===1?'':'s'} remain.</p></div></div>
    <button class="primary" data-act="nextYear" style="padding:14px;font-size:1.1rem">Begin year ${G.year}</button></div>`;
}

function overView(){
  const st=standings(),win=st[0];const humans=st.filter(c=>c.human);
  const best=(f)=>G.cities.slice().sort((a,b)=>f(b)-f(a))[0];
  const aw=[
    ['First among the cities',win,`Highest score: ${score(win)}`],
    ['Greatest builder',best(c=>Object.values(c.bld).reduce((a,v)=>a+v,0)),'Most building levels'],
    ['Most feared',best(c=>c.stats.wins*3+vassalsOf(c)*5),'Most victories and vassals'],
    ['Richest treasury',best(c=>valueOf(c.res)),'Largest store of goods'],
    ['Lawgiver',best(c=>c.laws.length*10+c.order),'Most laws and highest Order']
  ];
  return `${topbar()}<div class="stack fade" style="max-width:900px;margin:0 auto;text-align:left">
    <p class="glyphs" aria-hidden="true">𒈗 𒆠 𒂗 𒄀</p>
    <p class="eyebrow">The reign is over · ${G.maxYears} years</p><h1>${esc(win.name)} stands first in Sumer</h1>
    <p>${win.human?`${esc(win.team)} led ${esc(win.name)} to the highest score.`:`The computer ruler ${esc(win.ruler)} of ${esc(win.name)} outlasted every team.`}${humans.length?` The best team was <b>${esc(humans[0].team)}</b> (${esc(humans[0].name)}), with ${score(humans[0])} points.`:''}</p>
    <div class="awards">${aw.map(([t,c,d])=>`<div class="panel stack" style="gap:4px"><span class="eyebrow">${t}</span><b>${esc(c.name)}${c.human?' · '+esc(c.team):''}</b><span class="small muted">${d}</span></div>`).join('')}</div>
    <div class="panel"><div class="tablebox"><table><thead><tr><th>City</th><th>Ruled by</th><th>People</th><th>Buildings</th><th>Laws</th><th>Wins</th><th>Score</th></tr></thead><tbody>
      ${st.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${rulerOf(c)}</td><td class="num">${c.pop}</td><td class="num">${Object.values(c.bld).reduce((a,v)=>a+v,0)}</td><td class="num">${c.laws.length}</td><td class="num">${c.stats.wins}</td><td class="num">${score(c)}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="panel stack"><h3>Debrief questions</h3><ol class="stack" style="margin:0;padding-left:20px;gap:8px">
      <li>Southern Mesopotamia had rich soil but no timber, stone, or metal. How did that shape your choices? How did it shape real Sumerian cities?</li>
      <li>What kept Order high in your city: laws, temples, food, or force? Compare your choices with Urukagina's reforms or the Code of Ur-Nammu.</li>
      <li>Did your city keep its treaties? What happened to trust when someone broke an oath?</li>
      <li>Sumer stayed divided into rival city-states until Sargon conquered them. Using your game, explain why the cities never united on their own.</li>
      <li>When the assembly or the people wanted a voice, how did you respond? Where do you see the roots of limited government in Sumer?</li>
    </ol></div>
    <div class="row"><button class="primary" data-act="newGame">Set up a new game</button><button data-act="teacher">Teacher panel</button></div>
  </div>`;
}

function teacherView(){
  const code=G?saveCode():'';
  const reveal=G&&U.reveal?`<div class="tablebox"><table><thead><tr><th>City</th><th>People</th><th>Soldiers</th><th>Barley</th><th>Silver</th><th>Order</th><th>Score</th></tr></thead><tbody>${G.cities.map(c=>`<tr><td>${esc(c.name)}${c.human?' · '+esc(c.team):` · ${c.persona}`}</td><td class="num">${c.pop}</td><td class="num">${c.jobs.soldier}</td><td class="num">${c.res.barley}</td><td class="num">${c.res.silver}</td><td class="num">${c.order}</td><td class="num">${score(c)}</td></tr>`).join('')}</tbody></table></div>`:'';
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Teacher panel"><div class="panel">
    <div class="row" style="justify-content:space-between"><h2>Teacher panel</h2><button data-act="close">Close</button></div>
    ${G?`<div class="stack"><h3>Game length</h3><p>Year ${G.year} of <b class="num">${G.maxYears}</b>.${G.sargonYear?` Sargon arrives in year ${G.sargonYear}.`:''}</p>
      <div class="row"><button class="mini" data-act="addYears" data-v="-1" ${G.maxYears<=G.year?'disabled':''}>−1 year</button><button class="mini" data-act="addYears" data-v="1">+1 year</button><button class="mini" data-act="addYears" data-v="5">+5 years</button>
      <button class="mini danger" data-act="endNow">End the game now</button></div></div>
    <div class="stack"><h3>Mission rules</h3><div class="row">${[['trade','Trade'],['war','War'],['assassination','Assassination'],['diplomacy','Diplomacy']].map(([k,l])=>`<label><input type="checkbox" id="t-rule-${k}" data-grule="${k}" ${G.rules[k]?'checked':''}> ${l}</label>`).join('')}</div></div>
    <div class="stack"><h3>Save code</h3><p class="small muted">The game saves on this device after every turn. To move it to another computer or keep a backup, copy this code and paste it on the start screen.</p>
      <textarea id="savecode" rows="3" readonly>${code}</textarea><div class="row"><button class="mini" data-act="copy">Copy save code</button>${U.msg.copy?`<span class="small">${esc(U.msg.copy)}</span>`:''}</div></div>
    <div class="stack"><h3>All cities</h3><button class="mini" data-act="reveal">${U.reveal?'Hide':'Show'} every city's numbers</button>${reveal}</div>`:''}
    <div class="row"><button class="${U.confirmNew?'danger':''}" data-act="newGame">${U.confirmNew?'Click again to abandon this game':'Start a new game'}</button></div>
  </div></div>`;
}

function rulesView(){
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="How to play"><div class="panel">
    <div class="row" style="justify-content:space-between"><h2>How to play</h2><button data-act="close">Close</button></div>
    <div class="stack" style="max-width:68ch">
    <p>You are the <b>ensi</b> (ruler) of a Sumerian city around 2500 BCE. Each turn is one year. Score points by growing your city, building, passing laws, winning wars, and earning Prestige.</p>
    <p><b>1. Council.</b> Every year a matter comes before the throne. Choose wisely; each choice is based on real Sumerian history. Answer offers from other cities here too.</p>
    <p><b>2. People.</b> Assign workers. Farmers grow barley, and everyone eats about 1 gur a year (soldiers eat more). If the barley runs out, people starve. Weavers make textiles to trade, and brickmakers make bricks for building.</p>
    <p><b>3. Build.</b> Canals feed more people but slowly salt the soil. Temples keep Order. Walls and bronze win wars. The Edubba trains scribes for more missions.</p>
    <p><b>4. Missions.</b> Send merchants abroad for timber and copper, envoys for treaties, soldiers to raid or conquer, and agents to assassinate rival officials. Missions resolve when the year ends.</p>
    <p><b>5. Order.</b> If Order falls too low, riots break out. At zero, the people overthrow you.</p>
    <p><b>Watch the north.</b> Late in the game, Sargon of Akkad arrives. Allies, walls, and soldiers decide whether your city stands or kneels.</p>
    <p class="small muted">Vassals pay 20% of their barley and 25% of their silver income to their overlord every year. A vassal goes free by defeating its overlord in battle.</p></div>
  </div></div>`;
}

/* ---------- actions ---------- */
function act(a,el){
  const c=cur();const d=el.dataset;
  switch(a){
  case 'mode':U.setup.mode=d.v;if(d.v==='parallel')U.setup.teams=U.setup.teams.slice(0,1);break;
  case 'addTeam':{const free=CITY_DEFS.find(x=>!U.setup.teams.some(t=>t.city===x.id));if(free)U.setup.teams.push({name:'Team '+(U.setup.teams.length+1),city:free.id});break}
  case 'rmTeam':U.setup.teams.splice(+d.i,1);break;
  case 'years':U.setup.years=+d.v;break;
  case 'diff':U.setup.diff=d.v;break;
  case 'reseed':U.setup.seed=randomCode();break;
  case 'start':{const s=U.setup;s.teams.forEach(t=>{t.name=(t.name||'').trim()||'Team'});s.seed=(s.seed||'').trim()||randomCode();
    s.years=clamp(Math.round(+s.years||15),4,60);newGame(s);U.screen='handoff';U.tab='council';U.f={};U.msg={};save();break}
  case 'continue':{const sv=loadSaved();if(sv&&sv.G){G=sv.G;U.screen=G.over?'over':(sv.screen==='play'?'handoff':sv.screen||'handoff')}break}
  case 'loadCode':{const g=readCode(($('#loadcode')||{}).value||'');if(g){G=g;U.screen=G.over?'over':'handoff';U.msg={};save()}else U.msg.load='That code did not work. Copy the whole code from the Teacher panel and try again.';break}
  case 'rules':U.modal='rules';break;
  case 'teacher':U.modal='teacher';U.confirmNew=false;U.msg.copy='';break;
  case 'close':U.modal=null;U.confirmNew=false;break;
  case 'ready':U.screen='play';U.tab='council';U.f={};U.msg={};break;
  case 'tab':U.tab=d.v;U.msg={};break;
  case 'choose':chooseEvent(c,+d.i);save();break;
  case 'offer':U.msg.offer=answerOffer(c,+d.id,d.v==='1')||'Done.';save();break;
  case 'job':{const k=d.k,dv=+d.v||+d.d;let n=c.jobs[k]+dv;const min=k==='soldier'?c.soldiersOut:0;
    if(dv>0)n=c.jobs[k]+Math.min(dv,idle(c));c.jobs[k]=Math.max(min,n);break}
  case 'build':{const k=d.k,cost=BLD[k].cost(c.bld[k]);if(c.bld[k]<BLD[k].max&&canPay(c,cost)){pay(c,cost);c.bld[k]++;c.stats.built++;
    const nm=k==='temple'?TEMPLE_NAMES[c.bld.temple-1]:BLD[k].n;U.msg.build=`${nm} ${c.bld[k]>1?'expanded to level '+c.bld[k]:'built'}.`;
    if(k==='temple'&&c.bld.temple>=3)chron(`${c.name} raised a ${TEMPLE_NAMES[c.bld.temple-1].toLowerCase()} to ${c.god}.`);
    if(k==='walls'&&c.bld.walls===3)chron(`${c.name} raised mighty walls.`);save()}break}
  case 'mission':{const t=d.v,f=U.f;let m;
    if(t==='trade'){const cargo=readGoods('cargo',['barley','textiles','silver']);m={type:'trade',dest:f.dest||'dilmun',cargo:cargo,people:Math.floor(+f.merch||2)}}
    if(t==='war')m={type:'war',target:f.wtarget||G.cities.find(o=>o!==c).id,soldiers:Math.floor(+f.wsol||soldiersHome(c)),goal:f.wgoal||'raid'};
    if(t==='assassination')m={type:'assassination',target:f.atarget||G.cities.find(o=>o!==c).id,role:f.arole||'general',people:Math.floor(+f.agents||1)};
    if(t==='diplomacy'){const tg=f.dtarget||'nippur';m={type:'diplomacy',target:tg,prop:tg==='nippur'?'pilgrimage':(f.dprop||'peace'),gift:readGoods('gift',['barley','textiles','silver','timber','copper']),want:readGoods('want',['barley','silver','timber','copper']),people:1}}
    const err=queueMission(c,m);U.f.open=t;U.msg[t]=err?{ok:false,t:err}:{ok:true,t:'Mission sent. It resolves when the year ends.'};
    if(!err){Object.keys(U.f).forEach(k=>{if(/^(cargo|gift|want)-/.test(k))delete U.f[k]})}save();break}
  case 'cancel':cancelMission(c,+d.id);save();break;
  case 'exchange':{const t=cityById(U.f.xtarget||G.cities.find(o=>o!==c).id);const g=readGoods('xg',RES),w=readGoods('xw',RES);
    if(!valueOf(g)&&!valueOf(w)){U.msg.exchange={ok:false,t:'Fill in what you give and what you want.'};break}
    if(!canPay(c,g)){U.msg.exchange={ok:false,t:'You do not have everything you are offering.'};break}
    if(t.human){makeOffer(c,t,'trade',g,w,false);U.msg.exchange={ok:true,t:`Offer sent. ${t.team} will see it on their turn. Your goods are held until they answer.`}}
    else{const r=aiConsider(t,c,g,w);U.msg.exchange={ok:r.ok,t:r.msg}}
    if(U.msg.exchange.ok)Object.keys(U.f).forEach(k=>{if(/^x[gw]-/.test(k))delete U.f[k]});save();break}
  case 'withdraw':{const o=G.offers.find(o=>o.id===+d.id);if(o&&o.status==='open'){gain(c,o.give);o.status='withdrawn';G.offers=G.offers.filter(x=>x.status==='open')}save();break}
  case 'endTurn':{fixJobs(c);if(G.turnIdx<G.order.length-1){G.turnIdx++;U.screen='handoff'}else{endYear();U.screen=G.over?'over':'yearEnd'}U.f={};U.msg={};window.scrollTo(0,0);save();break}
  case 'nextYear':U.screen='handoff';window.scrollTo(0,0);save();break;
  case 'addYears':G.maxYears=Math.max(G.year,G.maxYears+(+d.v));if(G.over&&G.maxYears>G.year){G.over=false;G.year++;G.flood=floodFor(G.year);startYear();U.screen='handoff';U.modal=null}save();break;
  case 'endNow':G.over=true;G.maxYears=Math.max(1,G.year-1);U.screen='over';U.modal=null;save();break;
  case 'copy':{const ta=$('#savecode');const v=ta?ta.value:'';const done=()=>{U.msg.copy='Copied.';render()};
    try{navigator.clipboard.writeText(v).then(done,()=>{ta.select();U.msg.copy='Press Ctrl+C (or Cmd+C) to copy the selected code.';render();$('#savecode').select()})}catch(e){ta.select()}return}
  case 'reveal':U.reveal=!U.reveal;break;
  case 'newGame':if(G&&!G.over&&!U.confirmNew){U.confirmNew=true;U.modal='teacher';break}
    U.confirmNew=false;U.modal=null;G=null;U.screen='setup';U.setup.seed=randomCode();try{localStorage.removeItem(SAVE_KEY)}catch(e){}break;
  }
  render();
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;act(el.dataset.act,el)});
document.addEventListener('toggle',e=>{const el=e.target;if(el.dataset&&el.dataset.open){if(el.open)U.f.open=el.dataset.open;else if(U.f.open===el.dataset.open)U.f.open=null}},true);
document.addEventListener('input',e=>{const el=e.target,d=el.dataset;
  if(d.team!=null){U.setup.teams[+d.team][d.k]=el.value;if(d.k==='city')render();return}
  if(d.set){U.setup[d.set]=d.set==='years'?(+el.value||U.setup.years):el.value;return}
  if(d.rule){U.setup.rules[d.rule]=el.checked;return}
  if(d.grule){G.rules[d.grule]=el.checked;save();return}
  if(d.f){U.f[d.f]=el.value;if(d.rerender||/^(cargo|gift|want)-|^merch$/.test(d.f)&&e.type==='change')render();}
});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;
  if(d.set==='years'){render();return}
  if(d.f&&/^(cargo)-/.test(d.f)){render()}
});

function start(data){
  if(data&&data.G){G=data.G;U=Object.assign(U,data.U||{})}
  else{const sv=loadSaved();if(sv&&sv.G&&!sv.G.over){/* offer continue on setup screen */}}
  render();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({G:G,U:U}));
window.claude&&window.claude.hot&&window.claude.hot.ready?window.claude.hot.ready(start):start(window.claude&&window.claude.hot?window.claude.hot.data:{});
</script>
