<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arena of Ages: a one-life history arena game. Build a warrior, battle through nine eras, and power your attacks with history knowledge. Free from Agora Arcade.">
<link rel="icon" type="image/png" href="favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Arena of Ages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one centered play column; camp is a tile grid, the fight is a stacked arena (nameplates / painted arena / action bar / log). */
:root{
  --stone:#efe9df;      /* warm limestone ground */
  --panel:#ffffff;
  --ink:#19202e;
  --muted:#596377;
  --line:#cdd3dc;
  --lapis:#22408c;      /* primary */
  --lapis-2:#1a3270;
  --lapis-soft:#e3e9f7;
  --bronze:#a2661c;     /* gold, rewards */
  --bronze-soft:#f6ebd9;
  --blood:#b2261d;      /* HP */
  --stam:#2f7d59;       /* stamina, correct */
  --stam-soft:#e2f2ea;
  --display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--stone);color:var(--ink)}
html:fullscreen{overflow-y:auto}
.fsbtn{cursor:pointer;color:var(--lapis);font-weight:700}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--display);font-size:1.35rem;color:var(--lapis);background:none;border:0;padding:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--lapis)}
.chip.gold b{color:var(--bronze)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);font-weight:700}
.btn{border:2px solid var(--lapis);background:var(--lapis);color:#fff;border-radius:8px;padding:10px 18px;font-weight:700}
.btn:hover{background:var(--lapis-2);border-color:var(--lapis-2)}
.btn.ghost{background:transparent;color:var(--lapis)}
.btn.ghost:hover{background:var(--lapis-soft)}
.btn.gold{background:var(--bronze);border-color:var(--bronze)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
input[type=text],select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}

/* Title */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1;color:var(--lapis)}
.hero .tag{font-size:1.1rem;max-width:44ch}
.hero svg{width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.era-strip{display:flex;flex-wrap:wrap;gap:6px}
.era-strip span{font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:#fff}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* Camp tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.tile:hover{border-color:var(--lapis);box-shadow:0 2px 0 var(--lapis)}
.tile h3{font-size:1.25rem;color:var(--lapis)}
.tile.main{background:var(--lapis);color:#fff;border-color:var(--lapis)}
.tile.main h3{color:#fff}
.tile.main .muted{color:#d6def3}
.badge{display:inline-block;background:var(--bronze);color:#fff;border-radius:999px;font-size:.75rem;padding:1px 8px;font-weight:700}

/* Stat rows */
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .v{font-variant-numeric:tabular-nums;font-weight:700;min-width:2.5ch;text-align:center;font-size:1.1rem}
.sq{width:36px;height:36px;border-radius:8px;border:2px solid var(--lapis);background:#fff;color:var(--lapis);font-weight:700;font-size:1.1rem}
.sq:disabled{opacity:.35}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--lapis)}
.opt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.opt[aria-pressed=true]{border-color:var(--lapis);background:var(--lapis-soft);color:var(--lapis);font-weight:700}

/* Era map */
.era{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.era .pic{min-height:120px}
.era .pic svg{width:100%;height:100%;display:block}
.era .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.era.locked{opacity:.55}
.bouts{display:flex;gap:8px;flex-wrap:wrap}
.bout{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;text-align:left;min-width:150px}
.bout:hover:not(:disabled){border-color:var(--lapis)}
.bout.done{background:var(--stam-soft);border-color:#a8d3bd}
.bout.champ{border-width:2px;border-color:var(--bronze)}
.bout small{display:block;color:var(--muted);font-size:.78rem}
@media (max-width:560px){.era{grid-template-columns:1fr}.era .pic{height:90px;min-height:0}}

/* Fight */
.plates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plate{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.plate.foe{text-align:right}
.plate .nm{font-family:var(--display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:14px;background:#e5e8ee;border-radius:7px;overflow:hidden;margin-top:6px;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .35s}
.plate.foe .bar>i{left:auto;right:0}
.bar.st{height:8px}.bar.st>i{background:var(--stam)}
.nums{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.arena{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#cbb98f}
.arena svg{display:block;width:100%;height:min(44vh,41.25vw);min-height:160px}
.crowd{display:flex;align-items:center;gap:10px;font-size:.85rem}
.crowd .bar{flex:1;margin:0;height:10px}.crowd .bar>i{background:var(--bronze)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px;text-align:left;color:var(--ink);min-width:0}
.act b{display:block;font-size:.98rem}
.act span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.act:hover:not(:disabled){border-color:var(--lapis);background:var(--lapis-soft)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.know{background:var(--bronze-soft);border-color:#dfc08f}
.act.know b{color:var(--bronze)}
@media (max-width:640px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:2px;min-height:120px}
.log p{margin:0}
.log p:first-child{font-weight:700}
.log p:nth-child(n+4){color:var(--muted)}
.pos{transition:transform .45s cubic-bezier(.3,.7,.3,1)}
@keyframes lunge{0%{transform:translateX(0)}40%{transform:translateX(calc(var(--d)*26px))}100%{transform:translateX(0)}}
@keyframes hurt{0%,100%{transform:translateX(0)}30%{transform:translateX(calc(var(--d)*-10px))}60%{transform:translateX(calc(var(--d)*4px))}}
@keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.lunge{animation:lunge .4s ease-out}
.hurt{animation:hurt .35s ease-out}
.hurt path,.hurt circle,.hurt rect,.hurt ellipse,.hurt polygon{filter:brightness(1.4)}
.pop{animation:floatup 1s ease-out forwards;font-family:var(--display);font-size:28px;paint-order:stroke;stroke:#fff;stroke-width:4px}
@media (prefers-reduced-motion:reduce){.pos{transition:none}.lunge,.hurt{animation:none}.pop{animation-duration:.01s}}

/* Modal */
.veil{position:fixed;inset:0;background:rgba(18,24,38,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border-radius:12px;max-width:620px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.modal h2{font-size:1.6rem;color:var(--lapis)}
.qopts{display:grid;gap:8px}
.qopt{border:2px solid var(--line);background:#fff;border-radius:8px;padding:12px 14px;text-align:left;font-size:1.02rem;color:var(--ink)}
.qopt:hover:not(:disabled){border-color:var(--lapis)}
.qopt.right{border-color:var(--stam);background:var(--stam-soft)}
.qopt.wrong{border-color:var(--blood);background:#fbe9e7}
.qtimer{height:6px;background:#e5e8ee;border-radius:3px;overflow:hidden}
.qtimer i{display:block;height:100%;background:var(--bronze)}
.fact{border:1px solid #dfc08f;background:var(--bronze-soft);border-radius:10px;padding:14px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:start}
.fact svg{width:72px;height:72px}
.explain{border-left:4px solid var(--lapis);background:var(--lapis-soft);padding:10px 12px;border-radius:0 8px 8px 0}

/* Shop / museum / report */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{font-size:1.1rem}
.tagpill{font-size:.75rem;border-radius:4px;padding:1px 6px;background:var(--lapis-soft);color:var(--lapis);font-weight:700;margin-left:6px;white-space:nowrap}
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.relic{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.relic svg{width:64px;height:64px}
.relic.locked{opacity:.5}
.relic:hover:not(:disabled){border-color:var(--bronze)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}
.code{word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:#f3f5f8;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:140px;overflow:auto}
.note{font-size:.85rem;background:var(--lapis-soft);border-radius:8px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:.92rem;max-width:90vw}
.footer{text-align:center;font-size:.8rem;color:var(--muted)}




/* Town camp */
.camphead{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.camphead{grid-template-columns:1fr}}
.townwrap{border-radius:14px;overflow:hidden;border:3px solid #5a3a1c;background:#cdb487;box-shadow:0 6px 18px rgba(42,29,23,.25)}
.townscroll{overflow-x:auto}
.town{display:block;width:100%;min-width:720px;height:auto}
.towntip{margin:0;padding:6px 12px;background:#2a1d17;color:#f6e2a8}
.bld{cursor:pointer;outline:none;transition:filter .15s}
.bld:hover,.bld:focus-visible{filter:brightness(1.12) drop-shadow(0 0 8px rgba(255,214,120,.9))}
.bld:focus-visible .plq rect:first-child{stroke:#fff;stroke-width:3}
.townwalker{transition:transform .6s ease-in-out}
.townwalker.going{opacity:.9}
@keyframes smoke{0%{transform:translate(0,0);opacity:.55}100%{transform:translate(18px,-70px) scale(1.8);opacity:0}}
.smoke{animation:smoke 3.9s linear infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.smoke{animation:none}.townwalker{transition:none}}
.townnav{display:flex;flex-wrap:wrap;gap:6px}
/* Heroes */
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hero-card{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;align-items:start}
.hero-card h3{font-size:1.25rem;margin:0}
.hero-card.locked{opacity:.75}.hero-card.carried{border-color:var(--stam);box-shadow:0 0 0 3px var(--stam-soft)}
.heroface{width:72px;height:72px}
.buff{color:var(--stam)}
/* Pets to scale */
.relic svg.petcard{width:100%;max-width:170px;height:76px;max-height:none}
.petfact{grid-template-columns:minmax(0,170px) minmax(0,1fr)}.petfact svg.petcard{width:100%;height:auto}
@media (max-width:520px){.petfact{grid-template-columns:1fr}}
/* Title poster */
.tposter{position:relative;border-radius:18px;overflow:hidden;min-height:440px;display:flex;align-items:flex-end;background:#2a1640;box-shadow:0 10px 30px rgba(42,22,64,.35)}
.tscene{position:absolute;inset:0}.tscene svg{width:100%;height:100%;display:block}
.tposter::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,12,40,.92) 0%,rgba(24,12,40,.7) 38%,rgba(24,12,40,0) 70%);pointer-events:none}
.tcontent{position:relative;z-index:1;padding:32px;max-width:560px;display:flex;flex-direction:column;gap:14px}
.teyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#ffcf7a;font-weight:700}
.ttitle{font-family:var(--display);font-size:clamp(2.8rem,8vw,5.2rem);line-height:.95;margin:0;background:linear-gradient(180deg,#fff6c8 0%,#f2c95a 45%,#c9762a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.ttag{color:#f6e7d0;font-size:1.1rem;margin:0;max-width:46ch;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.trow{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{font:inherit;font-weight:700;border-radius:10px;padding:12px 22px;border:2px solid #f2c95a;background:rgba(0,0,0,.25);color:#fff3d6}
.tbtn.main{background:linear-gradient(180deg,#f7d06a,#d9922a);color:#2a1d17;border-color:#fff0b0;box-shadow:0 4px 0 #8a4f12}
.tbtn:hover{filter:brightness(1.1)}.tbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-width:640px){.tposter{min-height:520px}.tposter::after{background:linear-gradient(0deg,rgba(24,12,40,.95) 0%,rgba(24,12,40,.75) 55%,rgba(24,12,40,0) 85%)}.tcontent{padding:20px}}
.eraband{display:flex;flex-wrap:wrap;gap:8px}
.erachip{display:flex;flex-direction:column;padding:6px 12px;border-radius:10px;background:var(--c);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.erachip b{font-size:.88rem}.erachip small{font-size:.72rem;opacity:.85}
.tfeatures{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tfeatures article{background:var(--panel);border-radius:12px;padding:16px;border-top:6px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tfeatures h3{color:var(--c);font-size:1.4rem;margin:0 0 .2em}.tfeatures p{margin:0}
.tlower{display:flex;flex-direction:column;gap:12px}

/* Crossroads */
#xr{display:flex;flex-direction:column;gap:14px}
.xscene{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.xscene svg{width:100%;height:100%;min-height:130px;display:block}
.xscene p{margin:0;padding:14px 16px 14px 0;font-size:1.02rem;max-width:62ch}
@media (max-width:620px){.xscene{grid-template-columns:1fr}.xscene svg{height:110px;min-height:0}.xscene p{padding:0 14px 14px}}
.xopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.xopt{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-width:0}
.xopt b{font-size:1.05rem}
.xopt:hover:not(:disabled){border-color:var(--lapis);box-shadow:0 3px 0 var(--lapis)}
.xopt:disabled{opacity:.5;cursor:not-allowed}
.xopt.walk{background:transparent;border-style:dashed}
.xtag{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:#e5e8ee;color:var(--muted)}
.tg-gold{background:var(--bronze-soft);color:var(--bronze)}.tg-quiz{background:var(--lapis-soft);color:var(--lapis)}.tg-hard{background:#ece3f6;color:#5d3a7a}.tg-sac{background:#fbe9e7;color:var(--blood)}
.xreq{color:var(--muted)}.xwin{color:var(--stam);font-weight:700}.xlose{color:var(--blood)}
.xresult{border-left:6px solid var(--stam)}.xresult.bad{border-left-color:var(--blood)}.xresult p{margin:.3em 0}
.traitrow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.trait{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:#ece3f6;color:#5d3a7a}
.trait.omen-good{background:var(--stam-soft);color:var(--stam)}.trait.omen-bad{background:#fbe9e7;color:var(--blood)}

/* v4: rolls, bosses, effects */
.actions{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1000px){.actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
.act[data-a="throw"]{background:linear-gradient(180deg,#fff,#f3f7f0)}
.act.rollb{background:linear-gradient(180deg,#fff,#eef2fa)}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(calc(var(--d)*360deg))}}
.roll{animation:roll .45s ease-in-out;transform-box:fill-box;transform-origin:50% 65%}
@keyframes flicker{from{transform:scaleY(1) skewX(0)}to{transform:scaleY(1.14) skewX(4deg)}}
.flame{animation:flicker .16s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.55}100%{transform:translate(24px,-90px);opacity:0}}
.mote{animation:mote 7s linear infinite}
@media (prefers-reduced-motion:reduce){.roll,.flame,.mote{animation:none}}
.fstat{display:flex;gap:8px;flex-wrap:wrap;font-size:.88rem;min-height:1.6em;align-items:center}
.fstat .warn{color:#fff;background:var(--blood);padding:3px 10px;border-radius:4px;font-weight:700}
.fstat .good{color:var(--stam);font-weight:700}.fstat .bad{color:var(--blood);font-weight:700}
.bossplate{border-color:#e2b13c;box-shadow:0 0 0 2px rgba(226,177,60,.35)}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.85)}
.bout.boss{background:linear-gradient(135deg,#2a1d17,#5a3a1c);color:#f6e7c8;border-color:#e2b13c}
.bout.boss small{color:#e2c48a}.bout.boss.done{background:linear-gradient(135deg,#2f5a40,#2a1d17)}

.itile svg,.relic svg{filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.arena{background:#2a1d17}

/* Builds, collection, expeditions, score */
.clsrow{display:flex;gap:6px;flex-wrap:wrap}
.clsb{border:1px solid #5a3a1c;background:rgba(255,250,235,.6);border-radius:999px;padding:3px 10px;font-size:.82rem;color:#2a1d17}

.relic.carried{border-color:var(--stam);box-shadow:0 0 0 3px var(--stam-soft)}
.relic svg{width:64px;height:auto;max-height:64px}
.btn.sm{padding:4px 10px;font-size:.85rem;border-width:1px}
.glyph{width:40px;height:40px;flex:none}
.glyph.txt{display:inline-flex;align-items:center;justify-content:center;min-width:34px;width:auto;height:40px;font:700 1.5rem Georgia,"Times New Roman",serif;color:#2a1d17}
.cipher-msg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:14px;background:#f3eadb;border:2px solid #d2b277;border-radius:8px}
.cipher-msg .glyph{width:48px;height:48px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:6px}
.keycell{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff;font-size:.78rem;font-weight:700;text-align:center}
.keycell .glyph{width:30px;height:30px}.keycell .glyph.txt{font-size:1.1rem;height:30px}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mopt{font-size:.92rem;padding:10px}
.mopt.sel{border-color:var(--lapis);background:var(--lapis-soft)}
.ordopt{display:flex;gap:10px;align-items:center}
.ordn{width:26px;height:26px;border-radius:50%;background:var(--lapis-soft);color:var(--lapis);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ordopt.picked{border-color:var(--lapis)}.ordopt.picked .ordn{background:var(--lapis);color:#fff}
.clue{margin:.25em 0;padding:8px 10px;background:var(--bronze-soft);border-radius:6px}
.scorebox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:center}
.bigscore{font-family:var(--display);font-size:3rem;color:var(--lapis);line-height:1.05;font-variant-numeric:tabular-nums}

/* Armory shop scene */
.shop{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:820px){.shop{grid-template-columns:1fr}}
.shopL{display:flex;flex-direction:column;gap:12px;min-width:0}
.smithwrap{display:grid;grid-template-columns:38% minmax(0,1fr);align-items:center;border-radius:12px;overflow:hidden;border:3px solid #5a3a1c;background:#3b2c22;min-height:260px}
.smith{display:block;width:100%;height:100%;object-fit:cover;align-self:end}
.bubble{position:relative;margin:12px 12px 12px 4px;background:#fffdf6;border:2px solid #2a1d17;border-radius:14px;padding:12px 14px;font-size:.95rem;z-index:1;box-shadow:3px 3px 0 rgba(0,0,0,.35)}

.bubble p{margin:.35em 0}
.bubble .btn{margin-top:6px;padding:8px 14px}
.req{font-weight:700;font-size:.88rem}.req.ok{color:var(--stam)}.req.no{color:var(--blood)}
.statline{color:var(--lapis);font-weight:700}
.tryon{display:flex;gap:12px;align-items:center;padding:12px}
.tryon svg{width:180px;max-width:42%;height:auto;flex:none;background:linear-gradient(#f3eadb,#e2d3b5);border-radius:8px}
.bubble .bubart{float:right;width:68px;height:68px;margin:0 0 4px 8px}
.tryon .up{color:var(--stam)}.tryon .down{color:var(--blood)}
.shopR{background:linear-gradient(160deg,#f3e3bf,#e3c993 60%,#d2b277);border:3px solid #5a3a1c;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 40px rgba(90,58,28,.35);min-width:0}
.shoptabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stab{font-family:var(--display);background:#8a5a2b;color:#fff3d6;border:2px solid #4e3015;border-radius:6px;padding:4px 12px;font-size:1rem}
.stab[aria-selected=true]{background:#e2b13c;color:#2a1d17}
.itemgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.itemgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.itile{position:relative;background:rgba(255,250,235,.55);border:2px solid rgba(90,58,28,.35);border-radius:10px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#2a1d17;min-width:0}
.itile svg{width:76%;max-width:96px;aspect-ratio:1;height:auto}
.itile .iname{font-size:.78rem;font-weight:700;text-align:center;line-height:1.15;min-height:2.3em}
.itile .iprice{font-size:.75rem;color:#5a3a1c;font-variant-numeric:tabular-nums}
.itile:hover{border-color:#5a3a1c;background:rgba(255,250,235,.85)}
.itile.sel{border-color:var(--lapis);box-shadow:0 0 0 3px rgba(34,64,140,.35)}
.itile.equipped{border-color:#2f7d59;background:rgba(226,242,234,.8)}
.itile.equipped .iprice,.itile.owned .iprice{color:var(--stam);font-weight:700}
.itile.locked svg *{fill:#7f9fd6!important;stroke:#7f9fd6!important}
.itile.locked svg{opacity:.85}
.itile.locked .iname{color:#4a5f8a}
.itile.req .iprice,.itile.unusable .iprice,.itile.poor .iprice{color:var(--blood);font-weight:700}
.itile.empty{background:transparent;border-style:dashed;min-height:120px}
.shopfoot{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.goldtag{font-family:var(--display);font-size:1.2rem;background:#2a1d17;color:#e2b13c;border-radius:6px;padding:4px 12px;font-variant-numeric:tabular-nums}
.crestrow{display:flex;flex-direction:column;gap:6px}

</style>

function buildWeapons(){
  return WEAPON_ROWS.map(([id,name,era,cls,two,vis,icon,fact,x])=>{
    x=x||{};const C=CLS[cls];
    const dmg=x.dmg!=null?x.dmg:Math.round(TIER_DMG[era+1]*C.dm*(two?1.15:1));
    const price=era<0?0:Math.round((30*(era+1)*(era+1)+30)*(two?1.1:1)/10)*10;
    return {id,name,era,cls,twoHand:!!two,vis,icon,fact,dmg,price,reach:x.reach||C.reach,rq:era<0?null:C.rq,rq2:era<0?null:C.rq2,hv:two?1:0,mods:x.mods};
  });
}

const THROW_FX={stun:"May stun",shieldbreak:"Sticks in shields and ruins them",noBlock:"Can't be blocked",pierce:"Ignores half of armor"};
function throwFxText(t){const p=[];if(t.fx==="stun")p.push(`${Math.round((t.fxChance||.25)*100)}% chance to stun`);if(t.fx==="shieldbreak")p.push("sticks in shields and ruins them");if(t.noBlock)p.push("can't be blocked");if(t.pierce)p.push("ignores half of armor");if(t.acc)p.push(`+${t.acc}% accuracy`);return p.join(", ")}

function reqVal(it){return (!it||it.era<0||!it.rq)?0:6+it.era*3+(it.hv?2:0)}
function reqList(it){const r=[];if(it&&it.era>=0&&it.rq){r.push([it.rq,reqVal(it)]);if(it.rq2)r.push([it.rq2,4+it.era*2])}return r}

function scoreOf(s){
  const r=s.rec||{};let corr=0;for(const k in r) if(k!=="hard") corr+=r[k].c;
  const hard=r.hard?r.hard.c:0, bouts=Object.keys(s.wins||{}).length;
  let eras=0;for(let e=0;e<9;e++) if(s.wins&&s.wins[e+"-3"]) eras++;
  const parts={bouts:bouts*100,eras:eras*300,artifacts:(s.artifacts||[]).length*150,pets:(s.pets||[]).length*150,followers:(s.followers||[]).length*100,
    answers:corr*10,hard:hard*30,level:(s.level||1)*25,losses:-((s.fights&&s.fights.lost)||0)*20,champion:eras===9?2000:0};
  let total=0;for(const k in parts) total+=parts[k];
  return {total:Math.max(0,total),parts};
}

  const b={hp:0,atk:0,def:0,agi:0,str:0,cha:0,vit:0,gold:0};
  const carried=(save.carry||[]).filter(id=>(save.artifacts||[]).includes(id)).slice(0,2);
  carried.forEach(id=>{const a=ARTIFACTS[id]; if(a) for(const k in a.bonus) b[k]=(b[k]||0)+a.bonus[k];});
  const pet=save.pet&&(save.pets||[]).includes(save.pet)?PETS[save.pet]:null;
  if(pet) for(const k in pet.bonus) b[k]=(b[k]||0)+pet.bonus[k];
  return b;
}

function foeDef(e,b){return b===3?ERAS[e].boss:ERAS[e].foes[b]}

function makeFoe(e,b){
  const d=foeDef(e,b), L=foeLevel(e,b), boss=b===3, pts=8+L*4.2-(e===0&&!boss?(3-b)*2:0)-(boss?3:0)-(e<2?(2-e)*3:0);

/* Movement works in either direction, since fighters can roll past each other. */
function dirTo(f,o){return o.pos>=f.pos?1:-1}

function canRetreat(f,o){const d=-dirTo(f,o);return clamp(f.pos+d,0,10)!==f.pos}
function rollChance(f,o){return clamp(55+(f.st.agi-o.st.agi)*4+(f.rollBonus||0),25,95)}
function rollAway(f,o){const d=-dirTo(f,o);f.pos=clamp(f.pos+d*3,0,10);f.sta-=12}
function rollPastSpot(f,o){if(dist(f,o)>2)return null;const np=o.pos+dirTo(f,o);return np<0||np>10?null:np}

/* Quick battle forecast: plays the fight many times with a sensible strategy. */
function simFight(p,f,acc){
  p=JSON.parse(JSON.stringify(p));f=JSON.parse(JSON.stringify(f));let wind=0,ft=0,pt=0;const ph=f.boss?[0.75,0.5,0.25]:[];
  for(let t=0;t<220;t++){const d=dist(p,f);
    if(f.boss){while(ph.length&&f.hp/f.maxHp<=ph[0]){ph.shift();if(RNG()<acc){f.hp-=Math.round(f.maxHp*0.08);f.stunned=1}else{f.hp=Math.min(f.maxHp,f.hp+Math.round(f.maxHp*0.12));f.enrage=(f.enrage||0)+1}}
      if(f.hp<=0)return 1;if(++pt%3===0){if(RNG()<acc)p.buff=3;else f.momentum=1}if(p.buff>0)p.buff--}
    if(wind&&d<=3&&p.sta>=12&&canRetreat(p,f)) rollAway(p,f);
    else if(p.scrolls>0&&f.hp>f.maxHp*0.3&&RNG()<0.25){p.scrolls--;if(RNG()<acc*0.75)knowledgeStrike(p,f);else knowledgeBackfire(p,f)}
    else if(p.cls==="bow"&&d<=1&&p.sta>=12&&canRetreat(p,f)) rollAway(p,f);
    else if(d>p.reach){if(p.sta>=4)advance(p,f);else rest(p)}
    else if(p.sta<14)rest(p); else if(p.sta>=25&&RNG()<0.3)attack(p,f,"power"); else attack(p,f,"strike");
    if(f.hp<=0)return 1;
    f.sta=Math.min(100,f.sta+6);
    if(f.stunned)f.stunned=0;
    else if(f.boss&&wind){wind=0;if(dist(f,p)<=3){const dm=reduce(p,rawDamage(f,2.0))*(p.ironWill?0.5:1);p.hp-=Math.round(dm)}}
    else if(f.boss&&(++ft)%4===0) wind=1;
    else{const a=foeChoose(f,p);if(a==="advance"){advance(f,p);braceHit(p,f);if(f.hp<=0)return 1}else if(a==="rest")rest(f);else if(a==="taunt")f.sta-=8;else attack(f,p,a)}
    p.sta=Math.min(100,p.sta+6);
    if(p.hp<=0){if(p.secondWind){p.secondWind=false;if(RNG()<acc){p.hp=Math.round(p.maxHp*(p.swHeal||.4));continue}}return 0}
  }
  return 0;
}
function battleOdds(save,e,b,acc){let w=0;const N=160;const p=playerFighter(save),f=makeFoe(e,b);for(let i=0;i<N;i++)w+=simFight(p,f,acc);return Math.round(w/N*100)}

const MOVES={
  strike:{cost:12,hit:0,mult:1,label:"Strike"},
  quick:{cost:6,hit:15,mult:0.6,label:"Quick Jab"},
  power:{cost:25,hit:-18,mult:1.8,label:"Power Strike"},
  shot:{cost:10,hit:-5,mult:0.8,label:"Ranged shot"}
};
function hitChance(att,def,move){
  const hb=att.hitBonus||0;
  let h=72+(att.st.atk-def.st.agi)*3+MOVES[move].hit-(att.rattled?12:0);
  if(att.cls==="bow"&&dist(att,def)<=1) h-=35;
  if(att.cls==="mace") h-=5;
  if(def.cls==="fist") h-=8;
  return clamp(Math.round(h+hb),15,95);
}
function powerStat(att){return att.cls==="bow"?att.st.agi*0.9+att.st.atk*0.5:att.cls==="fist"?att.st.str*2:att.st.str*1.5}
function rawDamage(att,mult){return (att.wdmg+powerStat(att))*rnd(0.85,1.15)*mult*(att.dmgMult||1)*(att.lastStand&&att.hp<att.maxHp/2?1.15:1)*(att.buff>0?1.25:1)*(1+0.15*(att.enrage||0))*(att.momentum?1.5:1)}
function reduce(def,dmg,att){const ar=att&&att.cls==="mace"?def.armor*0.67:def.armor;return dmg*100/(100+def.st.def*3+ar*4)}
/* One attack. Brawlers swing twice on Strike and Power Strike. */
function attack(att,def,move){
  const hc=hitChance(att,def,move), M=MOVES[move];
  att.sta-=(att.cls==="fist"&&move==="quick")?3:M.cost; att.rattled=0;
  const swings=(att.cls==="fist"&&move!=="quick")?2:1, mult=swings===2?M.mult*0.6:M.mult;
  const out={hit:false,dmg:0,crit:false,blocked:false,parried:false,stun:false,hits:0,swings,hc};
  for(let i=0;i<swings;i++){
    if(RNG()*100>=hc) continue;
    let dmg=reduce(def,rawDamage(att,mult),att);
    if(RNG()<(att.cls==="sword"?0.20:0.08)+(att.critBonus||0)){dmg*=1.5;out.crit=true}
    if(def.block&&RNG()<def.block*(move==="shot"||att.cls==="bow"?1.5:1)){dmg*=0.3;out.blocked=true}
    else if(def.cls==="sword"&&move!=="shot"&&att.cls!=="bow"&&RNG()<0.20){dmg*=0.5;out.parried=true}
    dmg=Math.max(1,Math.round(dmg)); def.hp-=dmg; out.dmg+=dmg; out.hits++; out.hit=true;
  }
  if(out.hit&&att.cls==="mace"&&RNG()<0.12){def.stunned=1;out.stun=true}
  att.momentum=0;
  return out;
}
function braceHit(p,f){
  if(p.cls!=="spear"||dist(p,f)>p.reach||p.hp<=0) return 0;
  if(RNG()*100>=hitChance(p,f,"quick")) return -1;
  const dmg=Math.max(1,Math.round(reduce(f,rawDamage(p,0.8),p)));f.hp-=dmg;return dmg;
}
function knowledgeStrike(att,def){
  const dmg=Math.max(1,Math.round(rawDamage(att,att.ksMult||2.0))); def.hp-=dmg; return dmg;
}
function knowledgeBackfire(p,f){const dmg=Math.max(1,Math.round(reduce(p,rawDamage(f,2.0))));p.hp-=dmg;return dmg}
function stepSize(f){return Math.min(4,1+Math.floor(f.st.agi/8)+(f.stepBonus||0))}
function dist(a,b){return Math.abs(a.pos-b.pos)}
function rest(f){f.sta=Math.min(100,f.sta+(f.restAmt||35));if(f.restHeal)f.hp=Math.min(f.maxHp,f.hp+Math.round(f.maxHp*f.restHeal)); f.hp=Math.min(f.maxHp,f.hp+Math.round(f.maxHp*0.04));}
function tauntChance(a,d){return clamp(45+(a.st.cha-d.st.cha)*5+(a.tauntBonus||0),15,90)}
function foeChoose(f,p){
  const dd=dist(f,p);
  if(f.sta<14) return "rest";
  if(f.hp<f.maxHp*0.25 && RNG()<0.12) return "rest";
  if(f.ranged && dd>=2 && dd<=6 && f.sta>=MOVES.shot.cost && RNG()<0.75) return "shot";
  if(dd>1) return RNG()<0.08&&f.sta>=8?"taunt":"advance";
  const r=RNG();
  if(f.sta>=25 && r<0.25) return "power";
  if(r<0.5) return "quick";
  if(r<0.95) return "strike";
  return "taunt";
}

function builtin(eraKey){return (BANK[eraKey]||[]).map((r,i)=>({id:eraKey+i,era:eraKey,q:r[0],a:r.slice(1,5),e:r[5]}))}
function customQs(){return CLASS&&CLASS.qs?CLASS.qs.map((r,i)=>({id:"c"+i,era:r.era||"all",q:r.q,a:r.a,e:r.e||"",custom:true})):[]}
function hardQs(){return HARD.map((r,i)=>({id:"h"+i,era:"hard",q:r[0],a:r.slice(1,5),e:r[5]}))}
function poolFor(eraKey){
  const mode=CLASS&&CLASS.qs&&CLASS.qs.length?CLASS.mode:"builtin";
  const cus=customQs();
  if(eraKey==="hard") return mode==="custom"&&cus.length?cus:hardQs();
  const b=eraKey==="class"?[]:builtin(eraKey);
  const cm=eraKey==="class"?cus:cus.filter(q=>q.era==="all"||q.era===eraKey);
  if(mode==="custom") return cm.length?cm:cus.length?cus:b;
  if(mode==="mix") return b.concat(cm);
  return b;
}
/* Every question in a pool is used once before any repeats; progress is saved. */
function pickQ(eraKey){
  let pool=poolFor(eraKey);
  if(!pool.length) pool=builtin("egypt");
  S.seen=S.seen||{}; let seen=S.seen[eraKey]||[];
  let fresh=pool.filter(q=>!seen.includes(q.id)&&!recent.includes(q.id));
  if(!fresh.length){seen=[];fresh=pool.filter(q=>!recent.includes(q.id));if(!fresh.length)fresh=pool}
  const q=fresh[Math.floor(Math.random()*fresh.length)];
  seen.push(q.id);S.seen[eraKey]=seen;recent.push(q.id);if(recent.length>12)recent.shift();
  return q;
}

function shade(hex,amt){
  let c=(hex||"#888").replace("#","");if(c.length===3)c=c.split("").map(x=>x+x).join("");
  const n=parseInt(c,16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255,p=Math.abs(amt);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

function colosseumFacade(u){

  for(let r=0;r<3;r++){const y=88+r*44;for(let i=0;i<16;i++){const x=10+i*50;const cy=y-Math.sin((i/15)*Math.PI)*22+r*0;s+=`<path d="M${x} ${cy+30} V${cy+10} Q${x+15} ${cy-6} ${x+30} ${cy+10} V${cy+30} Z" fill="rgba(40,25,15,.55)"/><path d="M${x+2} ${cy+12} Q${x+15} ${cy-2} ${x+28} ${cy+12}" stroke="rgba(255,230,190,.25)" stroke-width="1.5" fill="none"/>`}

function shopBubble(it){

function shopAction(it){
  if(!it) return;

  if(st==="buy"){S.gold-=it.price;S.owned.push(it.id);S.gear[it.slot]=it.id;save();
    SHOP.msg=`<b>${esc(it.name)}</b><p>A fine choice. It's yours, and you're wearing it now.</p><p class="small">${esc(it.fact)}</p>`;}

  renderShop();
}

    const i=+b.dataset.i, ok=opts[i].ok;

}

function decodeClass(code){
  code=code.trim(); if(!code.startsWith("AOA1.")) throw new Error("bad");
  const o=JSON.parse(b64d(code.slice(5)));
  return {title:o.t||"Class questions",mode:o.m||"mix",qs:o.q.map(r=>({q:r[0],a:r.slice(1,5).filter(Boolean),era:r[5]||"all",e:r[6]||""})).filter(x=>x.q&&x.a.length>=2)};

const ERA_ALIASES={egypt:["1","egypt","egyptian"],greece:["2","greece","greek"],persia:["3","persia","persian"],rome:["4","rome","roman"],china:["5","china","chinese","han","qin"],mali:["6","mali","africa"],medieval:["7","medieval","europe","middle ages"],japan:["8","japan","japanese","feudal japan"],revolution:["9","revolution","american revolution","usa","us"]};
function eraFromText(t){t=(t||"").trim().toLowerCase();if(!t)return "all";for(const k in ERA_ALIASES) if(ERA_ALIASES[k].includes(t)||k===t) return k;return "all"}
function parseQuestions(text){
  const out=[],bad=[];
  text.split(/\r?\n/).forEach((line,i)=>{if(!line.trim())return;
    const parts=(line.includes("\t")?line.split("\t"):line.split("|")).map(s=>s.trim());
    if(/^question$/i.test(parts[0])) return;
    const q=parts[0], ans=parts.slice(1,5).filter(Boolean);
    if(!q||ans.length<2){bad.push(i+1);return}
    out.push({q,a:ans,era:eraFromText(parts[5]),e:parts[6]||""});
  });
  return {out,bad};
}

/* ---------- collection: carry 2 artifacts and 1 pet ---------- */
function renderCollection(){
  const ids=Object.keys(ARTIFACTS), pids=Object.keys(PETS);
  S.carry=S.carry||[];S.pets=S.pets||[];
  const findLoc=(kind,id)=>{for(const k in EXPEDITIONS){const x=EXPEDITIONS[k].find(p=>p.reward[kind]===id);if(x)return x.site+" ("+ERAS.find(E=>E.key===k).name+")"}return ""};
  setApp(topbar()+`<div class="row" style="justify-content:space-between"><h2 style="font-size:1.9rem">Collection</h2><button class="btn ghost" id="bk" type="button">Back to camp</button></div>
  <p class="muted">You can carry <b>2 artifacts</b> and bring <b>1 pet</b> into battle. Only what you carry gives its bonus. Find more on Expeditions.</p>
  <section class="panel"><span class="eyebrow">Carrying now</span><div class="row" style="margin-top:8px">
    ${[0,1].map(i=>{const id=S.carry[i];return id?`<span class="chip">${esc(ARTIFACTS[id].name)} · ${esc(ARTIFACTS[id].bonusText)}</span>`:`<span class="chip muted">Empty artifact slot</span>`}).join("")}
    ${S.pet?`<span class="chip">${esc(PETS[S.pet].name)} · ${esc(PETS[S.pet].bonusText)}</span>`:`<span class="chip muted">No pet</span>`}</div></section>
  <h3 style="font-size:1.4rem">Artifacts · ${S.artifacts.length} of ${ids.length}</h3>
  <div class="relics">${ids.map(id=>{const A=ARTIFACTS[id],has=S.artifacts.includes(id),on=S.carry.includes(id);
    return `<div class="relic ${has?"":"locked"} ${on?"carried":""}">${relicSVG(A.icon,!has)}<b class="small">${has?esc(A.name):"Not yet found"}</b><span class="small muted">${has?esc(A.bonusText):esc(findLoc("art",id))}</span>
      ${has?`<div class="row" style="gap:6px;justify-content:center"><button class="btn ghost sm" type="button" data-read="${id}">Read</button><button class="btn ${on?"":"gold"} sm" type="button" data-carry="${id}">${on?"Put away":"Carry"}</button></div>`:""}</div>`}).join("")}</div>
  <h3 style="font-size:1.4rem">Pets · ${S.pets.length} of ${pids.length}</h3><p class="small muted" style="margin:0">Each pet is drawn to its real size next to a 1.75 m (5 ft 9 in) person.</p>
  <div class="relics">${pids.map(id=>{const P=PETS[id],has=S.pets.includes(id),on=S.pet===id;
    return `<div class="relic ${has?"":"locked"} ${on?"carried":""}">${petCard(id,!has)}<b class="small">${has?esc(P.name):"Not yet found"}</b><span class="small muted">${has?esc(P.bonusText):esc(findLoc("pet",id))}</span>
      ${has?`<div class="row" style="gap:6px;justify-content:center"><button class="btn ghost sm" type="button" data-pread="${id}">Read</button><button class="btn ${on?"":"gold"} sm" type="button" data-pet="${id}">${on?"Leave home":"Bring"}</button></div>`:""}</div>`}).join("")}</div>`);
  bindTop();$("bk").onclick=renderCamp;
  document.querySelectorAll("[data-carry]").forEach(b=>b.onclick=()=>{const id=b.dataset.carry;
    if(S.carry.includes(id)) S.carry=S.carry.filter(x=>x!==id);
    else{ if(S.carry.length>=2){toast("You can only carry 2 artifacts. Put one away first.");return} S.carry.push(id)}
    save();renderCollection()});
  document.querySelectorAll("[data-pet]").forEach(b=>b.onclick=()=>{S.pet=S.pet===b.dataset.pet?null:b.dataset.pet;save();renderCollection()});
  document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{const A=ARTIFACTS[b.dataset.read];
    openModal(`<div class="fact">${relicSVG(A.icon,false)}<div><span class="eyebrow">${esc(ERAS[A.era].name)}</span><h2 style="font-size:1.4rem">${esc(A.name)}</h2><p>${esc(A.fact)}</p><p class="small muted">Where to see it: ${esc(A.where)}<br>Bonus when carried: ${esc(A.bonusText)}</p></div></div><div class="row"><button class="btn" id="dn" type="button">Close</button></div>`,()=>$("dn").onclick=closeModal)});
  document.querySelectorAll("[data-pread]").forEach(b=>b.onclick=()=>{const P=PETS[b.dataset.pread];
    openModal(`<div class="fact petfact">${petCard(b.dataset.pread,false)}<div><span class="eyebrow">${esc(ERAS[P.era].name)}</span><h2 style="font-size:1.4rem">${esc(P.name)}</h2><p>${esc(P.fact)}</p><p class="small"><b>Size:</b> ${esc(petInfo(b.dataset.pread).text||"")} Shown next to a 1.75 m (5 ft 9 in) person.</p><p class="small muted">Bonus when brought: ${esc(P.bonusText)}</p></div></div><div class="row"><button class="btn" id="dn" type="button">Close</button></div>`,()=>$("dn").onclick=closeModal)});

/* ---------- expeditions ---------- */
const PZ_LABEL={cipher:"Decode",order:"Timeline",match:"Match",riddle:"Who am I?"};
function expFound(x){return x.reward.art?S.artifacts.includes(x.reward.art):(S.pets||[]).includes(x.reward.pet)}
function renderExpeditions(){
  setApp(topbar()+`<div class="row" style="justify-content:space-between"><h2 style="font-size:1.9rem">Expeditions</h2><button class="btn ghost" id="bk" type="button">Back to camp</button></div>
  <p class="muted">Artifacts and pets are hidden at historic sites. Pay for supplies, then solve the site's puzzle to claim the find. Fail, and you'll need new supplies to try again. New sites open as you reach each era.</p>
  <div class="grid">${ERAS.map((E,e)=>{const un=eraUnlocked(e), xs=EXPEDITIONS[E.key];
    return `<article class="era ${un?"":"locked"}"><div class="pic"><svg viewBox="380 40 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${arenaBG(e,{id:"x"+e,noCrowd:true})}</svg></div>
    <div class="body"><div><span class="eyebrow">${esc(E.dates)}</span><h3 style="font-size:1.35rem">${esc(E.name)}</h3></div>
    ${un?`<div class="bouts">${xs.map(x=>{const f=expFound(x);const name=x.reward.art?ARTIFACTS[x.reward.art].name:PETS[x.reward.pet].name;
      return `<button class="bout ${f?"done":""}" type="button" data-x="${x.id}" ${f?"disabled":""}><b>${esc(x.site)}</b><small>${PZ_LABEL[x.type]} · ${x.reward.pet?"Pet":"Artifact"}${f?` · Found: ${esc(name)}`:` · ${expCost(e)} gold`}</small></button>`}).join("")}</div>`
      :`<p class="small muted">Reach ${esc(E.name)} in the Arena to open these sites.</p>`}</div></article>`}).join("")}</div>`);
  bindTop();$("bk").onclick=renderCamp;
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    let x,e;ERAS.forEach((E,i)=>{const f=EXPEDITIONS[E.key].find(p=>p.id===b.dataset.x);if(f){x=f;e=i}});
    const cost=expCost(e);
    if(S.gold<cost){toast(`Supplies cost ${cost} gold. You have ${S.gold}.`);return}
    confirmBox(x.site,`Buy supplies for ${cost} gold and attempt this ${PZ_LABEL[x.type]} puzzle? If you fail, the gold is spent.`,`Pay ${cost} gold`,()=>{S.gold-=cost;save();runPuzzle(x,e)});
  });
}
function puzzleWin(x,e){
  let name,fact,icon;
  if(x.reward.art){S.artifacts.push(x.reward.art);if((S.carry||[]).length<2){S.carry=S.carry||[];S.carry.push(x.reward.art)}const A=ARTIFACTS[x.reward.art];name=A.name;fact=A.fact+" Bonus when carried: "+A.bonusText+".";icon=relicSVG(A.icon,false)}
  else{S.pets=S.pets||[];S.pets.push(x.reward.pet);if(!S.pet)S.pet=x.reward.pet;const P=PETS[x.reward.pet];name=P.name;fact=P.fact+" Bonus when brought: "+P.bonusText+".";icon=petCard(x.reward.pet,false)}
  save();
  return `<div class="fact">${icon}<div><span class="eyebrow">${x.reward.pet?"Pet found":"Artifact found"}</span><h3 style="font-size:1.25rem">${esc(name)}</h3><p class="small" style="margin:.3em 0">${esc(fact)}</p></div></div>`;
}
function puzzleEnd(x,e,won,explain){
  const box=$("pzEnd");
  box.innerHTML=(won?`<div class="explain"><b>Solved!</b> ${esc(explain||"")}</div>${puzzleWin(x,e)}`:`<div class="explain"><b>The expedition failed.</b> ${esc(explain||"")}</div>`)+
    `<div class="row" style="margin-top:12px"><button class="btn" id="pzDone" type="button">Back to Expeditions</button></div>`;
  box.querySelectorAll("button").length;$("pzDone").onclick=()=>{closeModal();renderExpeditions()};
  document.querySelectorAll("#modal .pz-live").forEach(el=>el.querySelectorAll("button,input").forEach(c=>c.disabled=true));
  $("pzDone").focus({preventScroll:true});
}
function runPuzzle(x,e){
  const head=`<span class="eyebrow">${esc(ERAS[e].name)} · ${esc(x.site)} · ${PZ_LABEL[x.type]}</span><p style="margin:0">${esc(x.prompt)}</p>`;
  if(x.type==="cipher"){
    let tries=3;
    openModal(head+`<div class="pz-live"><div class="cipher-msg">${x.msg.map(s=>glyphSVG(x.script,s)).join(x.script==="code"?" ":"")}</div>
      <details open><summary class="small"><b>Key</b></summary><div class="keygrid">${x.key.map(([s,l])=>`<div class="keycell">${glyphSVG(x.script,s)}<span>${esc(l)}</span></div>`).join("")}</div></details>
      <label for="pzIn" class="small"><b>Your answer</b></label><div class="row"><input type="text" id="pzIn" autocomplete="off" style="flex:1;min-width:0"><button class="btn" id="pzGo" type="button">Check</button></div>
      <p class="small" id="pzMsg">Tries left: 3</p></div><div id="pzEnd"></div>`);
    const norm=t=>t.toUpperCase().replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim();
    const check=()=>{const v=norm($("pzIn").value);if(!v)return;
      if(x.answer.some(a=>norm(a)===v)){puzzleEnd(x,e,true,x.explain);return}
      tries--; if(tries<=0){puzzleEnd(x,e,false,`The answer was ${x.answer[0]}. `+x.explain);return}
      $("pzMsg").textContent=`Not quite. Tries left: ${tries}`;$("pzIn").select()};
    $("pzGo").onclick=check;$("pzIn").onkeydown=ev=>{if(ev.key==="Enter")check()};$("pzIn").focus();
  }
  else if(x.type==="order"){
    const items=shuffle(x.items.map((it,i)=>({t:it[0],y:it[1],i})));let picked=[];
    const draw=()=>{$("pzList").innerHTML=items.map(it=>{const n=picked.indexOf(it.i);return `<button type="button" class="qopt ordopt ${n>=0?"picked":""}" data-i="${it.i}"><span class="ordn">${n>=0?n+1:""}</span>${esc(it.t)}</button>`}).join("");
      document.querySelectorAll(".ordopt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const n=picked.indexOf(i);if(n>=0)picked=picked.slice(0,n);else picked.push(i);draw()});
      $("pzGo").disabled=picked.length!==items.length};
    openModal(head+`<p class="small muted" style="margin:0">Tap the events in order, earliest first. Tap a numbered event to undo from there. You get one try.</p><div class="pz-live"><div class="qopts" id="pzList"></div><div class="row" style="margin-top:10px"><button class="btn" id="pzGo" type="button" disabled>Check my order</button></div></div><div id="pzEnd"></div>`);
    draw();
    $("pzGo").onclick=()=>{const ok=picked.every((v,k)=>v===k);
      const correct=x.items.map((it,k)=>`${k+1}. ${it[0]} (${it[1]})`).join(" · ");
      puzzleEnd(x,e,ok,ok?"Correct order: "+correct:"The correct order was: "+correct)};
  }
  else if(x.type==="match"){
    const L=shuffle(x.pairs.map((p,i)=>({t:p[0],i}))), R=shuffle(x.pairs.map((p,i)=>({t:p[1],i})));let sel=null,done=[],mistakes=0;
    const draw=()=>{$("pzL").innerHTML=L.map(o=>`<button type="button" class="qopt mopt ${done.includes(o.i)?"right":""} ${sel===o.i?"sel":""}" data-l="${o.i}" ${done.includes(o.i)?"disabled":""}>${esc(o.t)}</button>`).join("");
      $("pzR").innerHTML=R.map(o=>`<button type="button" class="qopt mopt ${done.includes(o.i)?"right":""}" data-r="${o.i}" ${done.includes(o.i)?"disabled":""}>${esc(o.t)}</button>`).join("");
      document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{sel=+b.dataset.l;draw()});
      document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(sel===null){$("pzMsg").textContent="Pick something on the left first.";return}
        const r=+b.dataset.r;if(r===sel){done.push(r);sel=null;if(done.length===x.pairs.length){puzzleEnd(x,e,true,"Every pair matched.");return}draw()}
        else{mistakes++;if(mistakes>1){puzzleEnd(x,e,false,"Two wrong matches. Correct pairs: "+x.pairs.map(p=>p[0]+" = "+p[1]).join("; ")+".");return}
          $("pzMsg").textContent="That's not a match. One more mistake ends the expedition.";sel=null;draw()}})};
    openModal(head+`<p class="small muted" style="margin:0">Pick an item on the left, then its match on the right. You can make only one mistake.</p><div class="pz-live"><div class="matchgrid"><div class="qopts" id="pzL"></div><div class="qopts" id="pzR"></div></div><p class="small" id="pzMsg"></p></div><div id="pzEnd"></div>`);
    draw();
  }
  else if(x.type==="riddle"){
    let shown=1;const opts=shuffle(x.options.map((t,i)=>({t,ok:i===0})));
    const draw=()=>{$("pzClues").innerHTML=x.clues.slice(0,shown).map((c,i)=>`<p class="clue"><b>Clue ${i+1}:</b> ${esc(c)}</p>`).join("")};
    openModal(head+`<div class="pz-live"><div id="pzClues"></div><div class="qopts">${opts.map((o,i)=>`<button type="button" class="qopt" data-i="${i}">${esc(o.t)}</button>`).join("")}</div><p class="small" id="pzMsg">Wrong guesses allowed: ${x.clues.length-1}</p></div><div id="pzEnd"></div>`);
    draw();
    document.querySelectorAll("#modal [data-i]").forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];
      if(o.ok){b.classList.add("right");puzzleEnd(x,e,true,x.explain);return}
      b.classList.add("wrong");b.disabled=true;
      if(shown>=x.clues.length){puzzleEnd(x,e,false,`The answer was ${x.options[0]}. `+x.explain);return}
      shown++;draw();$("pzMsg").textContent=`Not quite. A new clue appears. Wrong guesses left: ${x.clues.length-shown}`});
  }
}

function crossCost(o,e){return Math.round(o.cost*(1+e*0.35))}
function sacItems(kinds){
  const out=[];kinds=[...new Set(kinds.flatMap(k=>k==="armor"?["armor","legs","arms"]:k==="weapon"?["weapon","throw"]:[k]))];
  kinds.forEach(k=>{
    if(k==="artifact")(S.artifacts||[]).forEach(id=>out.push({kind:"artifact",id,name:ARTIFACTS[id].name}));
    else if(k==="pet")(S.pets||[]).forEach(id=>out.push({kind:"pet",id,name:PETS[id].name}));
    else GEAR[k].filter(it=>it.price>0&&S.owned.includes(it.id)).forEach(it=>out.push({kind:k,id:it.id,name:it.name}));
  });
  return out;
}
function doSacrifice(x){
  if(x.kind==="artifact"){S.artifacts=S.artifacts.filter(i=>i!==x.id);S.carry=(S.carry||[]).filter(i=>i!==x.id)}
  else if(x.kind==="pet"){S.pets=S.pets.filter(i=>i!==x.id);if(S.pet===x.id)S.pet=null}
  else{S.owned=S.owned.filter(i=>i!==x.id);
    if(S.gear[x.kind]===x.id){const cls=x.kind==="weapon"?GEAR.weapon.find(w=>w.id===x.id).cls:null;
      S.gear[x.kind]=x.kind==="weapon"?(cls==="fist"?"wf0":cls==="bow"?"ws0":"w0"):x.kind==="shield"?"s1":x.kind==="helmet"?"h1":GEAR[x.kind][0].id}}
}
function applyReward(r,rematch){
  const lines=[];if(!r)return lines;
  if(r.trait){if((S.traits||[]).includes(r.trait)){S.pts+=2;lines.push(`You already have ${TRAITS[r.trait].name}, so you gain <b>2 skill points</b> instead.`)}
    else{S.traits.push(r.trait);lines.push(`New trait: <b>${TRAITS[r.trait].name}</b>. ${TRAITS[r.trait].text}`)}}
  if(r.stat)for(const k in r.stat){const v=rematch?Math.ceil(r.stat[k]/2):r.stat[k];S.stats[k]+=v;lines.push(`<b>+${v} ${STATINFO[k][0]}</b>`)}
  if(r.pts){const v=rematch?Math.ceil(r.pts/2):r.pts;S.pts+=v;lines.push(`<b>+${v} skill points</b> to spend at the Training Grounds`)}
  if(r.gold){const v=Math.round(r.gold*(1+F.e*0.35));if(r.gold>0){S.gold+=v;lines.push(`<b>+${v} gold</b>`)}}
  if(r.xp){S.xp+=r.xp;lines.push(`<b>+${r.xp} XP</b>`);while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;S.pts+=4;lines.push(`Level up! <b>Lv ${S.level}</b> (+4 skill points)`)}}
  if(r.omen){S.omen=r.omen;lines.push(`Next fight: <b>${OMENS[r.omen].name}</b>. ${OMENS[r.omen].text}`)}
  return lines;
}
function applyPenalty(r){
  const lines=[];if(!r)return lines;
  if(r.gold){const v=Math.min(S.gold,Math.round(r.gold*(1+F.e*0.35)));S.gold-=v;lines.push(`You lose <b>${v} gold</b>.`)}
  if(r.omen){S.omen=r.omen;lines.push(`Next fight: <b>${OMENS[r.omen].name}</b>. ${OMENS[r.omen].text}`)}
  return lines;
}
function rewardPreview(r){const p=[];if(!r)return "";
  if(r.trait)p.push(`Trait: ${TRAITS[r.trait].name}${(S.traits||[]).includes(r.trait)?" (owned: +2 points instead)":""}`);
  if(r.stat)for(const k in r.stat)p.push(`+${r.stat[k]} ${STATINFO[k][0]}`);
  if(r.pts)p.push(`+${r.pts} skill points`);if(r.gold)p.push(`+${Math.round(r.gold*(1+F.e*0.35))} gold`);if(r.xp)p.push(`+${r.xp} XP`);if(r.omen)p.push(`Next fight: ${OMENS[r.omen].name}`);
  return p.join(" · ")}
function penaltyPreview(r){const p=[];if(!r)return "";if(r.gold)p.push(`lose ${Math.round(r.gold*(1+F.e*0.35))} gold`);if(r.omen)p.push(`next fight: ${OMENS[r.omen].name}`);return p.join(" · ")}
const TYPE_TAG={gold:["Costs gold","tg-gold"],quiz:["Answer a question","tg-quiz"],hard:["Hard question","tg-hard"],sac:["Sacrifice","tg-sac"]};
function renderCrossroads(e,rematch){
  const sc=pickScene(e), opts=shuffle(sc.opts), se=Math.max(0,ERAS.findIndex(E=>SCENES[E.key].includes(sc)));save();
  const body=()=>`<div class="row" style="justify-content:space-between"><div><span class="eyebrow">The Crossroads · ${esc(ERAS[se].name)}</span><h2 style="font-size:1.9rem">${esc(sc.title)}</h2></div><span class="goldtag">${S.gold} gold</span></div>
  <section class="xscene"><svg viewBox="380 40 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${arenaBG(se,{id:"xr",noCrowd:true})}</svg><p>${esc(sc.text)}</p></section>
  <p class="muted small" style="margin:0">Choose one path${rematch?". This is a rematch, so stat and skill-point rewards are halved":""}.</p>
  <div class="xopts">${opts.map((o,i)=>{const t=TYPE_TAG[o.type];let req="",ok=true;
    if(o.type==="gold"){const c=crossCost(o,e);req=`${c} gold`;ok=S.gold>=c}
    if(o.type==="sac"){const n=sacItems(o.sac).length;req=`Give up: ${o.sac.map(k=>k==="artifact"?"an artifact":k==="pet"?"a pet":"your "+k).join(" or ")}`;ok=n>0}
    if(o.type==="quiz"||o.type==="hard")req=o.type==="hard"?"From the hard question pool":"A question from this era";
    return `<button type="button" class="xopt" data-i="${i}" ${ok?"":"disabled"}><span class="xtag ${t[1]}">${t[0]}</span><b>${esc(o.label)}</b><span class="small">${esc(o.desc)}</span>
      <span class="xreq small">${esc(req)}${ok?"":o.type==="gold"?" · not enough gold":" · nothing to give"}</span>
      <span class="xwin small">Reward: ${esc(rewardPreview(o.win))}</span>${o.lose?`<span class="xlose small">If wrong: ${esc(penaltyPreview(o.lose))}</span>`:""}</button>`}).join("")}
   <button type="button" class="xopt walk" data-i="walk"><span class="xtag">Free</span><b>Walk on</b><span class="small">Keep your gold and gear and head back to camp.</span></button></div>`;
  setApp(topbar()+`<div id="xr">${body()}</div>`);bindTop();
  const done=(lines,good)=>{save();$("xr").innerHTML=`<span class="eyebrow">The Crossroads · ${esc(ERAS[se].name)}</span><h2 style="font-size:1.9rem">${esc(sc.title)}</h2>
    <section class="panel xresult ${good?"good":"bad"}">${lines.map(l=>`<p>${l}</p>`).join("")||"<p>You walk on.</p>"}</section>
    <div class="row"><button class="btn" id="xdone" type="button">Back to camp</button></div>`;$("xdone").onclick=renderCamp;$("xdone").focus({preventScroll:true})};
  document.querySelectorAll(".xopt").forEach(b=>b.onclick=()=>{
    if(b.dataset.i==="walk"){renderCamp();return}
    const o=opts[+b.dataset.i];
    if(o.type==="gold"){const c=crossCost(o,e);S.gold-=c;done([`You pay <b>${c} gold</b>.`].concat(applyReward(o.win,rematch)),true)}
    else if(o.type==="quiz"||o.type==="hard"){askQuestion(o.type==="hard"?"hard":ERAS[se].key,sc.title,o.label,ok=>{done(ok?["Correct!"].concat(applyReward(o.win,rematch)):["Wrong answer."].concat(applyPenalty(o.lose)),ok)})}
    else if(o.type==="sac"){const items=sacItems(o.sac);
      openModal(`<span class="eyebrow">Sacrifice</span><h2>${esc(o.label)}</h2><p>Choose what to give up. It is gone for good. Equipped gear is replaced with your basic gear.</p>
        <div class="qopts">${items.map((x,j)=>`<button type="button" class="qopt" data-j="${j}">${esc(x.name)} <span class="small muted">· ${x.kind==="artifact"?"artifact":x.kind==="pet"?"pet":x.kind}${S.gear[x.kind]===x.id||S.pet===x.id||(S.carry||[]).includes(x.id)?" · in use":""}</span></button>`).join("")}</div>
        <div class="row"><button class="btn ghost" id="sacNo" type="button">Cancel</button></div>`,()=>{
        $("sacNo").onclick=closeModal;
        document.querySelectorAll("#modal [data-j]").forEach(q=>q.onclick=()=>{const x=items[+q.dataset.j];closeModal();doSacrifice(x);done([`You give up the <b>${esc(x.name)}</b>.`].concat(applyReward(o.win,rematch)),true)})});}
  });
}

function throwChance(p,f){const t=p.gear.throw;let h=72+(p.st.atk-f.st.agi)*3-5+(t.acc||0)+(p.hitBonus||0)-(p.rattled?12:0)-(f.cls==="fist"?8:0)-(dist(p,f)<=1?15:0);return clamp(Math.round(h),15,95)}

  const t=p.gear.throw;p.ammo--;p.sta-=8;p.rattled=0;
  if(RNG()*100>=throwChance(p,f)) return {hit:false};
  const raw=(t.dmg+p.st.atk*0.6+p.st.str*0.6)*rnd(0.85,1.15)*(p.dmgMult||1)*(p.throwMult||1)*(p.buff>0?1.25:1);
  let dmg=raw*100/(100+f.st.def*3+f.armor*(1-(t.pierce||0))*4);
  const out={hit:true};
  if(f.block&&!t.noBlock&&RNG()<f.block*1.5){dmg*=0.3;out.blocked=true}
  if(RNG()<0.08+(p.critBonus||0)){dmg*=1.5;out.crit=true}
  out.dmg=Math.max(1,Math.round(dmg));f.hp-=out.dmg;
  if(t.fx==="shieldbreak"&&(f.block>0||f.d&&f.d.look&&f.d.look.shield&&f.d.look.shield!=="none")){f.block=0;f.armor=Math.max(0,f.armor-2);out.shieldbreak=true}
  if(t.fx==="stun"&&RNG()<(t.fxChance||.25)){f.stunned=1;out.stun=true}
  return out;
}

  const NS="http://www.w3.org/2000/svg",g=document.createElementNS(NS,"g");g.innerHTML=`<g transform="scale(.34) translate(-50 -50)">${gearIcon(t)}</g>`;fx.appendChild(g);
  const x0=X(F.p.pos),x1=X(F.f.pos),dir=x1>x0?1:-1,t0=performance.now(),D=420;
  const step=now=>{const k=Math.min(1,(now-t0)/D),x=x0+(x1-x0)*k,y=205-Math.sin(k*Math.PI)*70;

function renderHeroes(){
  S.followers=S.followers||[];S.retinue=S.retinue||[];
  const top=topEra();
  setApp(topbar()+`<div class="row" style="justify-content:space-between"><h2 style="font-size:1.9rem">Hall of Heroes</h2><button class="btn ghost" id="bk" type="button">Back to camp</button></div>
  <p class="muted">Famous people from history will join your cause if you prove you know their story. Recruit them by paying their fee and answering a question about them. Up to <b>2 followers</b> can travel with you at once, and each one gives a bonus. A wrong answer costs half the fee.</p>
  <section class="panel"><span class="eyebrow">Your retinue</span><div class="row" style="margin-top:8px">${[0,1].map(i=>{const id=S.retinue[i];return id?`<span class="chip">${esc(HEROES[id].name)} · ${esc(HEROES[id].buff)}</span>`:`<span class="chip muted">Empty follower slot</span>`}).join("")}</div></section>
  <div class="heroes">${Object.keys(HEROES).map(id=>{const H=HEROES[id],has=S.followers.includes(id),on=S.retinue.includes(id),open=H.era<=top,fee=heroFee(id);
    return `<article class="hero-card ${has?"":"locked"} ${on?"carried":""}">${heroPortrait(id,!open)}
      <div style="min-width:0"><span class="eyebrow">${esc(ERAS[H.era].name)}</span><h3>${open?esc(H.name):"Unknown hero"}</h3><p class="small muted" style="margin:.1em 0">${open?esc(H.role):`Reach ${esc(ERAS[H.era].name)} to meet this hero.`}</p>
      ${open?`<p class="small" style="margin:.3em 0">${esc(H.bio)}</p><p class="small buff"><b>Bonus:</b> ${esc(H.buff)}</p>`:""}
      ${has?`<button class="btn ${on?"":"gold"} sm" type="button" data-ret="${id}">${on?"Send home":"Bring along"}</button>`:open?`<button class="btn gold sm" type="button" data-rec="${id}" ${S.gold<fee?"disabled":""}>Recruit · ${fee} gold</button>${S.gold<fee?`<span class="small muted"> Not enough gold</span>`:""}`:""}</div></article>`}).join("")}</div>`);
  bindTop();$("bk").onclick=renderCamp;
  document.querySelectorAll("[data-ret]").forEach(b=>b.onclick=()=>{const id=b.dataset.ret;
    if(S.retinue.includes(id))S.retinue=S.retinue.filter(x=>x!==id);
    else{if(S.retinue.length>=2){toast("Only 2 followers can travel with you. Send one home first.");return}S.retinue.push(id)}
    save();renderHeroes()});
  document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>recruitHero(b.dataset.rec));
}
function recruitHero(id){
  const H=HEROES[id],fee=heroFee(id);if(S.gold<fee)return;
  confirmBox(`Recruit ${H.name}?`,`Pay ${fee} gold and answer a question about ${H.name}. If you are wrong, you lose ${Math.floor(fee/2)} gold.`,`Pay ${fee} gold`,()=>{
    const opts=shuffle(H.q.slice(1).map((t,i)=>({t,ok:i===0})));
    openModal(`<span class="eyebrow">Recruit ${esc(H.name)}</span><div class="row" style="flex-wrap:nowrap">${heroPortrait(id,false)}<p class="small" style="margin:0">${esc(H.bio)}</p></div>
      <h2 style="font-family:var(--body);font-weight:700;font-size:1.2rem;color:var(--ink)">${esc(H.q[0])}</h2>
      <div class="qopts">${opts.map((o,i)=>`<button class="qopt" type="button" data-i="${i}">${esc(o.t)}</button>`).join("")}</div><div id="qfb"></div>`,()=>{
      document.querySelectorAll("#modal [data-i]").forEach(b=>b.onclick=()=>{const ok=opts[+b.dataset.i].ok;
        document.querySelectorAll("#modal [data-i]").forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add("right")});if(!ok)b.classList.add("wrong");
        if(ok){S.gold-=fee;S.followers.push(id);if(S.retinue.length<2)S.retinue.push(id)}else S.gold-=Math.floor(fee/2);
        save();
        $("qfb").innerHTML=`<div class="explain"><b>${ok?`${esc(H.name)} joins you!`:"Not quite."}</b> ${ok?esc(H.buff):`The answer is <b>${esc(H.q[1])}</b>. You lose ${Math.floor(fee/2)} gold. You can try again later.`}</div><div class="row" style="margin-top:12px"><button class="btn" id="qok" type="button">Continue</button></div>`;
        $("qok").onclick=()=>{closeModal();renderHeroes()}})});
  });
}
function applyFollowers(save,p){
  const R=(save.retinue||[]).filter(id=>(save.followers||[]).includes(id));p.fol={};R.forEach(id=>p.fol[id]=1);
  if(p.fol.leonidas){p.st.def+=3;if(p.block>0)p.block+=0.08}
  if(p.fol.cyrus)p.st.cha+=3;
  if(p.fol.spartacus){p.st.str+=3;p.lastStand=1}
  if(p.fol.marshal){p.st.atk+=3;p.critBonus=(p.critBonus||0)+0.05}
  if(p.fol.musashi)p.critBonus=(p.critBonus||0)+0.10;
  if(p.fol.tomoe){p.st.agi+=3;p.rollBonus=(p.rollBonus||0)+10}
  if(p.fol.suntzu)p.hitBonus=(p.hitBonus||0)+6;
  if(p.fol.sundiata){p.maxHp+=30;p.hp=p.maxHp}
  if(p.fol.steuben){p.st.vit+=2;p.maxHp+=20;p.hp=p.maxHp;p.restAmt=(p.restAmt||35)+15}
  if(p.fol.sampson){p.st.vit+=3;p.maxHp+=30;p.hp=p.maxHp;p.swHeal=(p.swHeal||0.4)+0.15}
  if(p.fol.imhotep)p.restHeal=0.08;
  if(p.fol.archimedes)p.throwMult=1.3;
  if(p.fol.artemisia&&p.ammo>0)p.ammo+=1;
  if(p.fol.mansamusa)p.goldBonus+=25;
  if(p.fol.cicero)p.tauntBonus=20;
  return p;
}

function renderCamp(){
  if(!S){renderTitle();return}
  const next=nextBout(), p=playerFighter(S), sc=scoreOf(S).total;
  const rt=(S.retinue||[]).filter(id=>(S.followers||[]).includes(id));
  setApp(topbar()+`
  <section class="camphead">
    <div class="panel" style="min-width:0">
      <span class="eyebrow">Your warrior</span><h2 style="font-size:1.6rem">${esc(S.name)} <span class="small muted" style="font-family:var(--body)">· ${rankOf(sc)}</span></h2>
      ${(S.traits||[]).length||S.omen?`<div class="traitrow">${(S.traits||[]).map(t=>`<span class="trait" title="${esc(TRAITS[t].text)}">${esc(TRAITS[t].name)}</span>`).join("")}${S.omen?`<span class="trait ${OMENS[S.omen].good?"omen-good":"omen-bad"}" title="${esc(OMENS[S.omen].text)}">Next fight: ${esc(OMENS[S.omen].name)}</span>`:""}</div>`:""}
      <p class="small muted" style="margin:.3em 0">Health ${p.maxHp} · Damage ${Math.round(p.wdmg)} · Armor ${p.armor} · ${esc(p.gear.weapon.name)}${p.gear.throw.ammo?` · ${esc(p.gear.throw.name)}`:""}</p>
      <p class="small" style="margin:.3em 0"><b>${CLS[p.cls].label}${p.block?" with shield":""}</b> · ${CLS[p.cls].trait}</p>
      ${rt.length?`<p class="small" style="margin:.3em 0"><b>Followers:</b> ${rt.map(id=>esc(HEROES[id].name)).join(", ")}</p>`:""}
      ${["weapon","armor","helmet","shield","legs","arms","throw"].map(sl=>gearOf(S,sl)).filter(it=>!meetsReq(S,it)).map(it=>{const u=unmetReq(S,it);return `<p class="small" style="color:var(--blood);margin:.2em 0"><b>${esc(it.name)} isn't working:</b> it needs ${STATINFO[u[0]][0]} ${u[1]}. Visit the Training Grounds.</p>`}).join("")}
    </div>
    <div class="panel nextpanel"><span class="eyebrow">Next bout</span>${next?`<h2 style="font-size:1.4rem">${esc(foeDef(next[0],next[1]).name)}</h2><p class="muted small" style="margin:.2em 0 .6em">${esc(ERAS[next[0]].name)} · Level ${foeLevel(next[0],next[1])}${next[1]===3?" · Colosseum boss":""}</p><button class="btn gold" id="nextB" type="button">Fight now</button>`:`<h2 style="font-size:1.4rem">Champion of All Ages</h2><p class="muted small">Replay any bout from the Arena.</p>`}</div>
  </section>
  <section class="townwrap"><div class="townscroll">${townSVG()}</div><p class="small muted towntip">Choose a building to go inside. On a small screen, swipe to see the whole town.</p></section>
  <nav class="townnav" aria-label="Camp buildings">${Object.keys(TOWN).map(k=>`<button type="button" class="btn ghost sm" data-go="${k}" id="${{arena:"tArena",armory:"tShop",study:"tStudy",heroes:"tHeroes",col:"tCol",train:"tTrain",exp:"tExp",deeds:"tDeeds"}[k]}">${TOWN[k].label}</button>`).join("")}</nav>
  <div class="row small"><button class="btn ghost" id="sv" type="button">Get save code</button><button class="btn ghost" id="toTitle" type="button">Title screen</button></div>`);
  bindTop();
  if(next) $("nextB").onclick=()=>preFight(next[0],next[1]);
  const walk=k=>{const T=TOWN[k],w=$("tw"),wi=$("twi");if(!w||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){T.go();return}
    wi.style.transform=T.door[0]<560?"scale(-1,1)":"none";w.style.transform=`translate(${T.door[0]}px,${T.door[1]+6}px)`;w.classList.add("going");setTimeout(()=>T.go(),620)};
  document.querySelectorAll(".bld").forEach(g=>{try{const bb=g.getBBox(),r=document.createElementNS("http://www.w3.org/2000/svg","rect");r.setAttribute("x",bb.x);r.setAttribute("y",bb.y);r.setAttribute("width",bb.width);r.setAttribute("height",bb.height);r.setAttribute("fill","transparent");g.insertBefore(r,g.firstChild)}catch(e){}});
  document.querySelectorAll(".bld").forEach(g=>{g.onclick=()=>walk(g.dataset.b);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();walk(g.dataset.b)}}});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>walk(b.dataset.go));
  {const sc=document.querySelector(".townscroll");if(sc&&sc.scrollWidth>sc.clientWidth)sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2}
  $("sv").onclick=saveCodeModal;$("toTitle").onclick=renderTitle;
}

function renderTitle(){

  const scene=`<svg viewBox="0 0 800 330" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Two warriors face off in the Colosseum at sunset">${arenaBG(3,{id:"t",boss:true,fx:true})}

    <g transform="translate(480 296) scale(-1.55 1.55)">${fighterSVG(ERAS[3].foes[2].look,null)}</g></svg>`;
  const hof=load(HOF_KEY)||[];
  setApp(`<section class="tposter">
    <div class="tscene">${scene}</div>

      <span class="teyebrow">A history arena game · Agora Arcade</span>
      <h1 class="ttitle">Arena of Ages</h1>

      <div class="trow">${has?`<button class="tbtn main" id="cont" type="button">Continue</button><button class="tbtn" id="new" type="button">New warrior</button>`:`<button class="tbtn main" id="new" type="button">Create your warrior</button>`}</div>
    </div>
  </section>

  <section class="tfeatures">
    <article style="--c:#b2261d"><h3>Fight</h3><p>Build a swordsman, spearman, maceman, archer, or brawler. Roll, throw, and outthink Colosseum bosses.</p></article>
    <article style="--c:#22408c"><h3>Learn</h3><p>Over 450 history questions. Strikes of Knowledge, boss trials, and Second Wind all depend on what you know.</p></article>
    <article style="--c:#2f7d59"><h3>Collect</h3><p>Solve puzzles for artifacts and pets, recruit heroes like Joan of Arc and Mansa Musa, and choose your path at every Crossroads.</p></article>
  </section>
  <section class="tlower">
    ${hof.length?`<div class="hof"><span class="eyebrow">Hall of Fame</span><ol>${hof.slice(0,5).map(x=>`<li><b>${esc(x.n)}</b> · ${x.s} · ${esc(x.r)}<span class="small muted"> · ${esc(x.f)}</span></li>`).join("")}</ol></div>`:""}
    <div class="row small"><button class="btn ghost" id="code" type="button">Enter class code</button><button class="btn ghost" id="loadsave" type="button">Load a save code</button><button class="btn ghost" id="teach" type="button">Teacher tools</button>${fsOK()?`<button class="btn ghost fsbtn" type="button">Full screen</button>`:""}</div>
    ${CLASS&&CLASS.qs&&CLASS.qs.length?`<p class="note">Class questions loaded: <b>${esc(CLASS.title||"Class set")}</b> (${CLASS.qs.length} questions).</p>`:""}
  </section>`);
  if(has) $("cont").onclick=()=>{S=migrate(load(SAVE_KEY));save();renderCamp()};
  $("new").onclick=()=>{ if(has) confirmBox("Start a new warrior?","This replaces the warrior saved in this browser. Copy a save code first if you want to keep it.","Start over",()=>{S=newSave();renderCreate()}); else {S=newSave();renderCreate()} };

}

for(const k in MORE_SCENES) SCENES[k]=SCENES[k].concat(MORE_SCENES[k]);
/* Pick a scene: unseen first, current era weighted 3x, older eras possible. */
function pickScene(e){
  const pool=[];ERAS.forEach((E,i)=>{if(i<=e)SCENES[E.key].forEach(sc=>pool.push({sc,w:i===e?3:1}))});
  S.sceneSeen=S.sceneSeen||[];
  let cand=pool.filter(x=>!S.sceneSeen.includes(x.sc.id));
  if(!cand.length){S.sceneSeen=S.sceneSeen.slice(-1);cand=pool.filter(x=>!S.sceneSeen.includes(x.sc.id))}
  let r=Math.random()*cand.reduce((a,x)=>a+x.w,0),pick=cand[0];
  for(const x of cand){r-=x.w;if(r<=0){pick=x;break}}
  S.sceneSeen.push(pick.sc.id);
  return pick.sc;
}
