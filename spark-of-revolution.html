<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spark of Revolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one projector screen. Engraved sea chart on the left fills the room's view; the active
   movement's control desk docks on the right; standings run along the bottom like a ledger line. */
:root{
  color-scheme: dark;
  --sea:#0c1d31; --sea-hi:#12304d; --land:#1f364b; --coast:#5d7f98; --grat:#17324f;
  --panel:#091726; --panel-2:#0f2338; --rule:#1d3955; --rule-hi:#2c5276;
  --ink:#eceadf; --ink-2:#a8b6c3; --ink-3:#7489a0;
  --gold:#d9b45a; --gold-dim:#8f7637; --on-gold:#1a1304;
  --crown:#66748f; --danger:#ec6a52; --ok:#72cc8f;
  --f-display:'IM Fell English SC','IM Fell English',Georgia,'Times New Roman',serif;
  --f-fell:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-body:'Alegreya Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --s-1:.8125rem; --s0:1rem; --s1:1.1875rem; --s2:1.5rem; --s3:2.125rem; --s4:3.5rem; --s5:6.5rem;
  --radius:6px;
  --t-ideal:#d9b45a; --t-spread:#62bfcc; --t-resil:#de8c6c;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:var(--s0);line-height:1.4}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:1.25rem;padding:.55rem 16px;background:var(--panel);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:var(--s2);letter-spacing:.02em;white-space:nowrap;line-height:1}
.brand em{font-family:var(--f-fell);font-style:italic;color:var(--gold);font-size:.8em;padding:0 .15em}
.era{display:flex;align-items:baseline;gap:.6rem;min-width:0}
.era .yr{font-family:var(--f-display);font-size:var(--s2);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.era .lbl{color:var(--ink-2);font-size:var(--s-1);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.era .ttl{font-family:var(--f-fell);font-style:italic;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.react{margin-left:auto;display:flex;align-items:center;gap:.6rem}
.react .lbl{font-size:var(--s-1);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap}
.meter{width:clamp(90px,12vw,190px);height:12px;border:1px solid var(--rule-hi);border-radius:2px;background:var(--panel-2);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(135deg,var(--danger) 0 6px,#c65441 6px 12px);transition:width .6s}
.react b{font-variant-numeric:tabular-nums;min-width:2.6ch;text-align:right}
.tools{display:flex;gap:.4rem}
.btn{border:1px solid var(--rule-hi);background:var(--panel-2);border-radius:var(--radius);padding:.45rem .8rem;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--gold-dim)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:800}
.btn.gold:hover{filter:brightness(1.08)}
.btn.big{font-size:var(--s1);padding:.7rem 1.3rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}

.stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,27vw,430px);min-height:0}
.mapwrap{position:relative;min-height:0;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 45% 40%,var(--sea-hi),var(--sea) 70%)}
#map{width:100%;height:100%;display:block}
.zoom{position:absolute;left:12px;top:12px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--rule-hi);border-radius:var(--radius);padding:2px;z-index:2}
.zoom button{border:0;background:transparent;padding:.35rem .7rem;border-radius:4px;font-size:var(--s-1);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.zoom button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.legend{position:absolute;left:12px;bottom:10px;display:flex;gap:1rem;flex-wrap:wrap;font-size:var(--s-1);color:var(--ink-2);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:.35rem .6rem;border-radius:var(--radius);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend svg{flex:none}

/* map marks */
.land{fill:var(--land);stroke:var(--coast);stroke-width:.7;stroke-linejoin:round}
.grat{fill:none;stroke:var(--grat);stroke-width:.6}
.lk{fill:none;stroke:#6f8fa8;stroke-opacity:.35;stroke-width:1.2}
.lk.S{stroke-dasharray:4 5}
.lk.hot{stroke:var(--gold);stroke-opacity:.9;stroke-width:2}
.anchor{fill:#9db3c6;opacity:.7}
.leader{stroke:#9db3c6;stroke-opacity:.45;stroke-width:.8}
.node{cursor:pointer}
.node .base{fill:var(--crown);stroke:#0b1626;stroke-width:1.5}
.node .nlab{font-family:var(--f-body);font-weight:700;text-transform:uppercase;letter-spacing:.06em;fill:var(--ink);paint-order:stroke;stroke:#08131f;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node .pct{font-family:var(--f-body);font-weight:800;fill:#08131f;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node .sel{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:5 4}
.node .reach{fill:none;stroke-width:2;stroke-dasharray:2 3;opacity:.9}
.node:hover .base{stroke:var(--ink)}
.node.flash{animation:flash 1.2s ease-out 3}
@keyframes flash{0%{filter:drop-shadow(0 0 0 var(--gold))}40%{filter:drop-shadow(0 0 10px var(--gold))}100%{filter:drop-shadow(0 0 0 transparent)}}

/* side desk */
.side{background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;min-width:0}
.desk-head{padding:1rem 1rem .8rem;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8rem;align-items:center}
.desk-head .who{min-width:0}
.desk-head .kick{font-size:var(--s-1);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.desk-head h2{margin:0;font-family:var(--f-display);font-size:var(--s2);font-weight:400;line-height:1.05;overflow-wrap:anywhere}
.timer{--p:1;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*360deg),var(--rule) 0);position:relative;font-weight:800;font-variant-numeric:tabular-nums}
.timer::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.timer span{position:relative;font-size:var(--s1)}
.timer.late{background:conic-gradient(var(--danger) 360deg,var(--danger) 0);animation:pulse 1s infinite}
.timer.off{background:var(--rule)}
@keyframes pulse{50%{opacity:.6}}
.purse{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;padding:.7rem 1rem;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.purse .m{font-family:var(--f-display);font-size:var(--s3);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.purse .m small{font-family:var(--f-body);font-size:var(--s-1);color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;margin-left:.35rem}
.purse .info{font-size:var(--s-1);color:var(--ink-2);text-align:right}
.scroll{overflow:auto;min-height:0;flex:1}
.rcard{padding:.9rem 1rem;border-bottom:1px solid var(--rule)}
.rcard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:var(--s2);line-height:1.1}
.rcard .hint{color:var(--ink-2);margin:0}
.chips{display:flex;gap:.3rem;flex-wrap:wrap;margin:.4rem 0 .6rem}
.chip{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--rule-hi);border-radius:3px;padding:.1rem .4rem;color:var(--ink-2)}
.chip.free{border-color:currentColor;font-weight:800}
.bars{display:grid;gap:.25rem;margin:.4rem 0 .7rem}
.bar{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 3ch;gap:.5rem;align-items:center;font-size:var(--s-1)}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{height:9px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:.5rem;font-size:var(--s-1);color:var(--ink-2);padding:.1rem 0}
.kv b{color:var(--ink)}
.camp{width:100%;margin-top:.6rem}
.why{font-size:var(--s-1);color:var(--ink-3);margin:.35rem 0 0}

.tabs{display:flex;border-bottom:1px solid var(--rule);padding:0 .5rem;gap:.2rem;position:sticky;top:0;background:var(--panel);z-index:1}
.tabs button{border:0;background:transparent;padding:.65rem .7rem;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:.07em;font-size:var(--s-1)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.ups{display:grid;gap:.45rem;padding:.7rem .7rem 1rem}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem .7rem;text-align:left;border:1px solid var(--rule-hi);background:var(--panel-2);border-radius:var(--radius);padding:.6rem .7rem}
.up:hover:not(:disabled){border-color:var(--gold)}
.up .nm{font-weight:800}
.up .cost{font-family:var(--f-display);color:var(--gold);font-size:var(--s1);line-height:1;align-self:start;font-variant-numeric:tabular-nums}
.up .ds{grid-column:1/-1;font-size:var(--s-1);color:var(--ink-2)}
.up .fx{grid-column:1/-1;font-size:.78rem;display:flex;gap:.6rem;flex-wrap:wrap;color:var(--ink-3)}
.up .fx .warn{color:var(--danger)} .up .fx .calm{color:var(--ok)}
.up.owned{border-color:var(--gold-dim);background:transparent}
.up.owned .cost{font-family:var(--f-body);font-size:var(--s-1);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.up:disabled{cursor:not-allowed}
.up.poor:disabled,.up.locked:disabled{opacity:.5}
.deskfoot{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.75rem 1rem;border-top:1px solid var(--rule)}
.deskfoot .end{grid-column:1/-1}
.deskfoot .end.late{animation:pulse 1s infinite}

.standings{display:flex;gap:0;background:var(--panel);border-top:1px solid var(--rule);overflow-x:auto}
.st{flex:1 1 0;min-width:170px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.1rem .6rem;align-items:center;padding:.5rem 16px;border-right:1px solid var(--rule)}
.st.now{background:var(--panel-2);box-shadow:inset 0 3px 0 var(--gold)}
.st .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .sub{grid-column:2;font-size:var(--s-1);color:var(--ink-2);white-space:nowrap}
.st .pts{grid-row:1/3;grid-column:3;font-family:var(--f-display);font-size:var(--s2);line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.st .pts small{display:block;font-family:var(--f-body);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.st svg{grid-row:1/3}


/* desk mode switch */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;padding:.6rem 1rem;border-bottom:1px solid var(--rule)}
.modes button{border:1px solid var(--rule-hi);background:var(--panel-2);border-radius:var(--radius);padding:.55rem .6rem;font-weight:800;text-align:left;line-height:1.15}
.modes button small{display:block;font-weight:400;font-size:var(--s-1);color:var(--ink-2);margin-top:.15rem}
.modes button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.modes button[aria-pressed="true"] small{color:var(--on-gold);opacity:.8}
.chip.t-ideal{color:var(--t-ideal);border-color:currentColor}
.chip.t-spread{color:var(--t-spread);border-color:currentColor}
.chip.t-resil{color:var(--t-resil);border-color:currentColor}
.detail{--tc:var(--gold)} .detail.t-spread{--tc:var(--t-spread)} .detail.t-resil{--tc:var(--t-resil)}
.detail .trk{color:var(--tc)}
.detail h3{font-size:var(--s3);margin-bottom:.35rem}
.detail .dl{font-family:var(--f-fell);font-size:var(--s1);color:var(--ink);margin:0 0 .8rem;line-height:1.35}
.detail .camp{margin:0 0 .9rem}
.detail .box{margin-top:.2rem}
.fxl{margin:.2rem 0 0;padding-left:1.1rem;display:grid;gap:.2rem}
.fxl .warn{color:var(--danger)} .fxl .calm{color:var(--ok)}
.eff{margin:.1rem 0 0;font-size:var(--s1)}
.mm{width:100%;height:auto;display:block;margin-top:.3rem}
.mm-key{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.75rem;color:var(--ink-2);margin:.3rem 0 0}
.mm-key span{display:inline-flex;align-items:center;gap:.3rem}
.mm-key i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* movement board: fills the map area during a turn */
.board{position:absolute;inset:0;overflow:auto;padding:1rem 16px 1.4rem;background:linear-gradient(180deg,var(--panel) 0,var(--sea) 220px);display:flex;flex-direction:column;gap:1rem}
.bhead{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.bhead .who{display:flex;align-items:center;gap:.8rem;margin-right:auto;min-width:0}
.bhead .who .kicker{margin:0}
.bhead h2{font-family:var(--f-display);font-weight:400;font-size:var(--s3);margin:0;line-height:1}
.bstat{display:flex;flex-direction:column;gap:.15rem}
.bstat .v{font-family:var(--f-display);font-size:var(--s4);line-height:.8;color:var(--gold);font-variant-numeric:tabular-nums}
.bstat .l{font-size:var(--s-1);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:700}
.bstat .s{font-size:.75rem;color:var(--ink-3);max-width:24ch}
.bstat.alarm .meter{width:180px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;align-items:start}
.col{--tc:var(--t-ideal);border-top:4px solid var(--tc);background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:0 0 var(--radius) var(--radius);padding:.9rem .9rem 1rem}
.col.t-spread{--tc:var(--t-spread)} .col.t-resil{--tc:var(--t-resil)}
.col header h3{font-family:var(--f-display);font-weight:400;font-size:var(--s3);margin:0;color:var(--tc);line-height:1}
.col header p{font-size:var(--s-1);color:var(--ink-2);margin:.35rem 0 .9rem;min-height:3.9em}
.tiles{display:grid;gap:.55rem}
.tile{display:grid;grid-template-columns:56px minmax(0,1fr);gap:.8rem;align-items:center;text-align:left;border:1.5px solid var(--rule-hi);background:var(--panel-2);border-radius:var(--radius);padding:.6rem .75rem .6rem .6rem;min-height:76px;position:relative;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--tc);transform:translateY(-1px)}
.tile .seal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.7rem;color:var(--tc);border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);font-variant-numeric:tabular-nums}
.tile .tx{display:flex;flex-direction:column;min-width:0}
.tile .tn{font-weight:800;font-size:var(--s1);line-height:1.15}
.tile .tg{font-size:var(--s-1);color:var(--ink-2);margin-top:.15rem}
.tile .ts{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--ink-3);margin-top:.3rem}
.tile.ok .ts{color:var(--tc)}
.tile.ok{border-color:color-mix(in srgb,var(--tc) 55%,var(--rule-hi))}
.tile.owned{background:color-mix(in srgb,var(--tc) 16%,var(--panel-2));border-color:var(--tc)}
.tile.owned .seal{background:var(--tc);color:var(--on-gold)}
.tile.owned .ts{color:var(--tc)}
.tile.poor .seal,.tile.locked .seal{opacity:.55}
.tile.poor .tn,.tile.locked .tn{color:var(--ink-2)}
.tile.locked{border-style:dashed}
.tile.child{margin-left:1.4rem}
.tile.child::before{content:"";position:absolute;left:calc(-1.4rem + 2px);top:-.6rem;width:calc(1.4rem - 4px);height:calc(50% + .6rem);border-left:2px solid var(--tc);border-bottom:2px solid var(--tc);border-bottom-left-radius:8px;opacity:.6}
.tile.picked{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--tc)}
.tile.flash{animation:adopt .9s ease-out}
@keyframes adopt{0%{box-shadow:0 0 0 0 var(--tc)}100%{box-shadow:0 0 0 18px transparent}}


/* upgrade pop-up */
.upop{--tc:var(--t-ideal)} .upop.t-spread{--tc:var(--t-spread)} .upop.t-resil{--tc:var(--t-resil)}
.uhead{display:flex;align-items:center;gap:1rem}
.uhead .seal{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:2.3rem;color:var(--tc);border:2.5px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.uhead .seal.owned{background:var(--tc);color:var(--on-gold)}
.uhead .kicker{margin:0 0 .2rem;color:var(--tc)}
.upop h2{font-size:clamp(2rem,4vw,3rem)}
.upop .dl{font-family:var(--f-fell);font-size:clamp(1.15rem,1.8vw,1.45rem);line-height:1.35;margin:.8rem 0 1rem;max-width:60ch}
.ugrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
.ugrid .fxl,.ugrid .eff{font-size:var(--s1)}
.ufoot{position:sticky;bottom:calc(-1 * clamp(1.1rem,3vw,2.2rem));margin:1rem calc(-1 * clamp(1.1rem,3vw,2.2rem)) calc(-1 * clamp(1.1rem,3vw,2.2rem));padding:1rem clamp(1.1rem,3vw,2.2rem);background:var(--panel);border-top:1px solid var(--rule);display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.ufoot .btn.gold{font-size:var(--s2);padding:.8rem 1.6rem}
.ufoot .left{color:var(--ink-2);font-size:var(--s-1)}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--on-gold);padding:.75rem 1.3rem;border-radius:var(--radius);font-size:var(--s1);z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:calc(100% - 32px);text-align:center}
.toast.show{animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (max-width: 860px){ .ugrid{grid-template-columns:1fr} }


/* question banks */
.sheet.wide{width:min(100%,1180px)}
.bankpick{display:flex;gap:.7rem;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--rule-hi);border-radius:var(--radius);padding:.55rem .7rem;font-size:var(--s-1);color:var(--ink-2)}
.bankpick b{color:var(--ink)}
.bgrid{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:1.4rem;align-items:start;margin-top:.6rem}
.blist{display:grid;gap:.4rem}
.bk{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:stretch;border:1px solid var(--rule-hi);border-radius:var(--radius);background:var(--panel-2)}
.bk.cur{border-color:var(--gold)}
.bk .use{display:grid;place-items:center;padding:0 .6rem;border-right:1px solid var(--rule)}
.bk .use input{width:20px;height:20px;accent-color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bkname{border:0;background:transparent;text-align:left;padding:.55rem .7rem;min-width:0}
.bkname b{display:block;overflow-wrap:anywhere} .bkname small{color:var(--ink-3)}
.newbank{display:grid;gap:.35rem;margin-top:.6rem;border-top:1px solid var(--rule);padding-top:.8rem}
.bdetail{min-width:0}
.bhd{display:grid;gap:.5rem;margin-bottom:.8rem}
.bhd h3{font-family:var(--f-display);font-weight:400;font-size:var(--s3);margin:0}
.fl{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:800;margin:.5rem 0 .2rem}
.fl.ok{color:var(--ok)}
.sheet input:not([type]),.sheet textarea{width:100%;background:var(--panel-2);border:1px solid var(--rule-hi);border-radius:var(--radius);padding:.5rem .6rem;resize:vertical}
.rename{font-family:var(--f-display);font-size:var(--s2)!important}
.qform{border:1px solid var(--rule-hi);border-radius:var(--radius);padding:.6rem .9rem .9rem;background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
.qform .row{margin-top:.8rem}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:0 .7rem}
.err{color:var(--danger);font-weight:700;margin:.6rem 0 0}
.okmsg{color:var(--ok);font-weight:700;margin:0 0 .4rem}
.paste{margin-top:.8rem;border:1px dashed var(--rule-hi);border-radius:var(--radius);padding:.6rem .9rem}
.paste summary{cursor:pointer;font-weight:800}
.paste textarea{margin:.3rem 0 .6rem}
.paste code{font-size:.8rem;color:var(--ink);overflow-wrap:anywhere}
.export{margin-bottom:.3rem;font-size:.8rem}
.qlist{list-style:decimal;padding-left:1.6rem;margin:0;display:grid;gap:.5rem}
.qlist li{padding:.45rem .6rem;border-bottom:1px solid var(--rule)}
.qlist li.editing{background:var(--panel-2);border-radius:var(--radius)}
.qt{font-weight:700}
.qa{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.qa span{font-size:.8rem;border:1px solid var(--rule-hi);border-radius:3px;padding:.05rem .4rem;color:var(--ink-2)}
.qa span.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.qbtn{margin-top:.35rem;gap:.35rem}
.qbtn .btn{padding:.25rem .6rem;font-size:var(--s-1)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
@media (max-width: 860px){ .bgrid{grid-template-columns:1fr} .ans{grid-template-columns:1fr} }

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(4,10,18,.78);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.sheet{width:min(100%,920px);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--rule-hi);border-radius:8px;padding:clamp(1.1rem,3vw,2.2rem);position:relative}
.sheet h1,.sheet h2{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
.sheet h1{font-size:var(--s4)}
.sheet h2{font-size:var(--s3)}
.sheet p{max-width:65ch}
.kicker{font-size:var(--s-1);text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700;margin:0 0 .4rem}
.close{position:absolute;top:.8rem;right:.8rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.lede{font-family:var(--f-fell);font-size:var(--s1);color:var(--ink-2);margin:.5rem 0 1rem}

/* event card: an engraved broadside */
.event{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 2rem;align-items:start}
.event .yr{font-family:var(--f-display);font-size:clamp(4rem,11vw,8.5rem);line-height:.82;color:var(--gold);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.event .body{min-width:0}
.event h2{font-size:clamp(1.9rem,3.6vw,2.8rem);margin-bottom:.6rem}
.event p.story{font-size:var(--s1);line-height:1.5;margin:0 0 1rem}
.box{border:1px solid var(--rule-hi);border-radius:var(--radius);padding:.75rem .9rem;margin:0 0 .75rem;background:var(--panel-2)}
.box .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:800;margin-bottom:.2rem}
.box.ask{background:transparent;border-style:dashed}
.box.ask p{font-family:var(--f-fell);font-style:italic;font-size:var(--s1);margin:0}

/* setup */
.setup-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.6rem;margin-top:1.2rem}
.gr{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:.5rem;align-items:center;margin-bottom:.5rem}
.gr input,.gr select,.teach select{background:var(--panel-2);border:1px solid var(--rule-hi);border-radius:var(--radius);padding:.5rem .55rem;min-width:0;width:100%}
.lab{font-size:var(--s-1);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:700;margin:0 0 .45rem}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule-hi);border-radius:var(--radius);overflow:hidden;margin-bottom:.35rem}
.seg button{flex:1;border:0;background:var(--panel-2);padding:.5rem .6rem;font-weight:700;border-right:1px solid var(--rule-hi)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.note{font-size:var(--s-1);color:var(--ink-3);margin:0 0 1rem}
.resume{border:1px solid var(--gold-dim);border-radius:var(--radius);padding:.7rem .9rem;margin-top:1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* report + end */
.list{display:grid;gap:.4rem;margin:.6rem 0 1.2rem;padding:0;list-style:none}
.list li{display:flex;gap:.7rem;align-items:center;padding:.5rem .7rem;border:1px solid var(--rule);border-radius:var(--radius);background:var(--panel-2)}
.list li.bad{border-color:color-mix(in srgb,var(--danger) 50%,var(--rule))}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--rule)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:800}
td.num,th.num{text-align:right}
.up-d{color:var(--ok)} .dn-d{color:var(--danger)}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.5rem;margin:.6rem 0 1.2rem}
.hist div{border:1px solid var(--rule);border-radius:var(--radius);padding:.55rem .7rem;font-size:var(--s-1);color:var(--ink-2)}
.hist b{display:block;color:var(--ink);font-size:var(--s0)}
.hist .res{display:block;font-weight:800;margin:.1rem 0 .2rem}
.winner{font-family:var(--f-display);font-size:clamp(2.6rem,7vw,5rem);line-height:1;margin:.2rem 0 .3rem}

/* quiz */
.opts{display:grid;gap:.5rem;margin:1rem 0}
.opt{text-align:left;border:1px solid var(--rule-hi);background:var(--panel-2);border-radius:var(--radius);padding:.75rem .9rem;font-size:var(--s1)}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.opt.wrong{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
.teach .grow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--rule)}
.teach .grow .row{gap:.3rem}
.teach .grow .btn{padding:.3rem .55rem}
.help ol{padding-left:1.2rem;max-width:68ch} .help li{margin:.35rem 0}
.help h3{font-family:var(--f-display);font-weight:400;font-size:var(--s2);margin:1.2rem 0 .3rem}

@media (max-width: 860px){
  #app{height:auto;min-height:100%}
  .stage{grid-template-columns:1fr}
  .mapwrap{height:62vh;min-height:320px}
  .side{border-left:0;border-top:1px solid var(--rule)}
  .setup-grid{grid-template-columns:1fr}
  .event{grid-template-columns:1fr}
  .era .ttl{display:none}
  .react{margin-left:0}
  .gr{grid-template-columns:auto minmax(0,1fr) auto}
  .gr select{grid-column:2/4}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ---------- helpers ---------- */
function has(g, id){ return g.ups.indexOf(id) >= 0; }
function sum(a){ var t = 0; for (var i = 0; i < a.length; i++) t += a[i]; return t; }
function crownOf(S, r){ return Math.max(0, 100 - sum(S.reg[r].s)); }
function rng(S){ // mulberry32, stored in state so saves replay the same way
  var t = (S.seed = (S.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function addShare(S, r, gi, amt){ // take from the Old Order only
  var R = S.reg[r]; if (R.owner != null) return 0;
  var t = Math.min(amt, crownOf(S, r)); R.s[gi] += t; return t;
}
function boostWhere(S, rs, amt){ S.groups.forEach(function(g, i){ rs.forEach(function(r){ if (S.reg[r].s[i] > 0) addShare(S, r, i, amt); }); }); }
function appeal(g, r){
  var a = 0, tags = REG[r].tags;
  g.ups.forEach(function(id){ var u = UPI[id]; if (!u.appeal) return; a += u.appeal.all || 0; tags.forEach(function(t){ a += u.appeal[t] || 0; }); });
  return a;
}
function ownedBy(S, gi){ return RIDS.filter(function(r){ return S.reg[r].owner === gi; }); }
function notoriety(S, gi){
  var g = S.groups[gi], n = 0;
  g.ups.forEach(function(id){ n += UPI[id].noto || 0; });
  return Math.max(0, n) + ownedBy(S, gi).length;
}
function threshold(g){ return has(g, 'militia') ? 50 : 55; }
function scoreOf(S, gi){
  var t = 0; RIDS.forEach(function(r){ var R = S.reg[r]; t += R.owner === gi ? 15 + REG[r].pop * 3 : (R.owner == null ? REG[r].pop * R.s[gi] / 20 : 0); });
  return Math.round(t);
}
function scores(S){ return S.groups.map(function(_, i){ return scoreOf(S, i); }); }

/* ---------- game setup ---------- */
function newGame(cfg){
  var n = cfg.groups.length;
  var S = {
    v:1, seed:(cfg.seed != null ? cfg.seed : (Date.now() & 0x7fffffff)),
    settings:{length:cfg.length, timer:cfg.timer, quiz:cfg.quiz},
    eras:LENGTHS[cfg.length].eras.slice(), eraPos:0, phase:'event', eraApplied:false,
    reaction:15, vienna:false, monroe:false,
    groups:cfg.groups.map(function(g){ return {name:g.name, color:g.color, cradle:g.cradle, mom:10, ups:[], revs:0, camp:0, quizDone:false}; }),
    reg:{}, turnPos:0, order:[], report:null, history:[], quizUsed:[]
  };
  RIDS.forEach(function(r){ S.reg[r] = {resist:REG[r].resist, owner:null, s:new Array(n).fill(0), won:-1}; });
  S.groups.forEach(function(g, i){ var b = CRADLE_EDGE[g.cradle] || 0; S.reg[g.cradle].s[i] = Math.round(20 + b * 3); g.mom += Math.round(b * 2); });
  S.history.push(scores(S));
  return S;
}
function curEra(S){ return ERAI[S.eras[S.eraPos]]; }
function beginEra(S){
  if (!S.eraApplied){ curEra(S).fx(S); S.reaction = Math.min(100, S.reaction); S.eraApplied = true; }
  var n = S.groups.length, start = S.eraPos % n;
  S.order = []; for (var i = 0; i < n; i++) S.order.push((start + i) % n);
  S.turnPos = 0; S.phase = 'turn'; startTurn(S);
}
function curGi(S){ return S.order[S.turnPos]; }
function startTurn(S){ var g = S.groups[curGi(S)]; g.camp = 0; g.quizDone = false; }
function endTurn(S){
  if (S.turnPos < S.order.length - 1){ S.turnPos++; startTurn(S); return 'next'; }
  resolveEra(S); S.phase = 'resolve'; return 'resolve';
}
function nextEra(S){
  if (S.eraPos >= S.eras.length - 1){ S.phase = 'end'; return; }
  S.eraPos++; S.eraApplied = false; S.phase = 'event';
}

function upgradeStatus(S, gi, id){

  var old = {}; RIDS.forEach(function(r){ old[r] = S.reg[r].s.slice(); });
  var lost = new Array(n).fill(0);

  // 1. Ideas spread

    var R = S.reg[r]; if (R.owner != null) return;

        var f = nb[1] === 'L' ? .05 + (has(g,'corr') ? .05 : 0) : .03 + (has(g,'ships') ? .05 : 0);
        d[gi] += src * f * crown / 100;
      });
    });

    for (var gi = 0; gi < n; gi++) R.s[gi] += d[gi] * k;

    for (var i = 0; i < 2 && pool.length; i++){ var j = Math.floor(rng(S) * pool.length); addShare(S, pool[j], gi, 5); pool.splice(j, 1); }
  });

  RIDS.forEach(function(r){
    var R = S.reg[r]; if (R.owner != null) return;
    S.groups.forEach(function(g, gi){
      if (R.s[gi] <= 0) return;
      var loss = R.s[gi] * (.04 + S.reaction / 100 * .22) * R.resist * (1 + notoriety(S, gi) * .06) * (has(g,'underground') ? .65 : 1);
      loss = Math.min(loss, R.s[gi]); R.s[gi] -= loss; lost[gi] += loss;
      if (R.s[gi] < .5) R.s[gi] = 0;

  // 3. Revolutions
  RIDS.forEach(function(r){
    var R = S.reg[r]; if (R.owner != null) return;
    var best = -1; R.s.forEach(function(v, i){ if (best < 0 || v > R.s[best]) best = i; });
    var tie = R.s.some(function(v, i){ return i !== best && Math.abs(v - R.s[best]) < .5; });

    p *= (has(g,'militia') ? .7 : 1) * (has(g,'alliance') ? .6 : 1) * (S.monroe && REG[r].area === 'am' ? .5 : 1);
    if (p > 0 && rng(S) < p){
      var gi = R.owner; R.owner = null; R.won = -1;
      R.s = R.s.map(function(v, i){ return i === gi ? 25 : Math.min(v, 20); });
      R.resist = Math.min(.95, R.resist + .05);
      rep.crushed.push({r:r, g:gi});

    }

  S.groups.forEach(function(g, gi){
    var base = 0; RIDS.forEach(function(r){ var R = S.reg[r]; base += (R.owner === gi ? 100 : (R.owner == null ? R.s[gi] : 0)) * REG[r].pop / 100; });

}

function parseBank(text){

    var f = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split('|')).map(function(x){ return x.trim(); });

  var c = ui.confirm;
  var rows = S ? S.groups.map(function(g, i){ return '<div class="grow">'+cockade(g.color, 24)+'<span><b>'+esc(g.name)+'</b> · '+g.mom+' Momentum</span><span class="row">' +
    [-3,-1,1,3].map(function(d){ return '<button class="btn" data-act="adj" data-g="'+i+'" data-d="'+d+'" aria-label="'+(d > 0 ? 'Add ' : 'Remove ')+Math.abs(d)+' Momentum for '+esc(g.name)+'">'+(d > 0 ? '+' : '−')+Math.abs(d)+'</button>'; }).join('')+'</span></div>'; }).join('') : '<p class="note">No game is running.</p>';
  var conf = function(act, label){ return '<button class="btn" data-act="'+act+'">'+(c === act ? 'Click again to confirm' : label)+'</button>'; };
  return '<button class="btn ghost close" data-act="close">Close</button><div class="teach"><p class="kicker">Teacher controls</p><h2>Adjust the game</h2>' +
    '<p class="lede">Reward participation or fix a misclick with Momentum. These changes take effect right away.</p>'+rows +
    (S ? '<p class="lab" style="margin-top:1.2rem">Turn timer</p><div class="seg">'+[[30,'30s'],[45,'45s'],[60,'60s'],[90,'90s'],[0,'Off']].map(function(v){ return '<button data-act="ttimer" data-v="'+v[0]+'" aria-pressed="'+(S.settings.timer === v[0])+'">'+v[1]+'</button>'; }).join('')+'</div>' +
    '<p class="lab" style="margin-top:1.2rem">Game</p><div class="row">'+(S.phase === 'turn' ? conf('skipera', 'Skip remaining turns this era') : '')+conf('endgame', 'End the game now')+conf('newgame', 'New game')+'</div>' : '') +
    '<p class="lab" style="margin-top:1.2rem">Knowledge check questions</p><div class="bankpick"><span>Using: <b>'+bankSummary()+'</b></span><button class="btn" data-act="banks" data-back="teacher">Manage question banks</button></div>' +
    '<p class="note" style="margin-top:1rem">The game saves in this browser after every move, so you can reload the page or come back to it next class.</p></div>';
}
function bankSummary(){
  var bs = activeBanks(); if (!bs.length) bs = [BUILTIN];
  var n = bs.reduce(function(t, b){ return t + b.qs.length; }, 0);
  return esc(bs.map(function(b){ return b.name; }).join(', ')) + ' · ' + n + ' question' + (n === 1 ? '' : 's');
}
function blankForm(){ return {q:'', a:['','','',''], why:''}; }
function banksView(){
  var B = ui.bank, sel = bankById(B.sel) || BUILTIN, mine = !sel.builtin;
  if (!B.form) B.form = blankForm();
  var list = allBanks().map(function(b){
    var on = QB.active.indexOf(b.id) >= 0;
    return '<div class="bk'+(b.id === sel.id ? ' cur' : '')+'"><label class="use"><input type="checkbox" id="bact-'+b.id+'" data-bactive="'+b.id+'"'+(on ? ' checked' : '')+(b.qs.length ? '' : ' disabled')+'><span class="sr">Use in game</span></label>' +
      '<button class="bkname" data-act="bsel" data-id="'+b.id+'"><b>'+esc(b.name)+'</b><small>'+b.qs.length+' question'+(b.qs.length === 1 ? '' : 's')+(b.builtin ? ' · built in' : '')+'</small></button></div>';
  }).join('');
  var conf = function(key, label, act, extra){ return '<button class="btn'+(B.confirm === key ? ' danger' : '')+'" data-act="'+act+'"'+(extra || '')+'>'+(B.confirm === key ? 'Click again to delete' : label)+'</button>'; };
  var qs = sel.qs.length ? '<ol class="qlist">'+sel.qs.map(function(q, i){
      var wrong = q.a.filter(function(_, k){ return k !== q.c; });
      return '<li'+(B.edit === i ? ' class="editing"' : '')+'><div class="qt">'+esc(q.q)+'</div><div class="qa"><span class="right">'+esc(q.a[q.c])+'</span>'+wrong.map(function(w){ return '<span>'+esc(w)+'</span>'; }).join('')+'</div>' +
        (mine ? '<div class="row qbtn"><button class="btn" data-act="qedit" data-i="'+i+'">Edit</button>'+conf('q'+i, 'Delete', 'qdel', ' data-i="'+i+'"')+'</div>' : '')+'</li>';
    }).join('')+'</ol>' : '<p class="note">This bank has no questions yet. Add one below.</p>';
  var f = B.form;
  var form = mine ? '<div class="qform" id="qform"><p class="lab">'+(B.edit != null ? 'Edit question '+(B.edit + 1) : 'Add a question')+'</p>' +
      '<label class="fl" for="bf-q">Question</label><textarea id="bf-q" data-bf="q" rows="2">'+esc(f.q)+'</textarea>' +
      '<div class="ans"><div><label class="fl ok" for="bf-a0">Correct answer</label><input id="bf-a0" data-bf="a0" value="'+esc(f.a[0])+'"></div>' +
      [1,2,3].map(function(k){ return '<div><label class="fl" for="bf-a'+k+'">Wrong answer'+(k > 1 ? ' (optional)' : '')+'</label><input id="bf-a'+k+'" data-bf="a'+k+'" value="'+esc(f.a[k])+'"></div>'; }).join('')+'</div>' +
      '<label class="fl" for="bf-why">Explanation shown after answering (optional)</label><input id="bf-why" data-bf="why" value="'+esc(f.why)+'">' +
      (B.err ? '<p class="err">'+esc(B.err)+'</p>' : '') +
      '<div class="row"><button class="btn gold" data-act="qadd">'+(B.edit != null ? 'Save changes' : 'Add question')+'</button>'+(B.edit != null ? '<button class="btn" data-act="qcancel">Cancel</button>' : '')+'</div></div>' +
    '<details class="paste"'+(B.paste ? ' open' : '')+'><summary>Add many at once</summary><p class="note">Put one question per line in this order, separated by <b>|</b>:<br><code>Question | Correct answer | Wrong answer | Wrong answer | Wrong answer | Explanation</code><br>The explanation and extra wrong answers are optional. If you use fewer than three wrong answers with an explanation, leave the empty spots between bars, like <code>| |</code>. You can also copy rows straight from a spreadsheet with the columns in that order.</p>' +
      '<textarea id="bf-paste" data-bf="paste" rows="5" placeholder="Who wrote Common Sense? | Thomas Paine | John Adams | Thomas Jefferson | Ben Franklin | Published in 1776">'+esc(B.paste)+'</textarea><button class="btn gold" data-act="bimport">Add these questions</button></details>'
    : '<p class="note">The built-in bank cannot be changed. Make your own copy to edit it.</p>';
  var exportBox = B.exportOpen ? '<textarea id="bf-export" class="export" rows="5" readonly>'+esc(sel.qs.map(bankLine).join('\n'))+'</textarea><p class="note">Copy this text to save the bank or share it. To load it on another computer, create a bank there and paste it into “Add many at once.”</p>' : '';
  return '<button class="btn ghost close" data-act="bankback">Done</button><p class="kicker">Knowledge checks</p><h2>Question banks</h2>' +
    '<p class="lede">Check the banks you want to use this game. Groups get a random question from every checked bank. Your banks are saved in this browser.</p>' +
    (B.msg ? '<p class="okmsg" role="status">'+esc(B.msg)+'</p>' : '') +
    '<div class="bgrid"><div class="blist"><p class="lab">Banks</p>'+list +
      '<div class="newbank"><label class="fl" for="bf-new">New bank name</label><input id="bf-new" data-bf="newName" placeholder="Unit 3: The Constitution" value="'+esc(B.newName)+'"><button class="btn" data-act="bnew">Create bank</button></div></div>' +
    '<div class="bdetail"><div class="bhd">'+(mine ? '<label class="fl" for="bf-rename">Bank name</label><input id="bf-rename" class="rename" data-brename="'+sel.id+'" value="'+esc(sel.name)+'">' : '<h3>'+esc(sel.name)+'</h3>') +
      '<div class="row"><button class="btn" data-act="bcopy">Copy as text</button><button class="btn" data-act="bdup">Make a copy</button>'+(mine ? conf('bank', 'Delete bank', 'bdel') : '')+'</div></div>' +
      exportBox + form + '<p class="lab" style="margin-top:1.2rem">'+sel.qs.length+' question'+(sel.qs.length === 1 ? '' : 's')+'</p>' + qs + '</div></div>';
}

/* ---------- render all ---------- */
function render(){ drawTop(); drawStand(); drawSide(); drawBoard(); drawLinks(); drawNodes(); drawOverlay(); if (ui.modal === 'peek') showReturn(); }

/* ---------- actions ---------- */
function snapshot(){ ui.undo.push(JSON.stringify(S)); if (ui.undo.length > 20) ui.undo.shift(); }
function freshTurn(){ ui.undo = []; ui.turnAt = Date.now(); ui.sel = null; ui.mode = 'map'; ui.pick = null; }
function startGame(){
  var st = ui.setup;
  S = newGame({length:st.length, timer:st.timer, quiz:st.quiz, groups:st.groups.map(function(g, i){ return {name:(g.name.trim() || CRADLES[g.cradle]), color:COLORS[i], cradle:g.cradle}; })});
  ui.modal = null; ui.sel = null; ui.flash = []; save(); render();
}
var ACT = {
  help:function(){ ui.modal = 'help'; drawOverlay(); },
  teacher:function(){ ui.confirm = null; ui.modal = 'teacher'; drawOverlay(); },
  close:function(){ ui.modal = null; ui.quiz = null; ui.confirm = null; render(); },
  closeview:function(){ ui.modal = 'peek'; $('overlay').hidden = true; showReturn(); },
  set:function(el){ var k = el.getAttribute('data-k'), v = el.getAttribute('data-v'); ui.setup[k] = k === 'timer' ? +v : k === 'quiz' ? v === 'true' : v; drawOverlay(); },
  addgroup:function(){ var used = ui.setup.groups.map(function(g){ return g.cradle; }); var free = Object.keys(CRADLES).filter(function(c){ return used.indexOf(c) < 0; })[0]; ui.setup.groups.push({name:'', cradle:free}); drawOverlay(); },
  rmgroup:function(el){ ui.setup.groups.splice(+el.getAttribute('data-i'), 1); drawOverlay(); },
  start:startGame,
  fs:function(){
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    var fail = function(){ toast('Full screen is blocked here. Open the game in its own browser tab, or press F11.'); };
    if (!req){ fail(); return; }
    try{ var p = req.call(el); if (p && p.catch) p.catch(fail); }catch(e){ fail(); }
  },
  banks:function(el){ var B = ui.bank; B.back = el.getAttribute('data-back') || (S ? 'teacher' : null); B.msg = ''; B.err = ''; B.confirm = null; B.exportOpen = false; ui.modal = 'banks'; drawOverlay(); },
  bankback:function(){ var B = ui.bank; B.edit = null; B.form = null; B.err = ''; ui.modal = B.back === 'teacher' ? 'teacher' : null; render(); },
  bsel:function(el){ var B = ui.bank; B.sel = el.getAttribute('data-id'); B.edit = null; B.form = null; B.err = ''; B.msg = ''; B.confirm = null; B.exportOpen = false; drawOverlay(); },
  bnew:function(){
    var B = ui.bank, name = B.newName.trim() || 'My questions', id = 'b' + Date.now().toString(36);
    QB.banks.push({id:id, name:name, qs:[]}); QB.active.push(id); saveBanks();
    B.sel = id; B.newName = ''; B.msg = 'Created “' + name + '”. Add questions on the right.'; B.form = null; B.edit = null; drawOverlay();
    var q = $('bf-q'); if (q) q.focus();
  },
  bdel:function(){
    var B = ui.bank; if (B.confirm !== 'bank'){ B.confirm = 'bank'; drawOverlay(); return; }
    var name = bankById(B.sel).name;
    QB.banks = QB.banks.filter(function(b){ return b.id !== B.sel; }); QB.active = QB.active.filter(function(a){ return a !== B.sel; });
    if (!activeBanks().length && QB.active.indexOf('builtin') < 0) QB.active.push('builtin');
    saveBanks(); B.sel = 'builtin'; B.confirm = null; B.msg = 'Deleted “' + name + '”.'; drawOverlay();
  },
  bdup:function(){
    var B = ui.bank, src = bankById(B.sel), id = 'b' + Date.now().toString(36);
    QB.banks.push({id:id, name:src.name + ' (my copy)', qs:JSON.parse(JSON.stringify(src.qs))});
    QB.active = QB.active.filter(function(a){ return a !== src.id; }); QB.active.push(id); saveBanks();
    B.sel = id; B.msg = 'Made an editable copy. The copy is now in use instead of the original.'; B.form = null; B.edit = null; drawOverlay();
  },
  qadd:function(){
    var B = ui.bank, f = B.form, b = bankById(B.sel); if (!b || b.builtin) return;
    var q = f.q.trim(), right = f.a[0].trim(), wrong = f.a.slice(1).map(function(x){ return x.trim(); }).filter(Boolean);
    if (!q){ B.err = 'Type the question first.'; drawOverlay(); return; }
    if (!right){ B.err = 'Add the correct answer.'; drawOverlay(); return; }
    if (!wrong.length){ B.err = 'Add at least one wrong answer.'; drawOverlay(); return; }
    var item = {q:q, a:[right].concat(wrong), c:0, why:f.why.trim()};
    if (B.edit != null){ b.qs[B.edit] = item; B.msg = 'Saved question ' + (B.edit + 1) + '.'; } else { b.qs.push(item); B.msg = 'Added question ' + b.qs.length + '.'; }
    if (QB.active.indexOf(b.id) < 0) QB.active.push(b.id);
    saveBanks(); B.edit = null; B.form = blankForm(); B.err = ''; drawOverlay(); toast(B.msg);
    var e = $('bf-q'); if (e) try{ e.focus({preventScroll:true}); }catch(x){}
  },
  qedit:function(el){
    var B = ui.bank, i = +el.getAttribute('data-i'), q = bankById(B.sel).qs[i], wrong = q.a.filter(function(_, k){ return k !== q.c; });
    B.edit = i; B.form = {q:q.q, a:[q.a[q.c]].concat(wrong, ['','','']).slice(0, 4), why:q.why || ''}; B.err = ''; B.msg = ''; drawOverlay();
    var e = $('qform'); if (e) try{ e.scrollIntoView({block:'center'}); }catch(x){}
  },
  qcancel:function(){ var B = ui.bank; B.edit = null; B.form = blankForm(); B.err = ''; drawOverlay(); },
  qdel:function(el){
    var B = ui.bank, i = +el.getAttribute('data-i'); if (B.confirm !== 'q' + i){ B.confirm = 'q' + i; drawOverlay(); return; }
    bankById(B.sel).qs.splice(i, 1); B.confirm = null; B.edit = null; B.form = null; B.msg = 'Deleted question ' + (i + 1) + '.'; saveBanks(); drawOverlay();
  },
  bimport:function(){
    var B = ui.bank, b = bankById(B.sel), r = parseBank(B.paste); if (!b || b.builtin) return;
    if (!r.ok.length){ B.err = ''; B.msg = ''; B.paste = B.paste; drawOverlay(); toast('No questions found. Each line needs a question, a correct answer, and at least one wrong answer, separated by |'); return; }
    b.qs = b.qs.concat(r.ok); if (QB.active.indexOf(b.id) < 0) QB.active.push(b.id); saveBanks();
    B.paste = ''; B.msg = 'Added ' + r.ok.length + ' question' + (r.ok.length === 1 ? '' : 's') + '.' + (r.bad.length ? ' Skipped line ' + r.bad.join(', ') + ': each line needs a question, a correct answer, and a wrong answer.' : '');
    drawOverlay(); toast(B.msg);
  },
  bcopy:function(){
    var B = ui.bank, text = (bankById(B.sel) || BUILTIN).qs.map(bankLine).join('\n');
    B.exportOpen = true; drawOverlay();
    var box = $('bf-export');
    var fallback = function(){ if (box){ box.focus(); box.select(); } toast('Select all of the text in the box and copy it.'); };
    try{ navigator.clipboard.writeText(text).then(function(){ toast('Copied ' + (bankById(B.sel) || BUILTIN).qs.length + ' questions to the clipboard.'); }, fallback); }catch(e){ fallback(); }
  },
  resume:function(){ S = loadSaved(); ui.modal = null; if (S && S.phase === 'turn') freshTurn(); render(); },
  begin:function(){ beginEra(S); freshTurn(); save(); render(); },
  mode:function(el){ ui.mode = el.getAttribute('data-mode'); drawSide(); drawBoard(); },
  pick:function(el){ ui.pick = el.getAttribute('data-up'); ui.modal = 'upgrade'; drawBoard(); drawOverlay(); },
  adopt:function(el){ var id = el.getAttribute('data-up'), g = S.groups[curGi(S)]; snapshot();
    if (buy(S, curGi(S), id)){ ui.modal = null; ui.flash = [id]; save(); render(); ui.flash = [];
      toast('<b>'+esc(UPI[id].name)+'</b> adopted · '+g.mom+' Momentum left'); }
    else ui.undo.pop(); },
  campaign:function(el){ var r = el.getAttribute('data-r'); snapshot(); if (campaign(S, curGi(S), r)){ ui.flash = [r]; save(); render(); ui.flash = []; } else ui.undo.pop(); },
  undo:function(){ if (!ui.undo.length) return; S = JSON.parse(ui.undo.pop()); save(); render(); },
  endturn:function(){
    var res = endTurn(S); freshTurn();
    if (res === 'resolve'){ ui.flash = S.report.revs.map(function(x){ return x.r; }).concat(S.report.crushed.map(function(x){ return x.r; })); }
    save(); render(); ui.flash = [];
  },
  next:function(){ nextEra(S); ui.modal = null; ui.sel = null; save(); render(); },
  again:function(){ clearSaved(); S = null; ui.modal = null; ui.sel = null; render(); },
  quiz:function(){
    var g = S.groups[curGi(S)]; if (g.quizDone) return;
    var all = quizPool(), pool = all.filter(function(x){ return S.quizUsed.indexOf(x.key) < 0; });
    if (!pool.length){ S.quizUsed = []; pool = all; }
    var pick = pool[Math.floor(Math.random() * pool.length)], order = pick.q.a.map(function(_, i){ return i; });
    for (var k = order.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)), t = order[k]; order[k] = order[j]; order[j] = t; }
    ui.quiz = {key:pick.key, q:pick.q, order:order, picked:null}; ui.modal = 'quiz'; drawOverlay();
  },
  answer:function(el){
    var q = ui.quiz, a = +el.getAttribute('data-a'), g = S.groups[curGi(S)];
    q.picked = a; g.quizDone = true; S.quizUsed.push(q.key);
    if (a === q.q.c) g.mom += 3;
    save(); drawOverlay(); drawSide(); drawStand();
  },
  adj:function(el){ var g = S.groups[+el.getAttribute('data-g')]; g.mom = Math.max(0, g.mom + (+el.getAttribute('data-d'))); save(); drawOverlay(); drawSide(); drawBoard(); drawStand(); },
  ttimer:function(el){ S.settings.timer = +el.getAttribute('data-v'); ui.turnAt = Date.now(); save(); drawOverlay(); drawSide(); },
  skipera:function(){ if (ui.confirm !== 'skipera'){ ui.confirm = 'skipera'; drawOverlay(); return; }
    ui.confirm = null; ui.modal = null; S.turnPos = S.order.length - 1; ACT.endturn(); },
  endgame:function(){ if (ui.confirm !== 'endgame'){ ui.confirm = 'endgame'; drawOverlay(); return; }
    ui.confirm = null; ui.modal = null; S.phase = 'end'; save(); render(); },
  newgame:function(){ if (ui.confirm !== 'newgame'){ ui.confirm = 'newgame'; drawOverlay(); return; }
    ui.confirm = null; clearSaved(); S = null; ui.modal = null; render(); }
};
function showReturn(){
  var side = $('side');
  side.innerHTML = '<div class="rcard"><p class="hint">Take a look at the map. Click a region for details.</p><button class="btn gold big camp" data-act="close">'+(S.phase === 'end' ? 'Back to the final results' : 'Back to the results')+'</button></div>' + (ui.sel ? regionCard(null) : '');
}

document.addEventListener('click', function(ev){
  if (ev.target.id === 'overlay' && ui.modal === 'upgrade'){ ACT.close(); return; }
  var z = ev.target.closest('[data-zoom]'); if (z){ setView(z.getAttribute('data-zoom')); return; }
  var n = ev.target.closest('.node'); if (n && S){ selectRegion(n.getAttribute('data-r')); return; }
  var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  var f = ACT[b.getAttribute('data-act')]; if (f) f(b);
});
document.addEventListener('keydown', function(ev){
  var n = ev.target.closest && ev.target.closest('.node');
  if (n && (ev.key === 'Enter' || ev.key === ' ')){ ev.preventDefault(); if (S) selectRegion(n.getAttribute('data-r')); }
  if (ev.key === 'Escape' && ui.modal === 'banks'){ ACT.bankback(); return; }
  if (ev.key === 'Escape' && (ui.modal === 'help' || ui.modal === 'teacher' || ui.modal === 'upgrade' || (ui.modal === 'quiz' && ui.quiz && ui.quiz.picked != null))) ACT.close();
});
function selectRegion(r){
  ui.sel = ui.sel === r ? null : r;
  drawLinks(); drawNodes();
  if (ui.modal === 'peek') showReturn(); else drawSide();
}
document.addEventListener('input', function(ev){
  var i = ev.target.getAttribute('data-name'); if (i != null) ui.setup.groups[+i].name = ev.target.value;
  var bf = ev.target.getAttribute('data-bf'), B = ui.bank;
  if (bf){ if (bf.charAt(0) === 'a' && bf.length === 2) B.form.a[+bf.charAt(1)] = ev.target.value; else if (bf === 'q' || bf === 'why') B.form[bf] = ev.target.value; else B[bf] = ev.target.value; }
});
document.addEventListener('change', function(ev){
  var i = ev.target.getAttribute('data-cradle'); if (i != null){ ui.setup.groups[+i].cradle = ev.target.value; drawOverlay(); }
  var ba = ev.target.getAttribute('data-bactive');
  if (ba != null){ QB.active = QB.active.filter(function(a){ return a !== ba; }); if (ev.target.checked) QB.active.push(ba); saveBanks(); ui.bank.msg = ''; drawOverlay(); }
  var br = ev.target.getAttribute('data-brename');
  if (br != null){ var b = bankById(br); if (b && !b.builtin){ b.name = ev.target.value.trim() || b.name; saveBanks(); } }
});

function fsLabel(){ var b = $('fsBtn'); if (b) b.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit full screen' : 'Full screen'; }
document.addEventListener('fullscreenchange', fsLabel); document.addEventListener('webkitfullscreenchange', fsLabel);
/* ---------- boot ---------- */
function start(data){
  if (data && data.S && data.S.reg) S = data.S;
  buildBase(); drawLegend(); setView('world');
  if (S && S.phase === 'turn') freshTurn();
  render();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {S:S}; });
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>

</body></html>
